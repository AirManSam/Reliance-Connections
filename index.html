`<div class="dispatch-workspace"><div class="dispatch-rail">${calendar}<div class="card dispatch-filter-card"><div class="cardhead"><h2>Filter calls</h2><button class="btn small" onclick="dispatchSearch='';dispatchDateFilter='all';dispatchTechFilter='all';dispatchTradeFilter='all';dispatchStatusFilter='open';render()">Reset</button></div><label class="dc-filter-label">Search<input id="dispatchSearch" placeholder="Job, customer, phone…" value="${esc(dispatchSearch)}" oninput="const p=this.selectionStart;dispatchSearch=this.value;render();const e=document.getElementById('dispatchSearch');e?.focus();e?.setSelectionRange(p,p)"></label><label class="dc-filter-label">Date<select id="dispatchDate" onchange="setDispatchDate(this.value)"><option value="all" ${dateVal==='all'?'selected':''}>All dates</option><option value="${today}" ${dateVal===today?'selected':''}>Today</option><option value="${date(1)}" ${dateVal===date(1)?'selected':''}>Tomorrow</option>${[...new Set(db.jobs.map(j=>j.date))].filter(Boolean).sort().map(d=>`<option value="${d}" ${dateVal===d?'selected':''}>${d}</option>`).join('')}</select></label><label class="dc-filter-label">Technician<select onchange="dispatchTechFilter=this.value;render()"><option value="all">All technicians</option>${db.techs.map(t=>`<option value="${t.id}" ${techVal===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label class="dc-filter-label">Trade<select onchange="dispatchTradeFilter=this.value;render()"><option value="all">All trades</option>${db.settings.trades.map(t=>`<option value="${t}" ${tradeVal===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label class="dc-filter-label">Status<select onchange="dispatchStatusFilter=this.value;render()"><option value="open" ${statusVal==='open'?'selected':''}>Open jobs</option><option value="all" ${statusVal==='all'?'selected':''}>All statuses</option>${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed','Cancelled'].map(st=>`<option value="${st}" ${statusVal===st?'selected':''}>${st}</option>`).join('')}</select></label></div><div class="card dispatch-rail-exceptions"><div class="cardhead"><h2>Needs attention</h2>${badge(String(exceptionCount))}</div>${db.jobs.filter(j=>j.status==='On hold'||(j.exceptionReason&&j.exceptionReason!=='Awaiting reason')).slice(0,5).map(j=>`<div class="dc-exception-item"><b>${esc(j.title)}</b><small>${esc(cust(j.customerId).name)} · ${esc(j.exceptionReason||'On hold')}</small><button class="btn small" onclick="editJob('${j.id}')">Open</button></div>`).join('')||'<p class="muted">No active exceptions.</p>'}</div></div><div class="dispatch-main"><div class="dispatch-main-top"><div><div class="eyebrow">LIVE SCHEDULE</div><h2>${dateVal==='all'?'All scheduled calls':dateVal===today?'Today’s calls':dateVal===date(1)?'Tomorrow’s calls':new Date(dateVal+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</h2><p class="muted">Select a day on the calendar or narrow the board with filters.</p></div><div class="dispatch-layout-switch"><button class="btn ${dispatchLayout==='tiles'?'primary':''}" onclick="setDispatchLayout('tiles')">▦ Tile view</button><button class="btn ${dispatchLayout==='kanban'?'primary':''}" onclick="setDispatchLayout('kanban')">Stage board</button></div></div><div class="grid stats dispatch-stats">${stat('Visible calls',filtered.length,'Matching current filters')}${stat('Unassigned',filtered.filter(j=>!j.techId).length,'Need an owner')}${stat('Urgent',filtered.filter(j=>j.priority==='Urgent'&&!['Completed','Cancelled'].includes(j.status)).length,'Open urgent calls','stataccent')}${stat('Conflicts',conflicts.length,'Overlapping technician time')}</div>${conflicts.length?`<div class="notice"><b>Schedule conflicts (${conflicts.length})</b><br>${conflicts.slice(0,5).map(c=>`${esc(tech(c.a.techId).name)} · ${esc(c.a.date)}: ${esc(c.a.title)} overlaps ${esc(c.b.title)}`).join('<br>')}</div>`:''}${dispatchLayout==='t function jobStartMinutes(j){let a=String(j.time||'09:00').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)}function jobEndMinutes(j){return jobStartMinutes(j)+(Number(j.duration)||60)}function minsLabel(n){return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function jobEnd(j){return minsLabel(jobEndMinutes(j))}function dispatchConflicts(list=db.jobs){let out=[];for(let i=0;i<list.length;i++){let a=list[i];if(!a.techId||['Completed','Cancelled'].includes(a.status))continue;for(let k=i+1;k<list.length;k++){let b=list[k];if(a.techId===b.techId&&a.date===b.date&&!['Completed','Cancelled'].includes(b.status)&&jobStartMinutes(a)<jobEndMinutes(b)&&jobStartMinutes(b)<jobEndMinutes(a))out.push({a,b})}}return out}
function assignJob(id,techId){let j=job(id);if(!j)return;let old=j.techId;j.techId=techId;let overlaps=dispatchConflicts(db.jobs).filter(c=>c.a.id===id||c.b.id===id);if(overlaps.length&&!confirm('This assignment overlaps another job for the same technician. Save anyway?')){j.techId=old;render();return}log(`${id} assigned to ${tech(techId).name}`);save(overlaps.length?'Assignment saved with schedule conflict':'Technician assignment updated')}

function customerDetail(id){let c=cust(id);if(!c)return;let jobs=db.jobs.filter(j=>j.customerId===id),ests=db.estimates.filter(e=>e.customerId===id),invs=db.invoices.filter(i=>i.customerId===id),notes=(c.timeline||[]).slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')),followups=(db.followups||[]).filter(f=>f.customerId===id&&f.status!=='Done').sort((a,b)=>a.due.localeCompare(b.due));document.getElementById('customerDetail').innerHTML=`<div class="cardhead"><div>${person(c.name,(c.type||'Residential')+' account')}<div class="muted" style="margin-top:5px">Customer ID: ${esc(c.id)}</div></div><div class="actions"><button class="btn small" onclick="editCustomer('${id}')">Edit</button><button class="btn small" onclick="newCustomerNote('${id}')">＋ Log contact</button><button class="btn small primary" onclick="newFollowup('${id}')">＋ Follow-up</button></div></div><p class="muted">${esc(c.address||'No address')}<br>${esc(c.phone||'No phone')} · ${esc(c.email||'No email')}</p><div class="grid three" style="margin:14px 0">${stat('Assets',(c.assets||[]).length,'Registered equipment')}${stat('Jobs',jobs.length,'Service history')}${stat('Open balance',money(invs.reduce((s,i)=>s+balance(i),0)),'Across invoices')}</div><div class="actions" style="margin-bottom:16px"><button class="btn primary" onclick="newBooking('${id}')">＋ Book call</button><button class="btn" onclick="newEstimateForCustomer('${id}')">＋ Create estimate</button><button class="btn" onclick="newMaintenance('${id}')">＋ Maintenance plan</button></div><div class="cardhead"><h3>Equipment & assets</h3><button class="btn small" onclick="newAsset('${id}')">＋ Add asset</button></div>${(c.assets||[]).map(a=>`<div class="rowitem"><div><b>${esc(a.name)}</b><small>Serial ${esc(a.serial||'—')} · maintenance ${esc(a.next||'not scheduled')}</small></div><button class="btn small" onclick="newMaintenance('${id}','${esc(a.name)}')">Plan service</button> <button class="btn small" onclick="editHVACAsset('${id}','${a.id} function estimatesView(){return heading('Estimates & proposals','Build line-item proposals, present options, and record customer decisions.',`<button class="btn primary" onclick="newEstimate()">＋ Create estimate</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Estimate</th><th>Customer / Job</th><th>Line items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.estimates.map(e=>`<tr><td><b>${e.id}</b><div class="muted">${esc(e.title)}</div></td><td>${esc(cust(e.customerId).name)}<div class="muted">${esc(e.jobId||'Not linked')}</div></td><td>${e.items.length}</td><td>${money(total(e.items))}</td><td>${badge(e.status)}</td><td><div class="actions">${e.status==='Draft'?`<button class="btn small" onclick="estimateStatus('${e.id}','Presented')">Present</button>`:''}${e.status==='Presented'?`<button class="btn small green" onclick="estimateStatus('${e.id}','Approved')">Approve</button><button class="btn small danger" onclick="estimateStatus('${e.id}','Declined')">Decline</button>`:''}${e.status==='Approved'&&!e.converted?`<button class="btn small primary" onclick="convertEstimate('${e.id}')">Add to job</button><button class="btn small green" onclick="invoiceFromEstimate('${e.id}')">Invoice estimate</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No estimates yet. Create one to start.</td></tr>'}</tbody></table></div></div><div class="notice" style="margin-top:14px">Prototype approval records an office-side decision. Customer-facing links, e-signature capture, and automatic email delivery require integrations.</div>`}

function technicianView(){let t=tech(techFilter);let list=db.jobs.filter(j=>j.techId===techFilter&&!['Completed','Cancelled'].includes(j.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return heading('Technician mobile workspace','My jobs, guided status transitions, timestamps, checklists, labor, parts, photos, and customer sign-off.',`<select style="width:auto" onchange="techFilter=this.value;render()">${db.techs.map(x=>`<option value="${x.id}" ${x.id===techFilter?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)+`<div class="mobileframe"><div class="mobiletop"><div><div class="eyebrow">My workday</div><b style="font-size:17px">${esc(t.name)}</b><div class="muted">${esc(t.trade)} technician · ${date()}</div></div><span class="badge green">Field workspace</span></div><div class="grid stats" style="grid-template-columns:repeat(2,1fr)">${stat('Assigned',list.length,'Open jobs')}${stat('Completed',db.jobs.filter(j=>j.techId===techFilter&&j.status==='Completed'&&j.date===date()).length,'Today')}</div>${list.map(j=>`<div class="mobilecard" id="field-${j.id}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center">${badge(j.status)}<span class="muted" style="font-size:10px">${esc(j.date)} · ${esc(j.time)}–${jobEnd(j)}</span></div><h3>${esc(j.title)}</h3><b style="font-size:12px">${esc(cust(j.customerId).name)}</b><p>${esc(cust(j.customerId).phone||'')}<br>${esc(cust(j.customerId).address)}<br>${esc(j.description)}</p><p><b>Equipment:</b> ${esc(j.asset||'Not specified')} · <b>Trade:</b> ${esc(j.trade)}</p><div class="mobileactions"><button class="btn small" onclick="techNote('${j.id}')">＋ Add note</button><button class="btn small" onclick="usePart('${j.id}')">＋ Use part</button><button class="btn small" onclick="techPhoto('${j.id}')">＋ Attach photo</button><button class="btn small" onclick="signature('${j.id}')">Customer sign-off</button><button class="btn small" onclick="recordLabor('${j.id}')">＋ Log labor</button>${/hvac/i.test(j.trade||'')?`<button class="btn small" onclick="newHVACForm('${j.id}')">HVAC readings</button>`:''}<button class="btn small" onclick="manageChecklist('${j.id}')">Checklist (${(j.checklist||[]).filter(x=>x.done).length}/${(j.checklist||[]).length})</button></div><div class="formgrid" style="margin-top:12px"><label class="field">Job status<select onchange="setJobStatus('${j.id}',this.value)">${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed'].map(st=>`<option ${st===j.status?'selected':''}>${st}</option>`).join('')}</select></label><label class="field">Exception / hold reason<input value="${esc(j.exceptionReason||'')}" placeholder="Parts, access, customer…" onchange="saveException('${j.id}',this.value)"></label></div><p class="muted">${(j.notes||[]).length} notes · ${(j.parts||[]).length} part entries · ${(j.photos||[]).length} photos · ${(j.labor||[]).length} labor entries ${j.signature?'· customer sign-off recorded':''}</p>${Object.keys(j.fieldTimes||{}).length?`<div class="rowitem"><div><b>Activity timestamps</b><small>${Object.entries(j.fieldTimes).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(' · ')}</small></div></div>`:''}</div>`).join('')||'<div class="empty"><strong>No assigned open jobs</strong>Assign a work order to this technician in Dispatch.</div>'}<div class="mobilecard"><b>Field workflow</b><p>Use En route → On site → Working → On hold (when needed) → Completed. Status changes and field entries are saved in this browser.</p></div></div><p class="footnote">The office and field views share the same records when used in the same browser profile. Separate devices still require a backend or deliberate export/import sync.</p>`}

function inventoryView(){return heading('Inventory & truck stock','Monitor stock, record usage against work orders, and flag reorder needs.',`<button class="btn primary" onclick="newPart()">＋ Add inventory item</button>`)+`<div class="grid stats">${stat('SKUs',db.inventory.length,'Catalog items')}${stat('Low-stock items',db.inventory.filter(p=>p.qty<=p.min).length,'At or below minimum', 'stataccent')}${stat('Inventory cost',money(db.inventory.reduce((s,p)=>s+p.qty*p.cost,0)),'Estimated stock value')}${stat('Parts issued',db.jobs.reduce((s,j)=>s+j.parts.length,0),'Work order part entries')}</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Part</th><th>SKU</th><th>On hand</th><th>Min stock</th><th>Unit cost</th><th>Price book</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.inventory.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.sku}</td><td><b>${p.qty}</b></td><td>${p.min}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.qty<=p.min?badge('Low stock'):badge('In stock')}</td><td><button class="btn small" onclick="adjustStock('${p.id}')">Adjust</button></td></tr>`).join('')}</tbody></table></div></div>`}
function maintenanceView(){return heading('Maintenance plans','Track preventive maintenance due dates and turn service reminders into bookings.',`<button class="btn primary" onclick="newMaintenance()">＋ Add reminder</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Reminder</th><th>Customer</th><th>Asset</th><th>Due date</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.maintenance.map(m=>`<tr><td><b>${m.id}</b></td><td>${esc(cust(m.customerId).name)}</td><td>${esc(m.asset)}</td><td>${m.due}</td><td>${badge(m.status)}</td><td><div class="actions">${m.status==='Open'?`<button class="btn small primary" onclick="bookMaintenance('${m.id}')">Book service</button><button class="btn small" onclick="completeMaintenance('${m.id}')">Complete</button>`:'—'}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No maintenance reminders.</td></tr>'}</tbody></table></div></div>`}
function payrollView(){let rows=db.techs.map(t=>{let done=db.jobs.filter(j=>j.techId===t.id&&j.status==='Completed'),spiff=done.reduce((s,j)=>s+j.items.reduce((x,i)=>x+(i.spiff||0),0),0);return {...t,count:done.length,spiff}});return heading('Payroll & commissions','Review completed-job incentives and export a preliminary pay summary.',`<button class="btn" onclick="exportPayroll()">Export CSV</button>`)+`<div class="notice">This is an operational estimate only, not a payroll calculation. Base wages, taxes, deductions, overtime, and local employment rules are not included.</div><div class="grid stats">${stat('Completed jobs',db.jobs.filter(j=>j.status==='Completed').length,'All technicians')}${stat('Recorded spiffs',money(rows.reduce((s,t)=>s+t.spiff,0)),'From job line items','stataccent')}${stat('Technicians',db.techs.length,'Configured team')}${stat('Pay periods',1,'Current prototype view')}</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Technician</th><th>Trade</th><th>Completed jobs</th><th>Recorded spiffs</th><th>Variable pay</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${person(t.name,t.id)}</td><td>${t.trade}</td><td>${t.count}</td><td>${money(t.spiff)}</td><td><b>${money(t.spiff)}</b></td></tr>`).join('')}</tbody></table></div></div>`}
function reportsView(){
 const jobs=db.jobs||[],inv=db.invoices||[],ests=db.estimates||[],parts=db.inventory||[],expenses=db.expenses||[],tasks=db.tasks||[],agreements=db.agreements||[],warranties=db.warranties||[],suppliers=db.suppliers||[],timeEntries=db.timeEntries||[],fleet=db.fleet||[];
 const completed=jobs.filter(j=>j.status==='Completed'),openJobs=jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)),approved=ests.filter(e=>e.status==='Approved'),decided=ests.filter(e=>['Approved','Declined'].includes(e.status)),revenue=inv.reduce((s,i)=>s+total(i.items),0),payments=inv.reduce((s,i)=>s+paid(i),0),outstanding=inv.reduce((s,i)=>s+balance(i),0),presented=ests.filter(e=>e.status==='Presented').reduce((s,e)=>s+total(e.items),0),expenseTotal=expenses.reduce((s,e)=>s+Number(e.amount||0),0),stockValue=parts.reduce((s,p)=>s+Number(p.qty||0)*Number(p.cost||0),0),lowStock=parts.filter(p=>Number(p.qty||0)<=Number(p.min||0));
 const byTech=db.techs.map(t=>{let assigned=jobs.filter(j=>j.techId===t.id),done=assigned.filter(j=>j.status==='Completed');return {t,assigned:assigned.length,done:done.length,rate:Math.round(done.length/Math.max(1,assigned.length)*100),value:done.reduce((s,j)=>s+total(j.items),0),hours:assigned.reduce((s,j)=>s+(j.labor||[]).reduce((a,l)=>a+Number(l.hours||0),0),0)}});
 const byTrade=[...new Set(jobs.map(j=>j.trade).filter(Boolean))].map(trade=>({trade,count:jobs.filter(j=>j.trade===trade).length,done:jobs.filter(j=>j.trade===trade&&j.status==='Completed').length,value:jobs.filter(j=>j.trade===trade&&j.status==='Completed').reduce((s,j)=>s+total(j.items),0)}));
 const overdueTasks=tasks.filter(t=>!t.completed&&t.due&&t.due<date()),duePm=(db.maintenance||[]).filter(m=>m.status==='Open'&&m.due<=date(30)),upcomingRenewals=agreements.filter(a=>a.status!=='Cancelled'&&a.renewalDate&&a.renewalDate<=date(60)),warrantyOpen=warranties.filter(w=>!['Resolved','Closed','Denied'].includes(w.status));
 const moduleCards=[['timeclock','◷','Time & labor','Shift totals, break-adjusted hours, and time entry export.'],['profitability','⌁','Job profitability','Revenue vs. linked expenses and identifiable parts cost.'],['expenses','＄','Expenses & job costs','Spend by category, vendor, and linked work order.'],['payroll','＄','Payroll & commissions','Completed jobs, recorded spiffs, and preliminary variable pay.'],['fleet','▰','Fleet & equipment','Asset inventory, maintenance due dates, and service costs.'],['maintenance','◷','Preventive maintenance','Due reminders and maintenance backlog.'],['agreements','▤','Service agreements','Recurring value, included visits, and renewals.'],['warranty','⚑','Warranty claims','Open claims, target dates, resolutions, and costs.'],['suppliers','♧','Supplier directory','Supplier coverage, lead times, and preferred vendors.']].filter(x=>canSee(x[0]));
 const card=(title,sub,body)=>`<div class="card"><div class="cardhead"><div><h2>${title}</h2><p class="muted">${sub}</p></div></div>${body}</div>`;
 const bar=(label,n,max,tail='')=>`<div class="rowitem"><div style="flex:1"><b>${esc(label)}</b><div class="progress"><span style="width:${Math.min(100,n/Math.max(1,max)*100)}%"></span></div></div><b>${n}${tail}</b></div>`;
 return heading('Reports & analytics','A reporting hub for operations, sales, finance, people, assets, inventory, and customer retention. Values update from records saved in this browser.',`<button class="btn" onclick="exportReport()">Export work orders</button><button class="btn" onclick="exportAnalyticsBundle()">Export all report data</button><button class="btn" onclick="window.print()">Print report</button>`)+
 `<div class="grid stats">${stat('Work orders',jobs.length,`${openJobs.length} active / ${completed.length} completed`)}${stat('Completion rate',Math.round(completed.length/Math.max(1,jobs.length)*100)+'%','Completed / all work orders','stataccent')}${stat('Invoice revenue',money(revenue),'Recorded invoice line totals')}${stat('Outstanding A/R',money(outstanding),'Invoice balance remaining','stataccent')}</div>
 <div class="grid three">${stat('Estimate conversion',Math.round(approved.length/Math.max(1,decided.length)*100)+'%',`${approved.length} approved · ${decided.length} decided`)}${stat('Unpaid invoices',inv.filter(i=>balance(i)>0).length,'Invoices with a remaining balance')}${stat('Completed job value',money(completed.reduce((s,j)=>s+total(j.items),0)),'Recorded work-order line items')}</div>
 <div class="grid two" style="margin-top:14px">${card('Operations & workload','Current work mix and service throughput',`<div class="list">${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed','Cancelled'].map(st=>bar(st,jobs.filter(j=>j.status===st).length,jobs.length)).join('')}</div><div class="rowitem"><b>Urgent open work</b><b>${openJobs.filter(j=>j.priority==='Urgent').length}</b></div><div class="rowitem"><b>Unassigned open work</b><b>${openJobs.filter(j=>!j.techId).length}</b></div><div class="rowitem"><b>Overdue follow-up tasks</b><b>${overdueTasks.length}</b></div>`)}${card('Finance & cash collection','Invoices, estimates, and recorded spending',`<div class="rowitem"><b>Recorded invoice totals</b><b>${money(revenue)}</b></div><div class="rowitem"><b>Payments recorded</b><b>${money(payments)}</b></div><div class="rowitem"><b>Outstanding balance</b><b>${money(outstanding)}</b></div><div class="rowitem"><b>Presented estimate value</b><b>${money(presented)}</b></div><div class="rowitem"><b>Approved estimate value</b><b>${money(approved.reduce((s,e)=>s+total(e.items),0))}</b></div><div class="rowitem"><b>Recorded expenses</b><b>${money(expenseTotal)}</b></div><div class="rowitem"><b>Recorded payments / invoiced</b><b>${Math.round(payments/Math.max(1,revenue)*100)}%</b></div><p class="footnote">Uses recorded line totals and payments; tax treatment, refunds, and accounting reconciliation are not inferred.</p>`)}</div>
 <div class="grid two" style="margin-top:14px">${card('Technician performance','Assigned load, completion rate, recorded job value, and logged labor',`<div class="tablewrap"><table><thead><tr><th>Technician</th><th>Assigned</th><th>Completed</th><th>Completion</th><th>Job value</th><th>Labor hours</th></tr></thead><tbody>${byTech.map(r=>`<tr><td><b>${esc(r.t.name)}</b><div class="muted">${esc(r.t.trade)}</div></td><td>${r.assigned}</td><td>${r.done}</td><td>${r.rate}%</td><td>${money(r.value)}</td><td>${r.hours.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><p class="footnote">Job value is based on completed work-order line items, not invoice collections or technician wages.</p>`)}${card('Trade / service-line breakdown','Volume and recorded completed-job value by trade',`<div class="tablewrap"><table><thead><tr><th>Trade</th><th>Work orders</th><th>Completed</th><th>Completed value</th></tr></thead><tbody>${byTrade.map(r=>`<tr><td><b>${esc(r.trade)}</b></td><td>${r.count}</td><td>${r.done}</td><td>${money(r.value)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No trade data yet.</td></tr>'}</tbody></table></div>`)}</div>
 <div class="grid two" style="margin-top:14px">${card('Inventory & purchasing health','Stock valuation, replenishment flags, and supplier coverage',`<div class="rowitem"><b>Catalog items</b><b>${parts.length}</b></div><div class="rowitem"><b>Estimated stock cost value</b><b>${money(stockValue)}</b></div><div class="rowitem"><b>Low / minimum-stock items</b><b>${lowStock.length}</b></div><div class="rowitem"><b>Suppliers on file</b><b>${suppliers.length}</b></div><div class="rowitem"><b>Purchase orders</b><b>${(db.purchaseOrders||[]).length}</b></div><div class="list" style="margin-top:8px">${lowStock.slice(0,8).map(p=>bar(p.name,Number(p.qty||0),Math.max(1,Number(p.min||0)),' on hand')).join('')||'<p class="muted">No items are currently below their minimum stock levels.</p>'}</div>`)}${card('Assets, agreements & warranty','Recurring service, asset readiness, and claims to watch',`<div class="rowitem"><b>Customer assets</b><b>${db.customers.reduce((s,c)=>s+(c.assets||[]).length,0)}</b></div><div class="rowitem"><b>Maintenance reminders due within 30 days</b><b>${duePm.length}</b></div><div class="rowitem"><b>Service agreements</b><b>${agreements.length}</b></div><div class="rowitem"><b>Renewals within 60 days</b><b>${upcomingRenewals.length}</b></div><div class="rowitem"><b>Open warranty claims</b><b>${warrantyOpen.length}</b></div><div class="rowitem"><b>Recorded claim costs</b><b>${money(warranties.reduce((s,w)=>s+Number(w.cost||0),0))}</b></div>`)}</div>
 <div class="grid two" style="margin-top:14px">${card('Customer & sales funnel','Customer mix, estimate decisions, and average ticket',`<div class="rowitem"><b>Total customers</b><b>${db.customers.length}</b></div><div class="rowitem"><b>Commercial accounts</b><b>${db.customers.filter(c=>c.type==='Commercial').length}</b></div><div class="rowitem"><b>Residential accounts</b><b>${db.customers.filter(c=>c.type==='Residential').length}</b></div><div class="rowitem"><b>Draft estimates</b><b>${ests.filter(e=>e.status==='Draft').length}</b></div><div class="rowitem"><b>Presented estimates</b><b>${ests.filter(e=>e.status==='Presented').length}</b></div><div class="rowitem"><b>Declined estimates</b><b>${ests.filter(e=>e.status==='Declined').length}</b></div><div class="rowitem"><b>Average completed work-order value</b><b>${money(completed.reduce((s,j)=>s+total(j.items),0)/Math.max(1,completed.length))}</b></div>`)}${card('Time, labor & operating cost','Logged shifts, labor entries, and expenses',`<div class="rowitem"><b>Time entries</b><b>${timeEntries.length}</b></div><div class="rowitem"><b>Completed time entries</b><b>${timeEntries.filter(t=>t.endAt||t.clockOut).length}</b></div><div class="rowitem"><b>Work-order labor hours</b><b>${jobs.reduce((s,j)=>s+(j.labor||[]).reduce((a,l)=>a+Number(l.hours||0),0),0).toFixed(2)}</b></div><div class="rowitem"><b>Recorded operating expenses</b><b>${money(expenseTotal)}</b></div><div class="rowitem"><b>Fleet / equipment records</b><b>${fleet.length}</b></div><p class="footnote">Shift time and work-order labor logs are separate sources and are not automatically reconciled.</p>`)}</div>
 <div class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Report center</h2><p class="muted">Less-used operational tools are grouped here to keep the main navigation focused.</p></div><span class="badge">${moduleCards.length} tools</span></div><div class="grid three">${moduleCards.map(([id,ico,name,desc])=>`<button class="card" style="text-align:left;cursor:pointer;background:#0e1724" onclick="go('${id}')"><div style="font-size:20px;margin-bottom:8px">${ico}</div><b style="font-size:13px">${name} ↗</b><p class="muted" style="font-size:11px;margin:6px 0 0">${desc}</p></button>`).join('')}</div></div>
 <div class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Recent activity & audit trail</h2><p class="muted">Latest changes recorded by the local workspace.</p></div></div>${(db.activity||[]).slice(0,20).map(a=>`<div class="rowitem"><div><b>${esc(a.text)}</b><small>${esc(a.at)}</small></div></div>`).join('')||'<p class="empty">No activity recorded yet.</p>'}</div>
 <p class="footnote">Reports are calculated from the current browser's saved records. This prototype does not provide a shared database, accounting-grade statements, or guaranteed cross-device synchronization.</p>`
}

function editJob(id){let j=job(id);if(!j)return;let c=cust(j.customerId);modal(`${j.id} · Work order`,`${c.name} · ${j.title}`,`<div class="formgrid"><label class="field">Customer<select id="eCustomer">${customerSelect(j.customerId)}</select></label><label class="field">Technician<select id="eTech">${techSelect(j.techId)}</select></label><label class="field">Job title<input id="eTitle" value="${esc(j.title)}"></label><label class="field">Trade<select id="eTrade">${[...new Set([...db.settings.trades,j.trade])].map(x=>`<option ${x===j.trade?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">Date<input id="eDate" type="date" value="${j.date}"></label><label class="field">Start time<input id="eTime" type="time" value="${j.time}"></label><label class="field">Estimated duration (minutes)<input id="eDuration" type="number" min="15" step="15" value="${j.duration||60}"></label><label class="field">Status<select id="eStatus">${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed','Cancelled'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Priority<select id="ePriority">${['Low','Normal','Urgent'].map(s=>`<option ${s===j.priority?'selected':''}>${s}</option>`).join('')}</select></label><label class="field full">Description<textarea id="eDesc">${esc(j.description)}</textarea></label></div><div class="card" style="margin-top:14px"><div class="cardhead"><h3>Job line items</h3><button class="btn small" onclick="addLineItem('${id}')">＋ Add line</button></div>${j.items.map((it,i)=>`<div class="rowitem"><div><b>${esc(it.name)}</b><small>${it.qty} × ${money(it.price)}</small></div><b>${money(it.qty*it.price)}</b></div>`).join('')||'<p class="muted">No priced work recorded.</p>'}<div class="rowitem"><b>Job total</b><b>${money(total(j.items))}</b></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="newEstimate('${id}')">Create estimate</button function saveJobEdit(id){let j=job(id),before={customerId:j.customerId,techId:j.techId,title:j.title,trade:j.trade,date:j.date,time:j.time,duration:j.duration,status:j.status,priority:j.priority,description:j.description};let next={customerId:document.getElementById('eCustomer').value,techId:document.getElementById('eTech').value,title:document.getElementById('eTitle').value.trim(),trade:document.getElementById('eTrade').value,date:document.getElementById('eDate').value,time:document.getElementById('eTime').value,duration:Math.max(15,Number(document.getElementById('eDuration')?.value)||60),status:document.getElementById('eStatus').value,priority:document.getElementById('ePriority').value,description:document.getElementById('eDesc').value};if(!next.title)return toast('Job title is required');if(next.status==='Completed'&&before.status!=='Completed'){if(!j.signature)return toast('Record customer sign-off in the technician workspace before completing this work order');if(!(j.notes||[]).some(n=>/completion summary/i.test(n.text||'')))return toast('Add a completion summary in the technician workspace before completing this work order')}Object.assign(j,next);let overlaps=dispatchConflicts(db.jobs).filter(c=>c.a.id===id||c.b.id===id);if(overlaps.length&&!confirm('This schedule change overlaps another job for the assigned technician. Save anyway?')){Object.assign(j,before);closeModal();render();return}if(before.status!==j.status){j.statusHistory=j.statusHistory||[];j.statusHistory.push({from:before.status,to:j.status,at:new Date().toLocaleString(),by:activeEmployee().name});j.fieldTimes=j.fieldTimes||{};let stamp={'En route':'enRouteAt','On site':'arrivedAt','Working':'workStartedAt','On hold':'pausedAt','Completed':'completedAt'}[j.status];if(stamp)j.fieldTimes[stamp]=new Date().toLocaleString()}log(`Updated work order ${id} (${j.status})`);closeModal();save(overlaps.length?'Work order updated with schedule conflict':'Work order updated')}
function setJobStatus(id,status){let j=job(id);if(!j)return;let previous=j.status;if(previous===status)return;const workflow={Scheduled:['Dispatched','Cancelled'],Dispatched:['En route','Scheduled','Cancelled'], 'En route':['On site','On hold','Dispatched'], 'On site':['Working','On hold','Completed','En route'],Working:['On site','On hold','Completed'],'On hold':['Dispatched','En route','On site','Working','Cancelled'],Completed:[],Cancelled:[]};if(!(workflow[previous]||[]).includes(status)&&!confirm(`This skips or reverses a usual workflow step (${previous} → ${status}). Continue?`)){render();return}if(status==='Completed'&&previous!=='Completed'){if(!j.title||!j.customerId)return toast('A customer and work-order title are required before completion');if(!(j.notes||[]).some(n=>/completion|completed|repair|diagnos|tested|resolved/i.test(n.text||''))){let summary=prompt('Enter a completion summary (required for closeout):');if(!summary||!summary.trim()){render();return}j.notes=j.notes||[];j.notes.push({text:'Completion summary: '+summary.trim(),at:new Date().toLocaleString(),by:activeEmployee().name})}if(!j.signature){if(confirm('No customer sign-off is recorded. Add it now?')){signature(id);return}else{toast('Record customer sign-off before completing the work order');render();return}}if(!confirm('Complete this work order and update customer/equipment service history?')){render();return}}j.fieldTimes=j.fieldTimes||{};j.statusHistory=j.statusHistory||[];let now=new Date().toLocaleString();const stamp={'En route':'enRouteAt','On site':'arrivedAt','Working':'workStartedAt','On hold':'pausedAt','Completed':'completedAt'}[status];if(stamp)j.fieldTimes[stamp]=now;if(status==='On hold'&&!j.exceptionReason)j.exceptionReason='Awaiting reason';if(status!=='On hold'&&j.exceptionReason==='Awaiting reason')j.exceptionReason='';j.statusHistory.push({from:previous,to:status,at:now,by:activeEmployee().name});j.status=status;if(status==='Completed'&&previous!=='Completed'){let c=cust(j.customerId);c.serviceHistory=c.serviceHistory||[];c.serviceHistory.unshift({jobId:j.id,title:j.title,date:j.date,completedAt:now,asset:j.asset||'',summary:(j.notes||[]).filter(n=>/completion summary/i.test(n.text||'')).map(n=>n.text.replace(/^Completion summary:\s*/i,'')).join(' ')});if(j.asset&&Array.isArray(c.assets)){let a=c.assets.find(x=>x.name===j.asset);if(a){a.lastServiceDate=j.date;a.lastServiceJobId=j.id}}j.closeout={completedAt:now,completedBy:activeEmployee().name,customerSignedBy:j.signature||''};}log(`${id} status changed ${previous} → ${status}`);save(`Job status updated: ${status}`)}

function manageChecklist(id){let j=job(id);j.checklist=j.checklist||[];modal('Job checklist','Add task checks and mark work complete.',`<div id="checkRows">${j.checklist.map((x,i)=>`<div class="rowitem"><label style="display:flex;gap:8px;align-items:center;flex:1"><input type="checkbox" id="check_${i}" ${x.done?'checked':''} style="width:auto"> <span>${esc(x.text)}</span></label><button type="button" class="btn small danger" onclick="removeChecklistItem('${id}',${i})">Remove</button></div>`).join('')}</div><div class="formgrid" style="margin-top:12px"><label class="field full">Add checklist item<input id="checkNew" placeholder="e.g. Test system operation"></label></div>`,`saveChecklist('${id}')`,'Save checklist')}
function removeChecklistItem(id,index){let j=job(id);j.checklist.splice(index,1);closeModal();manageChecklist(id)}function saveChecklist(id){let j=job(id),old=j.checklist||[];j.checklist=old.map((x,i)=>({...x,done:!!document.getElementById('check_'+i)?.checked}));let text=document.getElementById('checkNew').value.trim();if(text)j.checklist.push({text,done:false});log(`Checklist updated on ${id}`);closeModal();save('Checklist saved')}function newCustomer(){modal('Add customer','Create a customer account and service location.',`<div class="formgrid"><label class="field full">Customer / business name<input id="cName" required></label><label class="field">Phone<input id="cPhone"></label><label class="field">Email<input id="cEmail" type="email"></label><label class="field full">Service address<input id="cAddress"></label><label class="field">Account type<select id="cType"><option>Residential</option><option>Commercial</option></select></label></div>`,`saveCustomer()`,'Add customer')}function saveCustomer(){let name=document.getElementById('cName').value.trim();if(!name)return toast('Customer name is required');let c={id:uid('C'),name,phone:document.getElementById('cPhone').value,email:document.getElementById('cEmail').value,address:document.getElementById('cAddress').value,type:document.getElementById('cType').value,assets:[],timeline:[]};db.customers.unshift(c);log(`Added customer ${name}`);closeModal();save('Customer added')}

function newEstimate(jobId=''){let j=job(jobId),cid=j?.customerId||db.customers[0]?.id;modal('Create estimate','Prepare a line-item proposal for customer approval.',`<div class="formgrid"><label class="field">Customer<select id="estCustomer" onchange="refreshEstimateJobs()">${customerSelect(cid)}</select></label><label class="field">Related work order<select id="estJob">${db.jobs.filter(x=>!cid||x.customerId===cid).map(x=>`<option value="${x.id}" ${x.id===jobId?'selected':''}>${x.id} · ${esc(x.title)}</option>`).join('')}</select></label><label class="field full">Proposal title<input id="estTitle" value="${esc(j?.title||'Service proposal')}"></label><label class="field">Line item<input id="estItem" value="Diagnostic / repair labor"></label><label class="field">Qty<input id="estQty" type="number" min="1" value="1"></label><label class="field">Unit price ($)<input id="estPrice" type="number" min="0" step="0.01" value="189"></label><div class="field"><span>Estimate total</span><div id="estTotal" style="font-size:22px;font-weight:800">$189.00</div></div></div><p class="muted" style="margin-top:10px">For this prototype, create one line item per estimate. Add more lines later from the work order.</p>`,`saveEstimate()`,'Create draft')}
function refreshEstimateJobs(){let cid=document.getElementById('estCustomer').value;document.getElementById('estJob').innerHTML=db.jobs.filter(x=>x.customerId===cid).map(x=>`<option value="${x.id}">${x.id} · ${esc(x.title)}</option>`).join('')}function saveEstimate(){let cid=document.getElementById('estCustomer').value,title=document.getElementById('estTitle').value.trim(),name=document.getElementById('estItem').value.trim(),qty=Math.max(1,Number(document.getElementById('estQty').value)),price=Math.max(0,Number(document.getElementById('estPrice').value));if(!title||!name)return toast('Add a title and line item');let e={id:uid('EST'),jobId:document.getElementById('estJob').value,customerId:cid,title,items:[{name,qty,price}],status:'Draft',created:date()};db.estimates.unshift(e);log(`Created estimate ${e.id} for ${cust(cid).name} (${money(total(e.items))})`);closeModal();save('Draft estimate created')}function estimateStatus(id,status){let e=db.estimates.find(x=>x.id===id);e.status=status;log(`Estimate ${id} marked ${status}`);save(`Estimate ${status.toLowerCase()}`)}function convertEstimate(id){let e=db.estimates.find(x=>x.id===id),j=job(e.jobId);if(!j){j={id:uid('WO'),customerId:e.customerId,title:e.title,trade:'Other',asset:'',date:date(),time:'09:00',techId:'',status:'Scheduled',priority:'Normal',description:'Created from approved estimate '+id,items:[],notes:[],photos:[],parts:[],signature:'',created:date()};db.jobs.unshift(j);e.jobId=j.id}j.items.push(...e.items.map(x=>({...x})));e.converted=true;log(`Approved estimate ${id} added to work order ${j.id}`);save('Approved estimate added to job')}

function newInvoice(){let available=db.jobs.filter(j=>j.status==='Completed'&&!db.invoices.some(i=>i.jobId===j.id));modal('Create invoice','Create an invoice from completed work.',`<div class="formgrid"><label class="field full">Completed work order<select id="invJob">${available.map(j=>`<option value="${j.id}">${j.id} · ${esc(cust(j.customerId).name)} · ${esc(j.title)} · ${money(total(j.items))}</option>`).join('')}</select></label><p class="field full muted">The invoice copies job line items. Complete a job and add priced line items before invoicing.</p></div>`,`saveInvoice()`,'Create invoice')};function saveInvoice(){let id=document.getElementById('invJob').value,j=job(id);if(!j)return toast('No eligible completed work orders.');if(db.invoices.some(i=>i.jobId===id))return toast('An invoice already exists for this work order.');db.invoices.unshift({id:uid('INV'),jobId:id,customerId:j.customerId,items:j.items.map(x=>({...x})),status:'Sent',payments:[],created:date()});log(`Created invoice from ${id}`);closeModal();save('Invoice created')}

function recordPayment(id){let i=db.invoices.find(x=>x.id===id),due=balance(i);if(!due)return toast('Invoice is already paid');modal('Record payment',`${id} · remaining balance ${money(due)}`,`<div class="formgrid"><label class="field">Payment amount ($)<input id="payAmount" type="number" min="0.01" max="${due}" step="0.01" value="${due}"></label><label class="field">Payment method<select id="payMethod"><option>Card (manual)</option><option>Cash</option><option>Check</option><option>Bank transfer</option><option>Other</option></select></label><label class="field full">Reference / memo<input id="payMemo" placeholder="Receipt number or notes"></label></div><p class="muted">This records a payment in the prototype. It does not charge a card or move money.</p>`,`savePayment('${id}')`,'Record payment')}function savePayment(id){let i=db.invoices.find(x=>x.id===id),amount=Number(document.getElementById('payAmount').value);if(!Number.isFinite(amount)||amount<=0||amount>balance(i)+.001)return toast('Payment must be positive and no greater than the balance');i.payments.push({amount,method:document.getElementById('payMethod').value,memo:document.getElementById('payMemo').value,at:date()});i.status=balance(i)===0?'Paid':'Partial';log(`Recorded ${money(amount)} payment for ${id}`);closeModal();save('Payment recorded')}

function usePart(id){modal('Record parts used','Reduce inventory and attach usage to this work order.',`<div class="formgrid"><label class="field full">Inventory item<select id="partId">${db.inventory.map(p=>`<option value="${p.id}">${esc(p.name)} · available ${p.qty}</option>`).join('')}</select></label><label class="field">Quantity used<input id="partQty" type="number" min="1" value="1"></label></div>`,`savePart('${id}')`,'Record usage')}function savePart(id){let p=db.inventory.find(x=>x.id===document.getElementById('partId').value),qty=Number(document.getElementById('partQty').value);if(!p||qty<=0||qty>p.qty)return toast('Quantity exceeds available stock');p.qty-=qty;job(id).parts.push({partId:p.id,name:p.name,qty,at:date()});job(id).items.push({name:p.name,qty,price:p.price});log(`${qty} × ${p.name} issued to ${id}`);closeModal();save('Parts usage recorded and stock updated')}

function communicationsView(){let due=(db.followups||[]).filter(f=>f.status!=='Done').sort((a,b)=>(a.due||'').localeCompare(b.due||'')),customers=db.customers;return heading('Customer communications & retention','Consent-aware message drafts, follow-up queue, maintenance renewals, and callback prevention. Messages are prepared here; delivery needs a connected email/SMS provider.','<button class="btn primary" onclick="newCustomerNote(db.customers[0]?.id)">＋ Log contact</button>')+`<div class="grid stats">${stat('Open follow-ups',due.length,'Callbacks and customer actions')}${stat('Overdue',due.filter(f=>f.due<date()).length,'Needs attention','stataccent')}${stat('Agreements renewing',db.agreements.filter(a=>a.status!=='Cancelled'&&a.renewalDate&&a.renewalDate<=date(60)).length,'Next 60 days')}${stat('Customers',customers.length,'Accounts on file')}</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Message builder</h2><span class="badge">Draft only</span></div><div class="formgrid"><label class="field full">Customer<select id="cmCustomer" onchange="buildCustomerMessage()">${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label class="field">Message type<select id="cmType" onchange="buildCustomerMessage()"><option value="booking">Appointment confirmation</option><option value="reminder">Appointment reminder</option><option value="enroute">Technician en route</option><option value="complete">Service completed</option><option value="estimate">Estimate follow-up</option><option value="invoice">Invoice reminder</option><option value="renewal">Maintenance renewal</option><option value="callback">Callback follow-up</option></select></label><label class="field">Related work order<select id="cmJob" onchange="buildCustomerMessage()"><option value="">None</option>${db.jobs.map(j=>`<option value="${j.id}">${j.id} · ${esc(j.title)}</option>`).join('')}</select></label><label class="field full">Draft message<textar function buildCustomerMessage(){let c=cust(document.getElementById('cmCustomer')?.value),j=job(document.getElementById('cmJob')?.value),type=document.getElementById('cmType')?.value;if(!c||!document.getElementById('cmBody'))return;let when=j?`${j.date} at ${j.time}`:'your upcoming service appointment',text={booking:`Hello ${c.name}, Reliance Connections has your service appointment scheduled for ${when}. Please contact us if you need to update access details.`,reminder:`Hello ${c.name}, this is a reminder of your Reliance Connections service appointment for ${when}. Reply or call us if you need to reschedule.`,enroute:`Hello ${c.name}, your Reliance Connections technician is on the way for ${j?.title||'your service appointment'}.`,complete:`Hello ${c.name}, your Reliance Connections service visit is complete. Please contact us with any questions about the work performed or recommendations.`,estimate:`Hello ${c.name}, we're following up on your Reliance Connections estimate. Let us know if you'd like to review the scope or next steps.`,invoice:`Hello ${c.name}, a friendly reminder that your Reliance Connections invoice may have an outstanding balance. Please contact our office if you need a copy or have payment questions.`,renewal:`Hello ${c.name}, your maintenance agreement with Reliance Connections may be approaching renewal. Contact us to review coverage and schedule upcoming service.`,callback:`Hello ${c.name}, we're checking in after your recent Reliance Connections service visit. Please let us know if the issue has returned or if you need additional help.`}[type]||'';document.getElementById('cmBody').value=text}

function saveEmployee(id){let name=document.getElementById('empName').value.trim();if(!name)return toast('Employee name is required');let role=document.getElementById('empRole').value,trade=document.getElementById('empTrade').value,phone=document.getElementById('empPhone').value.trim(),email=document.getElementById('empEmail').value.trim(),skills=document.getElementById('empSkills')?.value.trim()||'',territory=document.getElementById('empTerritory')?.value.trim()||'',workStart=document.getElementById('empStart')?.value||'08:00',workEnd=document.getElementById('empEnd')?.value||'17:00',onCall=!!document.getElementById('empOnCall')?.checked;let e=id?db.employees.find(x=>x.id===id):null;if(!e){e={id:uid('EMP'),active:true};db.employees.push(e)}Object.assign(e,{name,role,trade,phone,email,skills,territory,workStart,workEnd,onCall,active:true});if(role==='Technician'){let t=db.techs.find(x=>x.employeeId===e.id)||db.techs.find(x=>x.name===name);if(!t){t={id:uid('T'),name,trade:trade||'General',phone,employeeId:e.id};db.techs.push(t)}else Object.assign(t,{name,trade:trade||t.trade,phone,employeeId:e.id});if(role==='Technician'){let t=db.techs.find(x=>x.employeeId===e.id||x.name===name);if(t)Object.assign(t,{skills,territory,workStart,workEnd,onCall})}}else db.techs=db.techs.filter(t=>t.employeeId!==e.id&&t.name!==name);log(`${id?'Updated':'Added'} employee ${name} (${role})`);closeModal();save('Employee saved')}

function downloadJSON(payload,name){let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportFullBackup(){downloadJSON({format:'RelianceConnectionsBackup',version:1,exportedAt:new Date().toISOString(),data:db},'reliance-connections-full-backup.json');log('Full workspace backup exported')}function restoreFullBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let raw=JSON.parse(reader.result),next=raw.data||raw;if(!next||!Array.isArray(next.jobs)||!Array.isArray(next.customers)||!Array.isArray(next.techs)||!next.settings)throw new Error('This file does not look like a Reliance Connections workspace backup');if(!confirm('Replace the current local workspace with this backup? Export a backup first if you want to keep current data.'))return;db=next;db.activity=db.activity||[];db.priceBook=db.priceBook||[];db.communications=db.communications||[];db.integrationChecklist=db.integrationChecklist||{};db.followups=db.followups||[];db.tasks=db.tasks||[];db.purchaseOrders=db.purchaseOrders||[];db.fleet=db.fleet||[];db.timeEntries=db.timeEntries||[];db.agreements=db.agreements||[];db.suppliers=db.suppliers||[];db.expenses=db.expenses||[];db.warranties=db.warranties||[];db.jobs.forEach(j=>{j.duration=Number(j.duration)||60;j.statusHistory=j.statusHistory||[];j.checklist=j.checklist||[];j.labor=j.labor||[];j.fieldTimes=j.fieldTimes||{};j.notes=j.notes||[];j.photos=j.photos||[];j.parts=j.parts||[]});if(!db.employees)db.employees=[];if(!db.settings.permissions)db.settings.permissions={};if(!db.activeEmployeeId||!db.employees.some(e=>e.id===db.activeEmployeeId&&e.active))db.activeEmployeeId=db.employees.find(e=>e.active)?.id||'';log('Full workspace backup restored');save('Backup restored successfully')}catch(err){toast('Restore failed: '+err. const LEAD_STAGES=['New','Contacted','Qualified','Estimate sent','Won','Lost'];
function leadsView(){let leads=db.leads||[],open=leads.filter(x=>!['Won','Lost'].includes(x.stage)),due=open.filter(x=>x.followUp&&x.followUp<=date()),value=open.reduce((n,x)=>n+Number(x.value||0),0);return heading('Lead pipeline','Track new opportunities, follow-up commitments, and potential service revenue from first contact through booking.',`<button class="btn" onclick="exportLeads()">Export leads CSV</button><button class="btn primary" onclick="newLead()">＋ Add lead</button>`)+`<div class="grid stats">${stat('Open opportunities',open.length,'Leads not yet won or lost')}${stat('Potential value',money(value),'Estimated pipeline value','stataccent')}${stat('Follow-ups due',due.length,'Due today or overdue',due.length?'stataccent':'')}${stat('Won opportunities',leads.filter(x=>x.stage==='Won').length,'Converted or marked won')}</div><div class="card"><div class="cardhead"><div><h2>Opportunity board</h2><p class="muted">Update a stage directly from each tile. Won leads can be converted into customer records and service calls.</p></div><input id="leadSearch" placeholder="Search leads, phone, email, trade…" oninput="filterLeadTiles(this.value)" style="max-width:280px"></div><div class="kanban" id="leadBoard">${LEAD_STAGES.map(stage=>{let group=leads.filter(x=>x.stage===stage);return `<div class="kancol"><div class="kanhead"><span>${esc(stage)}</span><span class="badge">${group.length}</span></div>${group.map(l=>leadTile(l)).join('')||'<div class="muted" style="padding:10px;font-size:11px">No leads here</div>'}</div>`}).join('')}</div></div><div class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Follow-up watchlist</h2><p class="muted">Open opportunities with an upcoming or overdue callback date.</p></div></div><div class="tablewrap"><table><thead><tr><th>Follow-up</th><th>Lead</th><th>Stage</th><th>Value</th><th>Owner / source</th><th></th></tr></thead><tbody>${open.filter(x=>x.followUp).sort((a,b)=>a.followUp.localeCompare(b.followUp)).map(l=>`<tr><td>${esc(l.followUp)} ${l.followUp<date()?badge('Overdue'):''}</td><td><b>${esc(l.name)}</b><div class="muted">${esc(l.phone||l.email||'No contact details')}</div></td><td>${badge(l.stage)}</td><td>${money(l.value)}</td><td>${esc(l.source||'—')}</td><td><button class="btn small" onclick="editLead('${l.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No dated follow-ups yet.</td></tr>'}</tbody></table></div></div>`}
function leadTile(l){return `<div class="jobtile lead-tile" data-search="${esc([l.name,l.phone,l.email,l.trade,l.source,l.stage].join(' ').toLowerCase())}"><div style="display:flex;justify-content:space-between;gap:6px;align-items:center"><b>${esc(l.name)}</b>${badge(l.stage)}</div><p>${esc(l.trade||'General service')} · ${money(l.value||0)}</p><p>${esc(l.phone||'No phone')}<br>${esc(l.email||'No email')}</p><p><b>Follow-up:</b> ${esc(l.followUp||'Not scheduled')}<br><b>Source:</b> ${esc(l.source||'Not recorded')}</p><div class="filters"><select aria-label="Lead stage" onchange="setLeadStage('${l.id}',this.value)">${LEAD_STAGES.map(x=>`<option ${x===l.stage?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn small" onclick="editLead('${l.id}')">Details</button>${l.stage==='Won'?`<button class="btn small green" onclick="convertLead('${l.id}')">Convert</button>`:''}</div></div>`}
function filterLeadTiles(q){let term=(q||'').toLowerCase();document.querySelectorAll('.lead-tile').forEach(el=>el.style.display=el.dataset.search.includes(term)?'':'none')}
function newLead(){leadModal({id:'',name:'',phone:'',email:'',address:'',type:'Residential',trade:'HVAC',source:'Phone call',stage:'New',value:0,followUp:date(1),notes:''})}
function editLead(id){let l=(db.leads||[]).find(x=>x.id===id);if(l)leadModal(l)}
function leadModal(l){modal(l.id?'Edit lead':'Add lead','Record a prospect and next action. Leads stay separate until you convert them into a customer.',`<div class="formgrid"><label class="field full">Contact / company name<input id="leadName" value="${esc(l.name)}" required></label><label class="field">Phone<input id="leadPhone" value="${esc(l.phone||'')}"></label><label class="field">Email<input id="leadEmail" type="email" value="${esc(l.email||'')}"></label><label class="field full">Service address<input id="leadAddress" value="${esc(l.address||'')}"></label><label class="field">Account type<select id="leadType"><option ${l.type==='Residential'?'selected':''}>Residential</option><option ${l.type==='Commercial'?'selected':''}>Commercial</option></select></label><label class="field">Trade / interest<select id="leadTrade">${(db.settings.trades||[]).map(t=>`<option ${l.trade===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label class="field">Pipeline stage<select id="leadStage">${LEAD_STAGES.map(x=>`<option ${l.stage===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">Estimated opportunity ($)<input id="leadValue" type="number" min="0" step="0.01" value="${Number(l.value||0)}"></label><label class="field">Lead source<select id="leadSource">${['Phone call','Website','Referral','Repeat customer','Walk-in','Marketing campaign','Property manager','Other'].map(x=>`<option ${l.source===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">Next follow-up date<input id="leadFollowUp" type="date" value="${esc(l.followUp||'')}"></label><label class="field full">Notes / requested work<textarea id="leadNotes">${esc(l.notes||'')}</textarea></label></div>`,`saveLead('${l.id||''}')`,l.id?'Save lead':'Create lead')}
function saveLead(id){let name=document.getElementById('leadName').value.trim();if(!name)return toast('Enter a contact or company name');let data={name,phone:document.getElementById('leadPhone').value.trim(),email:document.getElementById('leadEmail').value.trim(),address:document.getElementById('leadAddress').value.trim(),type:document.getElementById('leadType').value,trade:document.getElementById('leadTrade').value,stage:document.getElementById('leadStage').value,value:Math.max(0,Number(document.getElementById('leadValue').value)||0),source:document.getElementById('leadSource').value,followUp:document.getElementById('leadFollowUp').value,notes:document.getElementById('leadNotes').value.trim(),updatedAt:new Date().toISOString()};let l=id?db.leads.find(x=>x.id===id):null;if(!l){l={id:uid('LEAD'),createdAt:new Date().toISOString()};db.leads.unshift(l)}Object.assign(l,data);log(`${id?'Updated':'Created'} lead ${name} · ${data.stage}`);closeModal();save('Lead saved')}
function setLeadStage(id,stage){let l=db.leads.find(x=>x.id===id);if(!l)return;l.stage=stage;l.updatedAt=new Date().toISOString();if(stage==='Won')toast('Lead marked won — convert it to a customer when ready');log(`Lead ${l.name} moved to ${stage}`);save('Lead stage updated')}
function convertLead(id){let l=db.leads.find(x=>x.id===id);if(!l)return;if(l.customerId&&!db.customers.some(c=>c.id===l.customerId))l.customerId='';if(l.customerId){if(confirm('This lead is already linked to a customer. Open that customer profile?')){go('customers');setTimeout(()=>customerDetail(l.customerId),20)}return}let existing=db.customers.find(c=>(l.phone&&c.phone===l.phone)||(l.email&&c.email===l.email)||(c.name.toLowerCase()===l.name.toLowerCase()));if(existing){l.customerId=existing.id;log(`Lead ${l.name} linked to existing customer ${existing.name}`);save('Lead linked to existing customer');return}let c={id:uid('C'),name:l.name,phone:l.phone||'',email:l.email||'',address:l.address||'',type:l.type||'Residential',assets:[],timeline:[{type:'Lead conversion',outcome:'Converted from lead pipeline',notes:l.notes||'',at:new Date().toLocaleString()}]};db.customers.push(c);l.customerId=c.id;l.stage='Won';log(`Lead ${l.name} converted to customer ${c.id}`);if(confirm('Customer created. Book a service call now?')){closeModal();save('Lead converted to customer');go('dispatch');newBooking(c.id);setTimeout(()=>{let title=document.getElementById('bTitle');if(title)title.value=`${l.trade||'Service'} inquiry`;let desc=document.getElementById('bDesc');if(desc)desc.value=l.notes||''},50)}else save('Lead converted to customer')}
function exportLeads(){exportCSV([['Lead ID','Name','Phone','Email','Address','Type','Trade','Stage','Estimated Value','Source','Follow-up','Notes','Customer ID'],...(db.leads||[]).map(l=>[l.id,l.name,l.phone,l.email,l.address,l.type,l.trade,l.stage,l.value,l.source,l.followUp,l.notes,l.customerId||''])],'reliance-leads.csv')}


// Operational task queue: independent, dated tasks that can be linked to customers and work orders.
function tasksView(){let all=db.tasks||[],open=all.filter(t=>t.status!=='Done'),over=open.filter(t=>t.due&&t.due<date()),today=open.filter(t=>t.due===date()),high=open.filter(t=>t.priority==='Urgent');return heading('Tasks & callbacks','One shared queue for customer callbacks, quote follow-ups, internal jobs, and operational reminders.',`<button class="btn" onclick="exportTasks()">Export tasks</button><button class="btn primary" onclick="newTask()">＋ New task</button>`)+`<div class="grid stats">${stat('Open tasks',open.length,'All unfinished work')}${stat('Overdue',over.length,'Past due date',over.length?'stataccent':'')}${stat('Due today',today.length,'Needs attention today')}${stat('Urgent',high.length,'High priority items',high.length?'stataccent':'')}</div><div class="card"><div class="filters"><input id="taskSearch" placeholder="Search tasks, customers, owners…" oninput="filterTaskRows(this.value)"><select id="taskStatusFilter" onchange="filterTaskRows(document.getElementById('taskSearch').value)"><option value="open">Open tasks</option><option value="all">All tasks</option><option value="Done">Completed</option></select><select id="taskTypeFilter" onchange="filterTaskRows(document.getElementById('taskSearch').value)"><option value="all">All types</option>${['Callback','Estimate follow-up','Parts pickup','Internal','Maintenance','Customer issue','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Due</th><th>Task</th><th>Type / priority</th><th>Customer / work order</th><th>Owner</th><th>Status</th><th>Actions</th></tr></thead><tbody id="taskRows">${taskRows(all)}</tbody></table></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Recent workspace activity</h2><span class="muted">Latest 30 events</span></div><div class="list">${(db.activity||[]).slice(0,30).map(a=>`<div class="rowitem"><div><b>${esc(a.text)}</b><small>${esc(a.at)}</small></div></div>`).join('')||'<div class="empty">No activity recorded yet.</div>'}</div></div>`}
function taskRows(list){return list.slice().sort((a,b)=>(a.status==='Done')-(b.status==='Done')||(a.due||'9999').localeCompare(b.due||'9999')).map(t=>`<tr class="task-row" style="${t.status==='Done'?'display:none':''}" data-search="${esc([t.title,t.type,t.priority,t.owner,cust(t.customerId).name,job(t.jobId)?.id,t.notes].join(' ').toLowerCase())}" data-status="${esc(t.status)}" data-type="${esc(t.type||'Other')}"><td>${esc(t.due||'—')} ${t.status!=='Done'&&t.due&&t.due<date()?badge('Overdue'):''}</td><td><b>${esc(t.title)}</b><div class="muted">${esc(t.notes||'')}</div></td><td>${esc(t.type||'Other')}<div>${badge(t.priority||'Normal')}</div></td><td>${t.customerId?esc(cust(t.customerId).name):'—'}<div class="muted">${t.jobId?esc(t.jobId):''}</div></td><td>${esc(t.owner||'Unassigned')}</td><td>${badge(t.status||'Open')}</td><td><button class="btn small" onclick="editTask('${t.id}')">Edit</button> ${t.status!=='Done'?`<button class="btn small green" onclick="finishTask('${t.id}')">Complete</button>`:`<button class="btn small" onclick="reopenTask('${t.id}')">Reopen</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No tasks yet. Add your first callback or reminder.</td></tr>'}
function filterTaskRows(q){let term=(q||'').toLowerCase(),st=document.getElementById('taskStatusFilter')?.value||'open',ty=document.getElementById('taskTypeFilter')?.value||'all';document.querySelectorAll('.task-row').forEach(r=>r.style.display=(!term||r.dataset.search.includes(term))&&(st==='all'||(st==='open'?r.dataset.status!=='Done':r.dataset.status===st))&&(ty==='all'||r.dataset.type===ty)?'':'none')}
function newTask(){taskModal({id:'',title:'',type:'Callback',priority:'Normal',due:date(),status:'Open',customerId:'',jobId:'',owner:'',notes:''})}function newTaskForCustomer(cid,title='Callback review'){taskModal({id:'',title:`${title} · ${cust(cid)?.name||''}`,type:'Callback',priority:'High',due:date(),status:'Open',customerId:cid,jobId:'',owner:activeEmployee().name,notes:'Review recent repeat service visits and determine whether this is a callback, warranty issue, or new repair.'})}function editTask(id){let t=db.tasks.find(x=>x.id===id);if(t)taskModal(t)}
function taskModal(t){modal(t.id?'Edit task':'Create task','Track the next action and who owns it.',`<div class="formgrid"><label class="field full">Task title<input id="taskTitle" value="${esc(t.title)}" required></label><label class="field">Type<select id="taskType">${['Callback','Estimate follow-up','Parts pickup','Internal','Maintenance','Customer issue','Other'].map(x=>`<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Priority<select id="taskPriority">${['Low','Normal','High','Urgent'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Due date<input id="taskDue" type="date" value="${esc(t.due||'')}"></label><label class="field">Owner / assignee<input id="taskOwner" value="${esc(t.owner||'')}" placeholder="Name or team"></label><label class="field">Customer<select id="taskCustomer"><option value="">No customer linked</option>${customerSelect(t.customerId||'')}</select></label><label class="field">Work order<select id="taskJob"><option value="">No work order linked</option>${db.jobs.map(j=>`<option value="${j.id}" ${t.jobId===j.id?'selected':''}>${j.id} · ${esc(j.title)}</option>`).join('')}</select></label><label class="field full">Notes<input id="taskNotes" value="${esc(t.notes||'')}" placeholder="What needs to happen next?"></label></div>`,`saveTask('${t.id||''}')`,'Save task')}
function saveTask(id){let title=document.getElementById('taskTitle').value.trim();if(!title)return toast('Enter a task title');let t=id?db.tasks.find(x=>x.id===id):null;if(!t){t={id:uid('TASK'),createdAt:new Date().toISOString()};db.tasks.unshift(t)}Object.assign(t,{title,type:document.getElementById('taskType').value,priority:document.getElementById('taskPriority').value,due:document.getElementById('taskDue').value,owner:document.getElementById('taskOwner').value.trim(),customerId:document.getElementById('taskCustomer').value,jobId:document.getElementById('taskJob').value,notes:document.getElementById('taskNotes').value.trim(),status:t.status==='Done'?'Done':'Open',updatedAt:new Date().toISOString()});log(`${id?'Updated':'Created'} task: ${title}`);closeModal();save('Task saved')}
function finishTask(id){let t=db.tasks.find(x=>x.id===id);if(t){t.status='Done';t.completedAt=new Date().toISOString();log(`Completed task: ${t.title}`);save('Task completed')}}function reopenTask(id){let t=db.tasks.find(x=>x.id===id);if(t){t.status='Open';t.completedAt='';save('Task reopened')}}function exportTasks(){exportCSV([['ID','Title','Type','Priority','Due','Owner','Customer','Work order','Status','Notes'],...db.tasks.map(t=>[t.id,t.title,t.type,t.priority,t.due,t.owner,cust(t.customerId).name,t.jobId,t.status,t.notes])],'reliance-tasks.csv')}

// Purchasing: draft and place supplier orders, then receive stock into the inventory ledger.
function purchasingView(){let pos=db.purchaseOrders||[],open=pos.filter(p=>!['Received','Cancelled'].includes(p.status)),value=open.reduce((s,p)=>s+Number(p.total||0),0),receiving=pos.filter(p=>['Ordered','Partially received'].includes(p.status));return heading('Purchase orders','Reorder parts, track supplier commitments, and receive quantities directly into inventory.',`<button class="btn" onclick="exportPOs()">Export POs</button><button class="btn primary" onclick="newPO()">＋ Create purchase order</button>`)+`<div class="grid stats">${stat('Purchase orders',pos.length,'All supplier orders')}${stat('Open commitments',open.length,'Drafts and active orders')}${stat('Committed value',money(value),'Estimated open spend','stataccent')}${stat('Awaiting receipt',receiving.length,'Orders in transit')}</div><div class="card"><div class="filters"><input id="poSearch" placeholder="Search PO, supplier, SKU…" oninput="filterPORows(this.value)"><select id="poStatus" onchange="filterPORows(document.getElementById('poSearch').value)"><option value="all">All statuses</option>${['Draft','Ordered','Partially received','Received','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>PO / date</th><th>Supplier</th><th>Items</th><th>Total</th><th>Expected</th><th>Status</th><th>Actions</th></tr></thead><tbody>${pos.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(p=>`<tr class="po-row" data-search="${esc([p.id,p.supplier,(p.items||[]).map(i=>i.name+' '+i.sku).join(' '),p.status].join(' ').toLowerCase())}" data-status="${esc(p.status)}"><td><b>${esc(p.id)}</b><div class="muted">${esc(p.created||'')}</div></td><td>${esc(p.supplier)}</td><td>${(p.items||[]).map(i=>`${esc(i.name)} · ${Number(i.receivedQty||0)}/${Number(i.qty||0)}`).join('<br>')}</td><td>${money(p.total)}</td><td>${esc(p.expected||'—')}</td><td>${badge(p.status)}</td><td><button class="btn small" onclick="editPO('${p.id}')">Details</button> ${p.status==='Draft'?`<button class="btn small primary" onclick="placePO('${p.id}')">Place order</button>`:''} ${['Ordered','Partially received'].includes(p.status)?`<button class="btn small green" onclick="receivePO('${p.id}')">Receive stock</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No purchase orders yet. Create one to start tracking supplier orders.</td></tr>'}</tbody></table></div></div>`}
function filterPORows(q){let term=(q||'').toLowerCase(),st=document.getElementById('poStatus')?.value||'all';document.querySelectorAll('.po-row').forEach(r=>r.style.display=(!term||r.dataset.search.includes(term))&&(st==='all'||r.dataset.status===st)?'':'none')}
function newPO(){poModal({id:'',supplier:'',created:date(),expected:date(7),status:'Draft',notes:'',items:[{inventoryId:db.inventory[0]?.id||'',qty:1,receivedQty:0,cost:db.inventory[0]?.cost||0}]})}function editPO(id){let p=db.purchaseOrders.find(x=>x.id===id);if(p)poModal(p)}
function poModal(p){let items=(p.items||[]);modal(p.id?'Purchase order details':'New purchase order','Add supplier and item quantities. Use Receive stock when the delivery arrives.',`<div class="formgrid"><label class="field">Supplier<input id="poSupplier" value="${esc(p.supplier||'')}" required></label><label class="field">Expected delivery<input id="poExpected" type="date" value="${esc(p.expected||'')}"></label><label class="field full">Order notes<input id="poNotes" value="${esc(p.notes||'')}"></label></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Inventory item</th><th>Order qty</th><th>Unit cost</th></tr></thead><tbody>${[0,1,2,3,4,5].map(i=>{let x=items[i]||{};return `<tr><td><select id="poItem${i}" ${p.status&&p.status!=='Draft'?'disabled':''}><option value="">— none —</option>${db.inventory.map(a=>`<option value="${a.id}" ${x.inventoryId===a.id?'selected':''}>${esc(a.name)} (${esc(a.sku)})</option>`).join('')}</select></td><td><input id="poQty${i}" type="number" min="0" step="1" value="${Number(x.qty||0)}" ${p.status&&p.status!=='Draft'?'disabled':''} style="width:90px"></td><td><input id="poCost${i}" type="number" min="0" step="0.01" value="${Number(x.cost||0)}" ${p.status&&p.status!=='Draft'?'disabled':''} style="width:100px"></td></tr>`}).join('')}</tbody></table></div><p class="muted">${p.id?`Status: ${esc(p.status)} · received quantities are tracked per item.`:'Save as draft, then place the order to enable receiving.'}</p>`,`savePO('${p.id||''}')`,'Save order')}
function savePO(id){let supplier=document.getElementById('poSupplier').value.trim();if(!supplier)return toast('Enter a supplier name');let old=id?db.purchaseOrders.find(x=>x.id===id):null;if(old&&old.status!=='Draft')return toast('Placed purchase orders are locked; use receiving to update stock');let items=[];for(let i=0;i<6;i++){let inventoryId=document.getElementById('poItem'+i).value,qty=Number(document.getElementById('poQty'+i).value)||0,cost=Number(document.getElementById('poCost'+i).value)||0;if(inventoryId&&qty>0)items.push({inventoryId,name:db.inventory.find(x=>x.id===inventoryId)?.name||'Unknown item',sku:db.inventory.find(x=>x.id===inventoryId)?.sku||'',qty,cost,receivedQty:0})}if(!items.length)return toast('Add at least one inventory item with a quantity');let p=old;if(!p){p={id:uid('PO'),created:date(),status:'Draft'};db.purchaseOrders.unshift(p)}Object.assign(p,{supplier,expected:document.getElementById('poExpected').value,notes:document.getElementById('poNotes').value.trim(),items,total:items.reduce((s,x)=>s+x.qty*x.cost,0),updatedAt:new Date().toISOString()});log(`Saved purchase order ${p.id} for ${supplier}`);closeModal();save('Purchase order saved')}
function placePO(id){let p=db.purchaseOrders.find(x=>x.id===id);if(p&&p.status==='Draft'){p.status='Ordered';log(`Placed purchase order ${p.id}`);save('Purchase order marked ordered')}}
function receivePO(id){let p=db.purchaseOrders.find(x=>x.id===id);if(!p)return;let rows=p.items.map((x,i)=>{let inv=db.inventory.find(a=>a.id===x.inventoryId);return `<label class="field full">${esc(inv?.name||x.name)} — ordered ${x.qty}, already received ${x.receivedQty||0}<input id="recv${i}" type="number" min="${Number(x.receivedQty||0)}" max="${Number(x.qty)}" step="1" value="${Number(x.qty)}"></label>`}).join('');modal('Receive purchase order',`Confirm cumulative received quantities for ${p.id}. Inventory increases only by the newly received amount.`,`<div class="formgrid">${rows}</div>`,`applyReceipt('${p.id}')`,'Post receipt')}
function applyReceipt(id){let p=db.purchaseOrders.find(x=>x.id===id);if(!p)return;let all=true,any=false;p.items.forEach((x,i)=>{let n=Math.max(Number(x.receivedQty||0),Math.min(Number(x.qty),Number(document.getElementById('recv'+i).value)||0)),delta=n-Number(x.receivedQty||0);if(delta>0){let inv=db.inventory.find(a=>a.id===x.inventoryId);if(inv)inv.qty=Number(inv.qty||0)+delta;any=true}x.receivedQty=n;if(n<Number(x.qty))all=false});p.status=all?'Received':any?'Partially received':'Ordered';p.receivedAt=all?new Date().toISOString():p.receivedAt||'';log(`Received inventory for ${p.id}; status ${p.status}`);closeModal();save('Receipt posted and inventory updated')}
function exportPOs(){exportCSV([['PO ID','Supplier','Created','Expected','Status','Total','Item','SKU','Ordered qty','Received qty','Unit cost'],...(db.purchaseOrders||[]).flatMap(p=>p.items.map(i=>[p.id,p.supplier,p.created,p.expected,p.status,p.total,i.name,i.sku,i.qty,i.receivedQty,i.cost]))],'reliance-purchase-orders.csv')}

// Fleet and reusable equipment records with service due dates and maintenance history.

// Employee time clock with explicit punch and break events. Entries stay in this browser's local workspace.
function timeClockView(){let who=activeEmployee(),mine=db.timeEntries.filter(x=>x.employeeId===who.id),open=mine.find(x=>!x.clockOut),allOpen=db.timeEntries.filter(x=>!x.clockOut),hours=mine.filter(x=>x.clockOut).reduce((s,x)=>s+Math.max(0,(new Date(x.clockOut)-new Date(x.clockIn))/3600000-(Number(x.breakMinutes)||0)/60),0);let elapsed=open?Math.max(0,Math.floor((Date.now()-new Date(open.clockIn).getTime())/60000)):0;return heading('Time clock','Record technician shifts, breaks, and job-linked labor. This is a manual prototype clock, not a payroll-certified timesheet.',`<button class="btn" onclick="exportTimeEntries()">Export timesheets</button>`)+`<div class="grid stats">${stat('Your status',open?(open.breakStart?'On break':'Clocked in'):'Clocked out',who.name,open?'stataccent':'')}${stat('Current shift',open?Math.floor(elapsed/60)+'h '+(elapsed%60)+'m':'—',open?'Elapsed since clock-in':'No active shift')}${stat('Completed shifts',mine.filter(x=>x.clockOut).length,'Your recorded entries')}${stat('Recorded hours',hours.toFixed(2),'Completed shifts, minus breaks')}</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Shift controls</h2>${badge(open?(open.breakStart?'On break':'Working'):'Not clocked in')}</div>${open?`<div class="notice">Clocked in at ${esc(new Date(open.clockIn).toLocaleString())}${open.jobId?' · Work order '+esc(open.jobId):''}</div><div class="formgrid"><label class="field full">Linked work order<select id="clockJob"><option value="">General / shop time</option>${db.jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)).map(j=>`<option value="${j.id}" ${open.jobId===j.id?'selected':''}>${esc(j.id)} · ${esc(j.title)}</option>`).join('')}</select></label><label class="field full">Shift note<input id="clockNote" value="${esc(open.note||'')}" placeholder="Optional notes for this shift"></label></div><div class="actions" style="margin-top:14px">${open.breakStart?`<button class="btn green" onclick="endBreak('${open.id}')">End break</button>`:`<button class="btn" onclick="startBreak('${open.id}')">Start break</button>`}<button class="btn primary" onclick="clockOut('${open.id}')">Clock out</button></div>`:`<p class="muted">Start a shift when you begin work. Link it to a work order or leave it as general shop time.</p><div class="formgrid"><label class="field full">Work order<select id="clockJob"><option value="">General / shop time</option>${db.jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)).map(j=>`<option value="${j.id}">${esc(j.id)} · ${esc(j.title)}</option>`).join('')}</select></label><label class="field full">Shift note<input id="clockNote" placeholder="Optional notes"></label></div><button class="btn primary" style="margin-top:14px" onclick="clockIn()">Start shift</button>`}</div><div class="card"><div class="cardhead"><h2>Team currently clocked in</h2><span class="badge">${allOpen.length} active</span></div>${allOpen.map(x=>{let e=db.employees.find(e=>e.id===x.employeeId);return `<div class="rowitem"><div><b>${esc(e?.name||x.employeeName||'Former employee')}</b><small>Since ${esc(new Date(x.clockIn).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))} · ${esc(x.jobId||'General time')}</small></div>${badge(x.breakStart?'On break':'Working')}</div>`}).join('')||'<div class="empty">No active shifts recorded.</div>'}<p class="footnote">Team visibility depends on local role access. There is no server-side time validation or shared live clock.</p></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Recent timesheet entries</h2><span class="muted">${mine.length} records</span></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Work order</th><th>Clock in</th><th>Clock out</th><th>Break</th><th>Hours</th><th>Notes</th></tr></thead><tbody>${db.timeEntries.slice().sort((a,b)=>b.clockIn.localeCompare(a.clockIn)).slice(0,100).map(x=>{let e=db.employees.find(e=>e.id===x.employeeId),h=x.clockOut?Math.max(0,(new Date(x.clockOut)-new Date(x.clockIn))/3600000-(Number(x.breakMinutes)||0)/60):null;return `<tr><td>${esc(x.clockIn.slice(0,10))}</td><td>${esc(e?.name||x.employeeName||'Unknown')}</td><td>${esc(x.jobId||'General')}</td><td>${esc(new Date(x.clockIn).toLocaleTimeString())}</td><td>${x.clockOut?esc(new Date(x.clockOut).toLocaleTimeString()):badge('Active')}</td><td>${Number(x.breakMinutes)||0} min</td><td>${h===null?'—':h.toFixed(2)}</td><td>${esc(x.note||'')}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">No timesheet entries yet.</td></tr>'}</tbody></table></div></div>`}
function clockIn(){if(db.timeEntries.some(x=>x.employeeId===activeEmployee().id&&!x.clockOut))return toast('You already have an open shift');let e=activeEmployee();db.timeEntries.unshift({id:uid('TIME'),employeeId:e.id,employeeName:e.name,clockIn:new Date().toISOString(),clockOut:'',jobId:document.getElementById('clockJob').value,note:document.getElementById('clockNote').value.trim(),breakMinutes:0,breakStart:''});log(`${e.name} clocked in`);save('Shift started')}
function startBreak(id){let x=db.timeEntries.find(x=>x.id===id);if(!x||x.clockOut||x.breakStart)return toast('Break cannot be started');x.breakStart=new Date().toISOString();log(`${activeEmployee().name} started a break`);save('Break started')}
function endBreak(id){let x=db.timeEntries.find(x=>x.id===id);if(!x||!x.breakStart)return toast('No active break found');x.breakMinutes=(Number(x.breakMinutes)||0)+Math.max(0,Math.round((Date.now()-new Date(x.breakStart).getTime())/60000));x.breakStart='';log(`${activeEmployee().name} ended a break`);save('Break ended')}
function clockOut(id){let x=db.timeEntries.find(x=>x.id===id);if(!x||x.clockOut)return;if(x.breakStart){x.breakMinutes=(Number(x.breakMinutes)||0)+Math.max(0,Math.round((Date.now()-new Date(x.breakStart).getTime())/60000));x.breakStart=''}x.jobId=document.getElementById('clockJob').value||x.jobId;x.note=document.getElementById('clockNote').value.trim();x.clockOut=new Date().toISOString();log(`${activeEmployee().name} clocked out`);save('Shift ended')}
function exportTimeEntries(){exportCSV([['Entry ID','Employee','Employee ID','Work order','Clock in','Clock out','Break minutes','Hours','Notes'],...db.timeEntries.map(x=>{let h=x.clockOut?Math.max(0,(new Date(x.clockOut)-new Date(x.clockIn))/3600000-(Number(x.breakMinutes)||0)/60):'';return [x.id,x.employeeName||db.employees.find(e=>e.id===x.employeeId)?.name,x.employeeId,x.jobId,x.clockIn,x.clockOut,x.breakMinutes,h===''?'':h.toFixed(2),x.note]})],'reliance-timesheets.csv')}
