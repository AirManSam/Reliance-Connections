    // ==========================================
    // SECTION: STATE MANAGEMENT & HELPERS
    // ==========================================
    function loadAppState() {
      const saved = localStorage.getItem('reliance_crm_state_mobile_v1');
      return saved ? JSON.parse(saved) : INITIAL_STATE;
    }

    function saveAppState() {
      localStorage.setItem('reliance_crm_state_mobile_v1', JSON.stringify(appState));
      renderApp();
    }

    let appState = loadAppState();

    function updateSearch(value) {
      appState.searchTerm = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function updateAuditFilter(field, value) {
      appState.auditFilter[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function resetAuditFilters() {
      appState.auditFilter = { search: '', user: '', customer: '', date: '' };
      saveAppState();
    }

    function updateTimeFilters(field, value) {
      appState[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function updateRestockFilters(field, value) {
      appState[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function setView(view) {
      appState.currentView = view;
      appState.searchTerm = '';
      appState.mobileMenuOpen = false;
      saveAppState();
    }

    function toggleMobileMenu() {
      appState.mobileMenuOpen = !appState.mobileMenuOpen;
      renderApp();
    }

    function closeModal() {
      appState.activeModal = null;
      renderApp();
    }


    // ==========================================
    // SECTION: MAIN RENDERER & ROUTER
    // ==========================================
    function renderApp() {
      const root = document.getElementById('app');
      
      if (!appState.currentUser) {
        root.innerHTML = renderLoginScreen();
        return;
      }

      root.innerHTML = `
        <div class="flex flex-col md:flex-row h-screen bg-slate-900 overflow-hidden relative">
          <!-- Mobile & Desktop Navigation Sidebar -->
          ${renderSidebar()}
          
          <div class="flex-1 flex flex-col overflow-hidden w-full">
            ${renderHeader()}
            <main class="flex-1 overflow-y-auto p-3 sm:p-6 bg-slate-900/50 custom-scrollbar relative">
              ${renderCurrentView()}
            </main>
          </div>
        </div>
        <!-- Global Popup Modal Window Container -->
        ${renderActiveModal()}
      `;
    }

    function renderCurrentView() {
      switch (appState.currentView) {
        case 'dashboard': return renderDashboardView();
        case 'customers': return renderCustomersView();
        case 'contacts': return renderContactsView();
        case 'time_report': return renderTimeReportView();
        case 'restock_report': return renderRestockReportView();
        case 'csr_board': return renderCSRBoardView();
        case 'dispatch_board': return renderDispatchBoardView();
        case 'maintenance': return renderMaintenanceView();
        case 'work_orders': return renderWorkOrdersView();
        case 'price_book': return renderPriceBookView();
        case 'manuals': return renderManualsView();
        case 'logs': return renderLogsView();
        default: return renderDashboardView();
      }
    }


    // ==========================================
    // SECTION: AUTHENTICATION & LOGIN SCREEN
    // ==========================================
    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-700"></div>
            
            <div class="text-center mb-6 sm:mb-8">
              <div class="inline-flex items-center justify-center bg-red-600 px-3.5 py-1.5 rounded-lg mb-3 shadow-md">
                <span class="font-sans font-bold text-xl tracking-normal text-white">R</span><span class="font-sans font-bold text-xl tracking-normal text-white ml-1">C</span>
              </div>
              <h1 class="text-xl sm:text-2xl font-bold text-white tracking-wide">RELIANCE CONNECTIONS</h1>
              <p class="text-[11px] text-slate-400 mt-1 uppercase tracking-widest font-semibold">Field Operations CRM (Mobile)</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 sm:space-y-5">
              <div>
                <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Select Account</label>
                <select id="loginUserSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-red-500 transition">
                  ${appState.users.map(u => `<option value="${u.id}">${u.name} — (${u.role.toUpperCase()})</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" value="password" id="loginPassword" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-red-500 transition" required />
              </div>

              <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to CRM
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const userId = document.getElementById('loginUserSelect').value;
      const user = appState.users.find(u => u.id === userId);
      if (user) {
        appState.currentUser = user;
        saveAppState();
      }
    }

    function handleLogout() {
      appState.currentUser = null;
      appState.mobileMenuOpen = false;
      saveAppState();
    }

        { id: 'time_report', label: 'Time', icon: 'fa-clock', roles: ['manager', 'csr', 'dispatcher', 'technician'] },
        { id: 'restock_report', label: 'Restock', icon: 'fa-boxes-packing', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'csr_board', label: 'CSR Slot Booking', icon: 'fa-calendar-days', roles: ['manager', 'csr'] },
        { id: 'dispatch_board', label: 'Multi-Dispatch Board', icon: 'fa-headset', roles: ['manager', 'dispatcher', 'parts'] },
        { id: 'maintenance', label: 'Maintenance Tracker', icon: 'fa-screwdriver-wrench', roles: ['manager', 'csr', 'dispatcher'] },
        { id: 'work_orders', label: 'Work Orders & Estimates', icon: 'fa-clipboard-list', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'price_book', label: 'Company Price Book', icon: 'fa-book-open', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'manuals', label: 'Manuals & Formulas', icon: 'fa-folder-open', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'logs', label: 'Activity & Audit Logs', icon: 'fa-shield-halved', roles: ['manager'] }

      const filteredNav = navItems.filter(item => item.roles.includes(userRole));

      return `
        <!-- Mobile Drawer Overlay -->
        ${appState.mobileMenuOpen ? `
          <div onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm"></div>
        ` : ''}

        <aside class="fixed md:static inset-y-0 left-0 z-50 w-72 md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between transform ${appState.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-200 ease-in-out">
          <div>
            <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="bg-red-600 px-2.5 py-1 rounded shadow-md flex items-center">
                  <span class="font-sans font-bold text-base tracking-normal text-white">R</span><span class="font-sans font-bold text-base tracking-normal text-white ml-1">C</span>
                </div>
                <div>
                  <h1 class="font-bold text-white tracking-wide text-sm leading-tight">RELIANCE</h1>
                  <p class="text-[10px] text-red-500 font-bold uppercase tracking-widest leading-tight">CONNECTIONS</p>
                </div>
              </div>
              <button onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)] custom-scrollbar">
              ${filteredNav.map(item => `
                <button onclick="setView('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${
                  appState.currentView === item.id 
                    ? 'bg-red-600 text-white shadow-lg shadow-red-600/20' 
                    : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'
                }">
                  <i class="fa-solid ${item.icon} w-5 text-center"></i>
                  ${item.label}
                </button>
              `).join('')}
            </nav>
          </div>

          <div class="p-4 border-t border-slate-800 bg-slate-950/80">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-red-500 text-sm flex-shrink-0">

            </div>
          </div>
        </aside>
      `;
    }

    function renderHeader() {
      return `
        <header class="bg-slate-950 border-b border-slate-800 py-3 px-4 sm:px-6 flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-3 overflow-hidden">
            <button onclick="toggleMobileMenu()" class="md:hidden text-slate-300 hover:text-white p-1.5 bg-slate-900 border border-slate-800 rounded-lg">
              <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <div class="truncate">
              <h2 class="text-sm sm:text-lg font-bold text-white capitalize truncate">
                ${appState.currentView.replace('_', ' ')}
              </h2>
              <p class="text-[10px] text-slate-500 hidden sm:block">Trades: HVAC, Plumbing, Electrical, Gates, Generators, Time</p>
            </div>
          </div>

          <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
            ${appState.currentUser.role === 'manager' ? `
              <button onclick="openAddTeamMemberModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold py-2 px-2.5 rounded-lg flex items-center gap-1.5 transition">
                <i class="fa-solid fa-user-plus text-red-500"></i> <span class="hidden sm:inline">Add Team</span>
              </button>
            ` : ''}
            <button onclick="openNewCustomerModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-2.5 rounded-lg shadow flex items-center gap-1.5 transition">
              <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">New Customer</span>
            </button>
          </div>
        </header>
      `;
    }

        <div class="space-y-4 sm:space-y-6">

    // ==========================================
    // SECTION: VIEW - TIME REPORT
    // ==========================================
    function renderTimeReportView() {
      const isManager = appState.currentUser.role === 'manager';
      const currentUser = appState.currentUser;

      let targetTechName = '';
      if (!isManager) {
        targetTechName = currentUser.name;
      } else if (appState.timeReportTechId) {
        const foundTech = appState.technicians.find(t => t.id === appState.timeReportTechId);
        if (foundTech) targetTechName = foundTech.name;
      }

      const selectedDate = appState.timeReportDate || new Date().toISOString().split('T')[0];

      const matchingWorkOrders = appState.workOrders.filter(wo => {
        const matchesDate = wo.createdDate === selectedDate;
        const matchesTech = isManager ? (!appState.timeReportTechId || wo.techName === targetTechName) : (wo.techName === currentUser.name);
        return matchesDate && matchesTech;
      });

      let totalMinutes = 0;
      let totalSpiff = 0;
      matchingWorkOrders.forEach(wo => {
        (wo.lineItems || []).forEach(item => {
          totalMinutes += (item.minutes || 0) * (item.qty || 1);
          totalSpiff += (item.spiff || 0) * (item.qty || 1);
        });
      });

      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h3 class="font-bold text-white text-sm">Daily Technician Time & Earnings Report</h3>
              <p class="text-xs text-slate-400 mt-1">Review jobs visited, site duration, minutes, and SPIFF bonuses</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
              ${isManager ? `
                <div class="flex-1 sm:flex-none">
                  <label class="block text-[10px] text-slate-400 uppercase font-semibold mb-1">Select Technician</label>
                  <select onchange="updateTimeFilters('timeReportTechId', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500">
                    <option value="">All Technicians</option>
                    ${appState.technicians.map(t => `<option value="${t.id}" ${appState.timeReportTechId === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                  </select>
                </div>
              ` : ''}
              <div class="flex-1 sm:flex-none">
                <label class="block text-[10px] text-slate-400 uppercase font-semibold mb-1">Report Date</label>
                <input type="date" value="${selectedDate}" onchange="updateTimeFilters('timeReportDate', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500" />
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400 uppercase font-semibold">Total Minutes for ${selectedDate}</span>
                <p class="text-2xl font-black text-amber-400 mt-1">${totalMinutes} Mins</p>
              </div>
              <div class="w-10 h-10 rounded-lg bg-amber-950/40 border border-amber-800/50 flex items-center justify-center text-amber-400">
                <i class="fa-solid fa-clock"></i>
              </div>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400 uppercase font-semibold">Total SPIFF Bonus for ${selectedDate}</span>
                <p class="text-2xl font-black text-rose-400 mt-1">$${totalSpiff.toFixed(2)}</p>
              </div>
              <div class="w-10 h-10 rounded-lg bg-rose-950/40 border border-rose-800/50 flex items-center justify-center text-rose-400">
                <i class="fa-solid fa-award"></i>
              </div>
            </div>
          </div>

          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
              <table class="w-full text-left text-xs text-slate-300 min-w-[650px]">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="p-3 sm:p-4">Job #</th>
                    <th class="p-3 sm:p-4">Customer Name</th>
                    <th class="p-3 sm:p-4">Assigned Tech</th>
                    <th class="p-3 sm:p-4">Trade</th>
                    <th class="p-3 sm:p-4">Duration</th>
                    <th class="p-3 sm:p-4 text-center">Minutes</th>
                    <th class="p-3 sm:p-4 text-right">SPIFF</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${matchingWorkOrders.length > 0 ? matchingWorkOrders.map(wo => {
                    const woMinutes = (wo.lineItems || []).reduce((acc, item) => acc + ((item.minutes || 0) * (item.qty || 1)), 0);
                    const woSpiff = (wo.lineItems || []).reduce((acc, item) => acc + ((item.spiff || 0) * (item.qty || 1)), 0);
                    const durationHours = (woMinutes / 60).toFixed(1);

                    return `
                      <tr class="hover:bg-slate-900/50">
                        <td class="p-3 sm:p-4 font-mono font-bold text-red-400 whitespace-nowrap">${wo.id}</td>
                        <td class="p-3 sm:p-4 font-bold text-white whitespace-nowrap">${wo.customerName}</td>
                        <td class="p-3 sm:p-4 text-slate-300 whitespace-nowrap">${wo.techName || 'Unassigned'}</td>
                        <td class="p-3 sm:p-4 whitespace-nowrap"><span class="px-2 py-0.5 bg-slate-800 rounded text-slate-200 font-semibold">${wo.trade}</span></td>
                        <td class="p-3 sm:p-4 text-slate-300 whitespace-nowrap">${durationHours} hrs</td>
                        <td class="p-3 sm:p-4 text-center font-mono font-bold text-amber-400 whitespace-nowrap">${woMinutes} Mins</td>
                        <td class="p-3 sm:p-4 text-right font-mono font-bold text-rose-400 whitespace-nowrap">$${woSpiff.toFixed(2)}</td>
                      </tr>
                    `;
                  }).join('') : `
                    <tr>
                      <td colspan="7" class="p-6 text-center text-slate-500 italic">No job records found for this date and technician filter.</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

              <div class="flex-1 sm:flex-none">

            </div>

          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">

                  <tr>
                    <th class="p-3 sm:p-4">Job #</th>

                    <tr class="hover:bg-slate-900/50">

                  <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-red-950/60 text-red-400 border border-red-800/40">Tech Support</span>

                      <button onclick="deleteContact('${cnt.id}')" title="Delete Contact" class="text-slate-500 hover:text-red-400 text-xs">

                      </button>
                    </div>
                  </div>

                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openAddContactModal() {
      const name = prompt("Enter Tech Support / Vendor Name:");
      if (!name) return;
      const phone = prompt("Phone Number:", "555-0100");
      const email = prompt("Email Address:", "support@vendor.com");
      const address = prompt("Physical/Mailing Address:", "123 Support Way");

      appState.contacts.push({
        id: 'cnt-' + Date.now(),
        name,
        phone: phone || '',
        email: email || '',
        address: address || ''
      });

      saveAppState();
    }

    function openEditContactModal(contactId) {
      const cnt = appState.contacts.find(c => c.id === contactId);
      if (!cnt) return;
      appState.activeModal = { type: 'editContact', contactId, data: { ...cnt } };
      renderApp();
    }

    function saveEditContact(e, contactId) {
      e.preventDefault();
      const cnt = appState.contacts.find(c => c.id === contactId);
      if (!cnt) return;

      cnt.name = document.getElementById('modalContactName').value;
      cnt.phone = document.getElementById('modalContactPhone').value;
      cnt.email = document.getElementById('modalContactEmail').value;
      cnt.address = document.getElementById('modalContactAddress').value;

      closeModal();
    }

    function deleteContact(id) {
      if (confirm("Are you sure you want to remove this contact?")) {
        appState.contacts = appState.contacts.filter(c => c.id !== id);
        saveAppState();
      }
    }

    // SECTION: VIEW - CUSTOMERS & ASSETS
    // ==========================================

    function saveEditCustomer(e, customerId) {
      e.preventDefault();

    function bookCSRSlot(time, station) {
      const custName = prompt("Enter Customer Name for Booking:");
      if (!custName) return;
      const jobType = prompt("Enter Service Type (e.g., Gate Repair, HVAC Tuneup, Generator Check):", "Routine Maintenance");

      const slotRow = appState.csrSlots.find(s => s.time === time);
      if (slotRow) {
        slotRow[station] = { booked: true, jobType: jobType || 'Service Call', customer: custName };
        saveAppState();
      }
    }

    function editCSRSlot(time, station) {
      const slotRow = appState.csrSlots.find(s => s.time === time);
      if (!slotRow || !slotRow[station].booked) return;

      appState.activeModal = { type: 'editCSR', time, station, data: { ...slotRow[station] } };
      renderApp();
    }

    function saveEditCSRSlot(e, time, station) {
      e.preventDefault();
      const slotRow = appState.csrSlots.find(s => s.time === time);
      if (!slotRow) return;

      slotRow[station] = {
        booked: true,
        customer: document.getElementById('modalCSRCustomer').value,
        jobType: document.getElementById('modalCSRJobType').value
      };

      closeModal();
    }

    function clearCSRSlot(time, station) {
      if (confirm("Are you sure you want to clear/unbook this CSR slot?")) {
        const slotRow = appState.csrSlots.find(s => s.time === time);
        if (slotRow) {
          slotRow[station] = { booked: false };
          saveAppState();
        }
      }
    }

    // Drag and Drop Helper Functions
    function dragStart(e, woId) {
      e.dataTransfer.setData('text/plain', woId);
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    function dropOrder(e, techId, techName) {
      e.preventDefault();
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

      const woId = e.dataTransfer.getData('text/plain');
      if (!woId) return;

      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        wo.techId = techId;
        wo.techName = techName === 'Unassigned' ? '' : techName;
        if (techId && wo.status === 'Unassigned') {
          wo.status = 'Dispatched';
        } else if (!techId) {
          wo.status = 'Unassigned';
        }
        saveAppState();
      }
    }

    function openEditWorkOrderModal(woId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo) return;

      appState.activeModal = { type: 'editWO', woId, data: { ...wo } };
      renderApp();
    }

    function saveEditWorkOrderDetails(e, woId) {
      e.preventDefault();
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo) return;

      wo.customerName = document.getElementById('modalWOCustName').value;
      wo.equipmentName = document.getElementById('modalWOEqName').value;
      wo.trade = document.getElementById('modalWOTrade').value;
      wo.status = document.getElementById('modalWOStatus').value;
      wo.needsFollowUp = document.getElementById('modalWOFollowUp').checked;
      
      const newTechName = document.getElementById('modalWOTechName').value;
      wo.techName = newTechName;
      const foundTech = appState.technicians.find(t => t.name === newTechName);
      wo.techId = foundTech ? foundTech.id : '';

      wo.description = document.getElementById('modalWODesc').value;

      closeModal();

                <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                  <span class="text-[10px] text-slate-500">Added by ${kb.addedBy}</span>
                  <div class="flex gap-2">
                    <a href="#" onclick="alert('Downloading ${kb.title}...')" class="text-xs text-red-500 hover:text-red-400 font-bold flex items-center gap-1">
                      <i class="fa-solid fa-download text-[10px]"></i> Open
                    </a>
                    ${isManager ? `
                      <button onclick="deleteManual('${kb.id}')" class="text-xs text-slate-500 hover:text-red-400">
                        <i class="fa-solid fa-trash-can"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openAddManualModal() {
      const title = prompt("Enter Manual / Formula Title:");
      if (!title) return;
      const category = prompt("Trade Category (HVAC, Generators, Plumbing, Gates, Electrical, Time):", "HVAC");
      const fileType = prompt("File Type (PDF, DOCX, EXCEL, IMG):", "PDF");
      const notes = prompt("Enter Brief Description or Reference Notes:");

      appState.knowledgeBase.push({
        id: 'kb-' + Date.now(),
        title,
        category: category || 'General',
        fileType: fileType || 'PDF',
        url: '#',
        addedBy: appState.currentUser.name,
        date: new Date().toISOString().split('T')[0],
        notes: notes || 'No notes added.'
      });

      saveAppState();
    }

    function deleteManual(id) {
      if (confirm("Are you sure you want to delete this manual from the public library?")) {
        appState.knowledgeBase = appState.knowledgeBase.filter(k => k.id !== id);
        saveAppState();
      }
    }


    // ==========================================
    // SECTION: VIEW - WORK ORDERS & ESTIMATES
    // ==========================================
    function renderWorkOrdersView() {

      const filteredWorkOrders = appState.workOrders.filter(wo =>

        wo.customerName.toLowerCase().includes(query) || 
        wo.equipmentName.toLowerCase().includes(query) || 
        wo.trade.toLowerCase().includes(query) || 
        (wo.techName && wo.techName.toLowerCase().includes(query)) ||
        wo.status.toLowerCase().includes(query)

      const activeShareWo = appState.activeShareWo ? appState.workOrders.find(w => w.id === appState.activeShareWo) : null;
      if (!appState.minimizedWorkOrders) {
        appState.minimizedWorkOrders = {};

      filteredWorkOrders.forEach(wo => {

                      <button onclick="toggleFollowUp('${wo.id}')" title="Follow-Up" class="px-2.5 py-1 rounded text-xs font-bold transition ${wo.needsFollowUp ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'}">

                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                      <span class="text-xs font-bold text-slate-200"><i class="fa-solid fa-receipt text-emerald-400"></i> Itemized Billing & Pay</span>

                    <div class="space-y-2 divide-y divide-slate-800/60">
                      ${(wo.lineItems || []).length > 0 ? (wo.lineItems || []).map(item => `
                        <div class="pt-2 flex items-center justify-between text-xs text-slate-300 gap-2">
                          <div class="truncate">
                            <p class="font-bold text-white truncate"><span class="font-mono text-amber-400">[${item.code || 'N/A'}]</span> ${item.title} (x${item.qty})</p>
                            <p class="text-[10px] text-slate-400">Pay: <span class="text-amber-400 font-semibold">${item.minutes || 0}m</span> | SPIFF: <span class="text-rose-400 font-semibold">$${(item.spiff || 0).toFixed(2)}</span></p>
                          </div>
                          <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="font-mono text-emerald-400 font-semibold">$${(item.total || 0).toFixed(2)}</span>
                            <button onclick="removeLineItemFromWO('${wo.id}', '${item.id}')" title="Remove" class="text-slate-500 hover:text-red-400">
                              <i class="fa-solid fa-trash-can"></i>
                            </button>
                          </div>
                        </div>
                      `).join('') : '<p class="text-[11px] text-slate-500 italic text-center py-1">No line items added yet.</p>'}
                    </div>

                    <div class="pt-3 border-t border-slate-800 space-y-1 text-xs">
                      <div class="flex justify-between font-semibold text-slate-300">
                        <span>Total Tech Minutes:</span>
                        <span class="font-mono text-amber-400">${totalMinutes} Mins</span>
                      </div>
                      <div class="flex justify-between font-semibold text-slate-300">
                        <span>Total SPIFF Bonus:</span>
                        <span class="font-mono text-rose-400">$${totalSpiff.toFixed(2)}</span> </div> <div class="flex justify-between font-bold text-white pt-1 border-t border-slate-800"> <span>Total Invoice:</span> <span class="font-mono text-emerald-400">$${totalAmount.toFixed(2)}</span>
                      </div>
                    </div>
                  </div>

                  <!-- Field Notes & Activity Log -->
                  <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 space-y-3">
                    <div class="flex items-center justify-between">
                      <h5 class="text-xs font-bold text-slate-200"><i class="fa-solid fa-note-sticky text-red-500"></i> Field Notes & Activity Log</h5>
                      <span class="text-[10px] text-slate-400">${(wo.workLogs || []).length} notes</span>
                    </div>

                    <div class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-1">
                      ${(wo.workLogs || []).length > 0 ? wo.workLogs.map(log => `
                        <div class="p-2.5 bg-slate-950 rounded border border-slate-800 text-xs space-y-1">
                          <div class="flex justify-between items-center text-[10px] text-slate-500 gap-2">
                            <span class="font-bold text-slate-400 truncate">${log.user}</span>
                            <div class="flex items-center gap-2 flex-shrink-0">
                              <span>${log.timestamp}</span>
                              <button onclick="editWorkOrderNote('${wo.id}', '${log.id}')" title="Edit" class="text-slate-400 hover:text-white">
                                <i class="fa-solid fa-pen"></i>
                              </button>
                              <button onclick="deleteWorkOrderNote('${wo.id}', '${log.id}')" title="Delete" class="text-slate-500 hover:text-red-400">
                                <i class="fa-solid fa-trash-can"></i>
                              </button>
                            </div>
                          </div>
                          <p class="text-slate-200 whitespace-pre-wrap">${log.note}</p>
                        </div>
                      `).join('') : '<p class="text-[11px] text-slate-500 italic text-center py-2">No notes added yet.</p>'}
                    </div>

                    <form onsubmit="addWorkOrderNote(event, '${wo.id}')" class="flex gap-2 pt-1 border-t border-slate-800">
                      <input type="text" placeholder="Add a note..." class="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-red-500" required />
                      <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-2 rounded transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Post
                      </button>

                  <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 space-y-3">
                    <div class="flex items-center justify-between">
                      <h5 class="text-xs font-bold text-slate-200"><i class="fa-solid fa-paperclip text-red-500"></i> Files & Pictures</h5>
                      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold px-2.5 py-1 rounded border border-slate-700 transition flex items-center gap-1">
                        <i class="fa-solid fa-upload"></i> Upload
                        <input type="file" onchange="handleFileUpload(event, '${wo.id}')" class="hidden" accept="image/*,.pdf,.doc,.docx" />
                      </label>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      ${(wo.attachments || []).length > 0 ? (wo.attachments || []).map(att => `
                        <div class="p-2 bg-slate-950 rounded border border-slate-800 flex items-center justify-between text-xs gap-2">
                          <div class="flex items-center gap-2 truncate">
                            <i class="fa-solid ${att.type === 'image' ? 'fa-image text-emerald-400' : 'fa-file-pdf text-rose-400'}"></i>
                            <span class="text-slate-300 truncate text-[11px]" title="${att.name}">${att.name}</span>
                          </div>
                          <button onclick="deleteAttachment('${wo.id}', '${att.id}')" class="text-slate-500 hover:text-red-400 text-xs flex-shrink-0">
                            <i class="fa-solid fa-xmark"></i>
                          </button>
                        </div>
                      `).join('') : '<div class="col-span-full text-[11px] text-slate-500 italic text-center py-1">No files or pictures uploaded yet.</div>'}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Share Options Modal Popup -->
          ${activeShareWo ? `
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-5">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 class="font-bold text-white text-base">Share Work Order / Estimate</h3>
                    <p class="text-xs text-slate-400 font-mono mt-0.5">${activeShareWo.id} —${activeShareWo.customerName}</p>
                  </div>
                  <button onclick="closeShareModal()" class="text-slate-400 hover:text-white text-sm p-1">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div class="grid grid-cols-1 gap-3">
                  <button onclick="executeShareAction('print', '${activeShareWo.id}')" class="flex items-center gap-3 p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl transition text-left group">
                    <div class="w-10 h-10 rounded-lg bg-red-950/50 border border-red-800/50 flex items-center justify-center text-red-400 flex-shrink-0">
                      <i class="fa-solid fa-print"></i>
                    </div>
                    <div>
                      <h4 class="font-bold text-white text-sm">Print Document</h4>
                      <p class="text-xs text-slate-400">Send work order to printer or save as PDF</p>
                    </div>
                  </button>

                  <button onclick="executeShareAction('email', '${activeShareWo.id}')" class="flex items-center gap-3 p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl transition text-left group">
                    <div class="w-10 h-10 rounded-lg bg-sky-950/50 border border-sky-800/50 flex items-center justify-center text-sky-400 flex-shrink-0">
                      <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                      <h4 class="font-bold text-white text-sm">Email to Customer</h4>
                      <p class="text-xs text-slate-400">Dispatch copy directly to customer email</p>
                    </div>
                  </button>

                  <button onclick="executeShareAction('text', '${activeShareWo.id}')" class="flex items-center gap-3 p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl transition text-left group">
                    <div class="w-10 h-10 rounded-lg bg-emerald-950/50 border border-emerald-800/50 flex items-center justify-center text-emerald-400 flex-shrink-0">
                      <i class="fa-solid fa-comment-sms"></i>
                    </div>
                    <div>
                      <h4 class="font-bold text-white text-sm">Send via Text (SMS)</h4>
                      <p class="text-xs text-slate-400">Text digital dispatch link to mobile number</p>
                    </div>
                  </button>
                </div>

                <div class="pt-2">
                  <button onclick="closeShareModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2.5 rounded-lg transition">
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleMinimizeWO(woId) {
      if (!appState.minimizedWorkOrders) {
        appState.minimizedWorkOrders = {};
      }
      appState.minimizedWorkOrders[woId] = !appState.minimizedWorkOrders[woId];
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function openShareModal(woId) {
      appState.activeShareWo = woId;
      saveAppState();
    }

    function closeShareModal() {
      appState.activeShareWo = null;
      saveAppState();
    }

    function executeShareAction(actionType, woId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo) return;

      if (actionType === 'print') {
        alert(`Preparing printer for work order ${wo.id} (${wo.customerName})...`);
      } else if (actionType === 'email') {
        const emailAddr = prompt("Confirm customer email address:", "customer@domain.com");
        if (emailAddr) {
          alert(`Work order ${wo.id} successfully emailed to ${emailAddr}!`);
        }
      } else if (actionType === 'text') {
        const phoneNum = prompt("Confirm mobile phone number for SMS:", "(555) 000-0000");
        if (phoneNum) {
          alert(`Work order ${wo.id} dispatch summary successfully sent via text to ${phoneNum}!`);
        }
      }
      closeShareModal();
    }

    function toggleFollowUp(woId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        wo.needsFollowUp = !wo.needsFollowUp;
        saveAppState();
      }
    }

    function addLineItemToWO(woId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo) return;

      const code = prompt("Part Number / Item Code (e.g., FLT-2025, R410A):", "PART-001");
      if (!code) return;
      const title = prompt("Line Item Title or Part Description:");
      if (!title) return;
      const qty = parseInt(prompt("Quantity:", "1") || "1");
      const unitPrice = parseFloat(prompt("Unit Flat-Rate Price ($):", "100.00") || "0");
      const minutes = parseInt(prompt("Tech Pay Minutes for this item:", "30") || "0");
      const spiff = parseFloat(prompt("SPIFF Bonus Amount ($):", "0") || "0");

      if (!wo.lineItems) wo.lineItems = [];
      wo.lineItems.push({
        id: 'li-' + Date.now(),
        code: code.toUpperCase(),
        title,
        qty: isNaN(qty) ? 1 : qty,
        unitPrice: isNaN(unitPrice) ? 0 : unitPrice,
        minutes: isNaN(minutes) ? 0 : minutes,
        spiff: isNaN(spiff) ? 0 : spiff,
        total: (isNaN(qty) ? 1 : qty) * (isNaN(unitPrice) ? 0 : unitPrice)
      });

      saveAppState();
    }

    function removeLineItemFromWO(woId, itemId) {
      if (confirm("Are you sure you want to remove this line item?")) {
        const wo = appState.workOrders.find(w => w.id === woId);
        if (wo && wo.lineItems) {
          wo.lineItems = wo.lineItems.filter(item => item.id !== itemId);
          saveAppState();
        }
      }
    }

    function addWorkOrderNote(e, woId) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const noteText = input.value.trim();
      if (!noteText) return;

      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        if (!wo.workLogs) wo.workLogs = [];
        wo.workLogs.push({
          id: 'wl-' + Date.now(),
          timestamp: new Date().toLocaleString(),
          user: appState.currentUser.name,
          note: noteText
        });
        saveAppState();
      }
    }

    function editWorkOrderNote(woId, noteId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo || !wo.workLogs) return;

      const note = wo.workLogs.find(l => l.id === noteId);
      if (!note) return;

      appState.activeModal = { type: 'editNote', woId, noteId, data: { ...note } };
      renderApp();
    }

    function saveEditWorkOrderNote(e, woId, noteId) {
      e.preventDefault();
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo || !wo.workLogs) return;

      const note = wo.workLogs.find(l => l.id === noteId);
      if (!note) return;

      note.note = document.getElementById('modalNoteContent').value.trim();
      note.timestamp = new Date().toLocaleString() + ' (edited)';

      closeModal();
    }

    function deleteWorkOrderNote(woId, noteId) {
      if (confirm("Are you sure you want to delete this note?")) {
        const wo = appState.workOrders.find(w => w.id === woId);
        if (wo && wo.workLogs) {
          wo.workLogs = wo.workLogs.filter(l => l.id !== noteId);
          saveAppState();
        }
      }
    }

    function handleFileUpload(e, woId) {
      const file = e.target.files[0];
      if (!file) return;

      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        if (!wo.attachments) wo.attachments = [];
        const isImage = file.type.startsWith('image/');
        wo.attachments.push({
          id: 'att-' + Date.now(),
          name: file.name,
          type: isImage ? 'image' : 'file'
        });
        saveAppState();
      }
    }

    function deleteAttachment(woId, attId) {
      if (confirm("Remove this attachment?")) {
        const wo = appState.workOrders.find(w => w.id === woId);
        if (wo && wo.attachments) {
          wo.attachments = wo.attachments.filter(a => a.id !== attId);
          saveAppState();
        }
      }
    }


    // ==========================================
    // SECTION: VIEW - MAINTENANCE TRACKER
    // ==========================================
    function renderMaintenanceView() {
      const allEquipments = appState.customers.flatMap(c => 
        c.equipments.map(e => ({ ...e, parentCustomer: c.name, parentCustomerId: c.id }))
      );

      const query = (appState.searchTerm || '').toLowerCase();
      const filteredEquipments = allEquipments.filter(eq => 
        eq.parentCustomer.toLowerCase().includes(query) || 
        eq.name.toLowerCase().includes(query) || 
        eq.serial.toLowerCase().includes(query) || 
        eq.category.toLowerCase().includes(query) || 
        eq.nextMaintenance.toLowerCase().includes(query)
      );

      return `
        <div class="space-y-4 sm:space-y-6">

    // ==========================================
    // SECTION: VIEW - MANAGER AUDIT LOGS
    // ==========================================
    function renderLogsView() {
      const filters = appState.auditFilter;
      const query = (filters.search || '').toLowerCase();

      const filteredLogs = appState.customerChangeLogs.filter(l => {
        const matchesQuery = !query || 
          l.user.toLowerCase().includes(query) || 
          l.customerName.toLowerCase().includes(query) || 
          l.action.toLowerCase().includes(query) || 
          l.details.toLowerCase().includes(query);

        let matchesUser = true;
        if (filters.user === 'tech') {
          matchesUser = l.user.includes('(TECHNICIAN)');
        } else if (filters.user === 'office') {
          matchesUser = l.user.includes('(MANAGER)') || l.user.includes('(CSR)') || l.user.includes('(DISPATCHER)');
        }

        let matchesCustomer = !filters.customer || l.customerId === filters.customer || l.customerName === filters.customer;
        let matchesDate = true;
        if (filters.date) {
          matchesDate = l.timestamp.includes(filters.date) || l.timestamp.startsWith(filters.date);
        }

        return matchesQuery && matchesUser && matchesCustomer && matchesDate;
      });

      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-bold text-white text-sm">Manager Audit & Activity Log</h3>
                <p class="text-xs text-slate-400 mt-0.5">Filter system activity records by staff type, customer, date, or keywords</p>
              </div>
              <button onclick="resetAuditFilters()" class="text-xs bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg transition">
                Reset
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-2 border-t border-slate-800/80">
              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Keywords</label>
                <input type="text" value="${filters.search}" oninput="updateAuditFilter('search', this.value)" placeholder="Search action, details..." class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500" />
              </div>

              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Staff Type</label>
                <select onchange="updateAuditFilter('user', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500">
                  <option value="">All Staff</option>
                  <option value="office" ${filters.user === 'office' ? 'selected' : ''}>Office Staff</option>
                  <option value="tech" ${filters.user === 'tech' ? 'selected' : ''}>Technicians</option>
                </select>
              </div>

              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Customer</label>
                <select onchange="updateAuditFilter('customer', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500">
                  <option value="">All Customers</option>
                  ${appState.customers.map(c => `
                    <option value="${c.name}" ${filters.customer === c.name ? 'selected' : ''}>${c.name}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Date</label>
                <input type="date" value="${filters.date}" onchange="updateAuditFilter('date', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500" />
              </div>
            </div>
          </div>

          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
              <table class="w-full text-left text-xs text-slate-300 min-w-[700px]">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="p-3 sm:p-4">Timestamp</th>
                    <th class="p-3 sm:p-4">User</th>
                    <th class="p-3 sm:p-4">Customer</th>
                    <th class="p-3 sm:p-4">Action</th>
                    <th class="p-3 sm:p-4">Details</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${filteredLogs.length > 0 ? filteredLogs.map(l => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-3 sm:p-4 font-mono text-slate-400 whitespace-nowrap">${l.timestamp}</td>
                      <td class="p-3 sm:p-4 font-semibold text-white whitespace-nowrap">${l.user}</td>
                      <td class="p-3 sm:p-4 text-slate-300 whitespace-nowrap">${l.customerName || 'N/A'}</td>
                      <td class="p-3 sm:p-4 font-bold text-red-400 whitespace-nowrap">${l.action}</td>
                      <td class="p-3 sm:p-4 text-slate-400">${l.details}</td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="5" class="p-6 text-center text-slate-500 italic">No audit logs found matching the selected filters.</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function openNewCustomerModal() {
      appState.activeModal = { type: 'newCustomer' };
      renderApp();
    }

    function saveNewCustomer(e) {
      e.preventDefault();
      const name = document.getElementById('modalNewCustName').value.trim();
      if (!name) return;
      const phone = document.getElementById('modalNewCustPhone').value.trim();
      const address = document.getElementById('modalNewCustAddress').value.trim();
      const email = document.getElementById('modalNewCustEmail').value.trim();
      const contactPerson = document.getElementById('modalNewCustContact').value.trim();

      const newC = {
        id: 'c-' + Date.now(),
        name,
        contactPerson: contactPerson || name,
        phone: phone || '',
        email: email || '',
        address: address || '',
        type: 'Commercial',
        created: new Date().toISOString().split('T')[0],
        equipments: []
      };

      appState.customers.push(newC);
      closeModal();
    }

    function openAddTeamMemberModal() {
      appState.activeModal = { type: 'newTeamMember' };
      renderApp();
    }

    function saveNewTeamMember(e) {
      e.preventDefault();
      const name = document.getElementById('modalTeamName').value.trim();
      if (!name) return;
      const role = document.getElementById('modalTeamRole').value;

      appState.users.push({
        id: 'u-' + Date.now(),
        name,
        email: `${name.toLowerCase().replace(/\s+/g, '')}@reliance.com`,
        password: '123',
        role
      });

      closeModal();
    }

        const d = modal.data;
        modalContent = `
          <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-red-500"></i> Edit Price Book Item</h3>
          <form onsubmit="saveEditPriceBookItem(event, '${modal.pbId}')" class="space-y-3">
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Item Code</label>
              <input type="text" id="modalPBCode" value="${d.code}" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500 font-mono" required />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Title</label>
              <input type="text" id="modalPBTitle" value="${d.title}" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" required />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Category</label>
              <input type="text" id="modalPBCategory" value="${d.category}" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" required />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Standard Rate ($)</label>
              <input type="number" step="0.01" id="modalPBPrice" value="${d.unitPrice}" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500 font-mono" required />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Description</label>
              <textarea id="modalPBDesc" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500">${d.description || ''}</textarea>
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded text-xs transition">Save Item</button>
              <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 px-4 rounded text-xs transition">Cancel</button>
            </div>
          </form>
        `;
      } else if (modal.type === 'editNote') {
        const d = modal.data;
        modalContent = `
          <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-red-500"></i> Edit Field Note</h3>
          <form onsubmit="saveEditWorkOrderNote(event, '${modal.woId}', '${modal.noteId}')" class="space-y-3">
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Note Content</label>
              <textarea id="modalNoteContent" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" required>${d.note}</textarea>
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded text-xs transition">Update Note</button>
              <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 px-4 rounded text-xs transition">Cancel</button>
            </div>
          </form>
        `;
      } else if (modal.type === 'newCustomer') {
        modalContent = `
          <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-user-plus text-red-500"></i> Create New Customer</h3>
          <form onsubmit="saveNewCustomer(event)" class="space-y-3">
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Company / Customer Name</label>
              <input type="text" id="modalNewCustName" placeholder="e.g. Apex Commercial Plaza" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" required />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Contact Person</label>
              <input type="text" id="modalNewCustContact" placeholder="e.g. David Sterling" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Phone Number</label>
              <input type="text" id="modalNewCustPhone" placeholder="(555) 000-0000" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Email Address</label>
              <input type="email" id="modalNewCustEmail" placeholder="customer@domain.com" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Physical Address</label>
              <input type="text" id="modalNewCustAddress" placeholder="123 Street Name, City, State" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" />
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded text-xs transition">Create Customer</button>
              <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 px-4 rounded text-xs transition">Cancel</button>
            </div>
          </form>
        `;
      } else if (modal.type === 'newTeamMember') {
        modalContent = `
          <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-user-plus text-red-500"></i> Add Team Member</h3>
          <form onsubmit="saveNewTeamMember(event)" class="space-y-3">
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Full Name</label>
              <input type="text" id="modalTeamName" placeholder="e.g. John Doe" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500" required />
            </div>
            <div>
              <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Role</label>
              <select id="modalTeamRole" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:border-red-500">
                <option value="manager">Manager</option>
                <option value="csr">CSR</option>
                <option value="dispatcher">Dispatcher</option>
                <option value="technician">Technician</option>
                <option value="parts">Parts</option>
              </select>
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded text-xs transition">Add Member</button>
              <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 px-4 rounded text-xs transition">Cancel</button>
            </div>
          </form>
        `;
      }

      return `
        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-lg w-full shadow-2xl relative my-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1">
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            ${modalContent}
          </div>
        </div>
      `;
    }

    // Initial App Render Call
    renderApp();
  </script> 
</body>
</html>
