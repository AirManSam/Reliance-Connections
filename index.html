function heading(title,sub,button=''){return `<div class="heading"><div><div class="eyebrow">Reliance Connections · Operations</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${button}</div></div>`}function stat(label,value,foot,accent=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue ${accent}">${value}</div><div class="statfoot">${foot}</div></div>`}function person(name,sub){let initials=name.split(' ').map(x=>x[0]).slice(0,2).join('');return `<div class="person"><span class="avatar">${esc(initials)}</span><span><b>${esc(name)}</b><small>${esc(sub||'')}</small></span></div>`}function jobActions(j){return `<button class="btn small" onclick="editJob('${j.id}')">Open job</button>`}function customerSelect(id=''){return db.customers.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${esc(c.name)}</option>`).join('')}function techSelect(id=''){return `<option value="">Unassigned</option>`+db.techs.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.name)} · ${esc(t.trade)}</option>`).join('')}
function dashboard(){let active=db.jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)),rev=db.invoices.reduce((s,i)=>s+paid(i),0),out=db.invoices.reduce((s,i)=>s+balance(i),0),present=db.estimates.filter(e=>e.status==='Presented');return heading('Operations overview','Your service business at a glance.',`<button class="btn primary" onclick="newBooking()">＋ Book a call</button><button class="btn" onclick="go('dispatch')">View dispatch →</button>`)+`<div class="grid stats">${stat('Active jobs',active.length,'Across all service stages','stataccent')}${stat('Estimates awaiting approval',present.length,'Customer decision needed')}${stat('Open invoice balance',money(out),'Outstanding receivables')}${stat('Payments recorded',money(rev),'Recorded in this browser')}</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Today's service calls</h2><button class="btn small" onclick="go('jobs')">All work orders</button></div><div class="tablewrap"><table><thead><tr><th>Job / Customer</th><th>Appointment</th><th>Technician</th><th>Status</th><th></th></tr></thead><tbody>${db.jobs.filter(j=>j.date===date()).sort((a,b)=>a.time.localeCompare(b.time)).map(j=>`<tr><td><b>${esc(j.title)}</b><div class="muted">${j.id} · ${esc(cust(j.customerId).name)}</div></td><td>${j.time}</td><td>${esc(tech(j.techId).name)}</td><td>${badge(j.status)}</td><td>${jobActions(j)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No calls scheduled today.</td></tr>`}</tbody></table></div></div><div class="card"><div class="cardhead"><h2>Needs attention</h2><span class="badge orange">${db.inventory.filter(p=>p.qty<=p.min).length+present.length} items</span></div><div class="list">${present.map(e=>`<div class="rowitem"><div><b>${esc(e.title)}</b><small>${esc(cust(e.customerId).name)} · ${money(total(e.items))}</small></div>${badge('Awaiting approval')}</div>`).join('')}${db.inventory.filter(p=>p.qty<=p.min).map(p=>`<div class="rowitem"><div><b>${esc(p.name)}</b><small>Stock ${p.qty} · minimum ${p.min}</small></div>${badge('Low stock')}</div>`).join('')}${db.maintenance.filter(m=>m.status==='Open'&&m.due<=date(14)).map(m=>`<div class="rowitem"><div><b>${esc(m.asset)}</b><small>${esc(cust(m.customerId).name)} · due ${m.due}</small></div>${badge('Maintenance due')}</div>`).join('')||''}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="cardhead"><h2>Dispatch pulse</h2><button class="btn small" onclick="go('dispatch')">Open board</button></div>${[['Scheduled',db.jobs.filter(j=>j.status==='Scheduled').length],['Dispatched',db.jobs.filter(j=>j.status==='Dispatched').length],['En route',db.jobs.filter(j=>j.status==='En route').length],['On site / Working',db.jobs.filter(j=>['On site','Working'].includes(j.status)).length]].map(([n,v])=>`<div class="rowitem"><b>${n}</b><div style="display:flex;align-items:center;gap:10px;min-width:48%"><div class="progress" style="flex:1"><span style="width:${Math.min(100,v/Math.max(1,db.jobs.length)*100)}%"></span></div><b>${v}</b></div></div>`).join('')}</div><div class="card"><div class="cardhead"><h2>Recent activity</h2><span class="muted">Latest updates</span></div>${db.activity.slice(0,5).map(a=>`<div class="timeline"><time>${esc(a.at.split(',')[0]||'Today')}</time><div><b>${esc(a.text)}</b><p>Logged in this workspace</p></div></div>`).join('')}</div></div><p class="footnote">Prototype data is stored locally in this browser. Metrics are calculated from the current demo records.</p>`}
function dispatch(){let stages=['Scheduled','Dispatched','En route','On site','Working','On hold','Completed'];return heading('Dispatch board','Coordinate today’s calls, technician assignments, and job status.',`<button class="btn primary" onclick="newBooking()">＋ Book a call</button>`)+`<div class="filters"><select id="dispatchDate" onchange="render()" style="width:auto"><option value="all">All dates</option><option value="${date()}">Today</option><option value="${date(1)}">Tomorrow</option></select><select id="dispatchTech" onchange="render()" style="width:auto"><option value="all">All technicians</option>${db.techs.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="kanban">${['Scheduled','Dispatched','En route','On site / Working'].map((col,idx)=>{let statuses=[['Scheduled'],['Dispatched'],['En route'],['On site','Working']][idx];let filtered=db.jobs.filter(j=>statuses.includes(j.status)&&(!document.getElementById('dispatchDate')||document.getElementById('dispatchDate').value==='all'||j.date===document.getElementById('dispatchDate').value)&&(!document.getElementById('dispatchTech')||document.getElementById('dispatchTech').value==='all'||j.techId===document.getElementById('dispatchTech').value));return `<div class="kancol"><div class="kanhead"><span>${col}</span>${badge(filtered.length+'')}</div>${filtered.map(j=>`<div class="jobtile"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(j.title)}</b>${j.priority==='Urgent'?badge('Urgent'):''}</div><p>${esc(cust(j.customerId).name)}</p><p>◷ ${j.date} · ${j.time}</p><p>⚒ ${esc(tech(j.techId).name)}</p><select aria-label="Update status" onchange="setJobStatus('${j.id}',this.value)">${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed','Cancelled'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select><div style="margin-top:8px">${jobActions(j)}</div></div>`).join('')||'<div class="empty">No jobs</div>'}</div>`}).join('')}</div><p class="footnote">Change a job’s status directly from its dispatch card. For a full job record, open the work order.</p>`}
function jobsView(){let list=db.jobs.filter(j=>(jobStatusFilter==='all'||j.status===jobStatusFilter)&&(!searchText||[j.id,j.title,cust(j.customerId).name,tech(j.techId).name,j.status].join(' ').toLowerCase().includes(searchText.toLowerCase())));return heading('Work orders','The central record for every booked service call.',`<button class="btn primary" onclick="newBooking()">＋ Create work order</button>`)+`<div class="card"><div class="filters"><input placeholder="Filter work orders…" value="${esc(searchText)}" oninput="searchText=this.value;render()" style="max-width:320px"><select onchange="filterJobStatus(this.value)" style="width:auto"><option value="all" ${jobStatusFilter==='all'?'selected':''}>All statuses</option>${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed','Cancelled'].map(s=>`<option ${jobStatusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Work order</th><th>Customer</th><th>Appointment</th><th>Technician</th><th>Trade</th><th>Status</th><th>Priority</th><th></th></tr></thead><tbody>${list.map(j=>`<tr><td><b>${j.id}</b><div class="muted">${esc(j.title)}</div></td><td>${esc(cust(j.customerId).name)}</td><td>${j.date}<div class="muted">${j.time}</div></td><td>${esc(tech(j.techId).name)}</td><td>${esc(j.trade)}</td><td>${badge(j.status)}</td><td>${j.priority==='Urgent'?badge('Urgent'):esc(j.priority)}</td><td>${jobActions(j)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No matching work orders.</td></tr>'}</tbody></table></div></div>`}let jobStatusFilter='all';function filterJobStatus(s){jobStatusFilter=s;render()}
function customersView(){return heading('Customers & assets','Customer profile, property details, equipment, and service history.',`<button class="btn primary" onclick="newCustomer()">＋ Add customer</button>`)+`<div class="grid two"><div class="card"><div class="cardhead"><h2>Customer directory</h2><span class="muted">${db.customers.length} accounts</span></div><div class="list">${db.customers.map(c=>`<div class="rowitem"><div>${person(c.name,c.type+' · '+c.phone)}<small>${esc(c.address)}</small></div><button class="btn small" onclick="customerDetail('${c.id}')">View profile</button></div>`).join('')}</div></div><div id="customerDetail" class="card"><div class="empty"><strong>Select a customer</strong>View assets, work orders, estimates, and invoices from their profile.</div></div></div>`}
function customerDetail(id){let c=cust(id),jobs=db.jobs.filter(j=>j.customerId===id),ests=db.estimates.filter(e=>e.customerId===id),invs=db.invoices.filter(i=>i.customerId===id);document.getElementById('customerDetail').innerHTML=`<div class="cardhead"><div>${person(c.name,c.type+' account')}</div><button class="btn small" onclick="newBooking('${id}')">＋ Book call</button></div><p class="muted">${esc(c.address)}<br>${esc(c.phone)} · ${esc(c.email)}</p><div class="grid three" style="margin:14px 0">${stat('Assets',c.assets.length,'Registered equipment')}${stat('Jobs',jobs.length,'Service history')}${stat('Open balance',money(invs.reduce((s,i)=>s+balance(i),0)),'Across invoices')}</div><div class="cardhead"><h3>Equipment & assets</h3><button class="btn small" onclick="newAsset('${id}')">＋ Add asset</button></div>${c.assets.map(a=>`<div class="rowitem"><div><b>${esc(a.name)}</b><small>Serial ${esc(a.serial)} · maintenance ${a.next||'not scheduled'}</small></div><button class="btn small" onclick="newMaintenance('${id}','${esc(a.name)}')">Plan service</button></div>`).join('')||'<p class="muted">No equipment registered.</p>'}<div class="cardhead" style="margin-top:20px"><h3>Recent jobs</h3></div>${jobs.map(j=>`<div class="rowitem"><div><b>${esc(j.title)}</b><small>${j.id} · ${j.date} · ${esc(tech(j.techId).name)}</small></div>${badge(j.status)}</div>`).join('')||'<p class="muted">No service history yet.</p>'}<div class="cardhead" style="margin-top:20px"><h3>Estimates & invoices</h3></div>${ests.map(e=>`<div class="rowitem"><div><b>${esc(e.title)}</b><small>${e.id} · ${money(total(e.items))}</small></div>${badge(e.status)}</div>`).join('')}${invs.map(i=>`<div class="rowitem"><div><b>${i.id}</b><small>${money(total(i.items))} · balance ${money(balance(i))}</small></div>${badge(i.status)}</div>`).join('')||''}`}
function estimatesView(){return heading('Estimates & proposals','Build line-item proposals, present options, and record customer decisions.',`<button class="btn primary" onclick="newEstimate()">＋ Create estimate</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Estimate</th><th>Customer / Job</th><th>Line items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.estimates.map(e=>`<tr><td><b>${e.id}</b><div class="muted">${esc(e.title)}</div></td><td>${esc(cust(e.customerId).name)}<div class="muted">${esc(e.jobId||'Not linked')}</div></td><td>${e.items.length}</td><td>${money(total(e.items))}</td><td>${badge(e.status)}</td><td><div class="actions">${e.status==='Draft'?`<button class="btn small" onclick="estimateStatus('${e.id}','Presented')">Present</button>`:''}${e.status==='Presented'?`<button class="btn small green" onclick="estimateStatus('${e.id}','Approved')">Approve</button><button class="btn small danger" onclick="estimateStatus('${e.id}','Declined')">Decline</button>`:''}${e.status==='Approved'&&!e.converted?`<button class="btn small primary" onclick="convertEstimate('${e.id}')">Add to job</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No estimates yet. Create one to start.</td></tr>'}</tbody></table></div></div><div class="notice" style="margin-top:14px">Prototype approval records an office-side decision. Customer-facing links, e-signature capture, and automatic email delivery require integrations.</div>`}
function invoicesView(){return heading('Invoices & payments','Create invoices from completed jobs and maintain balances with payment records.',`<button class="btn primary" onclick="newInvoice()">＋ Create invoice</button>`)+`<div class="grid stats">${stat('Total invoiced',money(db.invoices.reduce((s,i)=>s+total(i.items),0)),'All invoice totals')}${stat('Collected',money(db.invoices.reduce((s,i)=>s+paid(i),0)),'Payments recorded','stataccent')}${stat('Outstanding',money(db.invoices.reduce((s,i)=>s+balance(i),0)),'Unpaid balances')}${stat('Open invoices',db.invoices.filter(i=>balance(i)>0).length,'Require follow-up')}</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Work order</th><th>Invoice total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td><b>${i.id}</b><div class="muted">${i.created}</div></td><td>${esc(cust(i.customerId).name)}</td><td>${esc(i.jobId||'—')}</td><td>${money(total(i.items))}</td><td>${money(paid(i))}</td><td><b>${money(balance(i))}</b></td><td>${badge(balance(i)===0?'Paid':i.status)}</td><td><div class="actions"><button class="btn small" onclick="viewInvoice('${i.id}')">Details</button>${balance(i)>0?`<button class="btn small green" onclick="recordPayment('${i.id}')">Record payment</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No invoices created.</td></tr>'}</tbody></table></div></div>`}
function technicianView(){let t=tech(techFilter);let list=db.jobs.filter(j=>j.techId===techFilter&&!['Completed','Cancelled'].includes(j.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return heading('Technician mobile workspace','A mobile-first field view for assigned jobs, job notes, parts, and customer sign-off.',`<select style="width:auto" onchange="techFilter=this.value;render()">${db.techs.map(x=>`<option value="${x.id}" ${x.id===techFilter?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)+`<div class="mobileframe"><div class="mobiletop"><div><div class="eyebrow">My workday</div><b style="font-size:17px">${esc(t.name)}</b><div class="muted">${esc(t.trade)} technician · ${date()}</div></div><span class="badge green">On duty</span></div><div class="grid stats" style="grid-template-columns:repeat(2,1fr)">${stat('Assigned',list.length,'Open jobs')}${stat('Completed',db.jobs.filter(j=>j.techId===techFilter&&j.status==='Completed'&&j.date===date()).length,'Today')}</div>${list.map(j=>`<div class="mobilecard"><div style="display:flex;justify-content:space-between;gap:8px">${badge(j.status)}<span class="muted" style="font-size:10px">${j.date} · ${j.time}</span></div><h3>${esc(j.title)}</h3><b style="font-size:12px">${esc(cust(j.customerId).name)}</b><p>${esc(cust(j.customerId).address)}<br>${esc(j.description)}</p><div class="mobileactions"><button class="btn small" onclick="techNote('${j.id}')">＋ Add note</button><button class="btn small" onclick="usePart('${j.id}')">＋ Use part</button><button class="btn small" onclick="techPhoto('${j.id}')">＋ Attach photo</button><button class="btn small" onclick="signature('${j.id}')">Customer sign-off</button></div><label class="field" style="margin-top:10px">Update job status<select onchange="setJobStatus('${j.id}',this.value)">${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select></label><p>${j.notes.length} notes · ${j.parts.length} parts · ${j.photos.length} attachments ${j.signature?'· signed':''}</p></div>`).join('')||'<div class="empty"><strong>No assigned open jobs</strong>Assign a work order to this technician in Dispatch.</div>'}<div class="mobilecard"><b>Field workflow</b><p>Update status as you travel, record diagnostic notes, add parts used, and capture a customer sign-off before completion.</p></div></div><p class="footnote">This is a responsive view within the same browser app, not a native app or cross-device sync.</p>`}
function inventoryView(){return heading('Inventory & truck stock','Monitor stock, record usage against work orders, and flag reorder needs.',`<button class="btn primary" onclick="newPart()">＋ Add inventory item</button>`)+`<div class="grid stats">${stat('SKUs',db.inventory.length,'Catalog items')}${stat('Low-stock items',db.inventory.filter(p=>p.qty<=p.min).length,'At or below minimum', 'stataccent')}${stat('Inventory cost',money(db.inventory.reduce((s,p)=>s+p.qty*p.cost,0)),'Estimated stock value')}${stat('Parts issued',db.jobs.reduce((s,j)=>s+j.parts.length,0),'Work order part entries')}</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Part</th><th>SKU</th><th>On hand</th><th>Min stock</th><th>Unit cost</th><th>Price book</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.inventory.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.sku}</td><td><b>${p.qty}</b></td><td>${p.min}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.qty<=p.min?badge('Low stock'):badge('In stock')}</td><td><button class="btn small" onclick="adjustStock('${p.id}')">Adjust</button></td></tr>`).join('')}</tbody></table></div></div>`}
function maintenanceView(){return heading('Maintenance plans','Track preventive maintenance due dates and turn service reminders into bookings.',`<button class="btn primary" onclick="newMaintenance()">＋ Add reminder</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Reminder</th><th>Customer</th><th>Asset</th><th>Due date</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.maintenance.map(m=>`<tr><td><b>${m.id}</b></td><td>${esc(cust(m.customerId).name)}</td><td>${esc(m.asset)}</td><td>${m.due}</td><td>${badge(m.status)}</td><td><div class="actions">${m.status==='Open'?`<button class="btn small primary" onclick="bookMaintenance('${m.id}')">Book service</button><button class="btn small" onclick="completeMaintenance('${m.id}')">Complete</button>`:'—'}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No maintenance reminders.</td></tr>'}</tbody></table></div></div>`}
function payrollView(){let rows=db.techs.map(t=>{let done=db.jobs.filter(j=>j.techId===t.id&&j.status==='Completed'),spiff=done.reduce((s,j)=>s+j.items.reduce((x,i)=>x+(i.spiff||0),0),0);return {...t,count:done.length,spiff}});return heading('Payroll & commissions','Review completed-job incentives and export a preliminary pay summary.',`<button class="btn" onclick="exportPayroll()">Export CSV</button>`)+`<div class="notice">This is an operational estimate only, not a payroll calculation. Base wages, taxes, deductions, overtime, and local employment rules are not included.</div><div class="grid stats">${stat('Completed jobs',db.jobs.filter(j=>j.status==='Completed').length,'All technicians')}${stat('Recorded spiffs',money(rows.reduce((s,t)=>s+t.spiff,0)),'From job line items','stataccent')}${stat('Technicians',db.techs.length,'Configured team')}${stat('Pay periods',1,'Current prototype view')}</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Technician</th><th>Trade</th><th>Completed jobs</th><th>Recorded spiffs</th><th>Variable pay</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${person(t.name,t.id)}</td><td>${t.trade}</td><td>${t.count}</td><td>${money(t.spiff)}</td><td><b>${money(t.spiff)}</b></td></tr>`).join('')}</tbody></table></div></div>`}
function reportsView(){let completed=db.jobs.filter(j=>j.status==='Completed').length,approved=db.estimates.filter(e=>e.status==='Approved').length,decided=db.estimates.filter(e=>['Approved','Declined'].includes(e.status)).length;return heading('Reports & analytics','Live summaries calculated from your current local service records.',`<button class="btn" onclick="exportReport()">Export job CSV</button>`)+`<div class="grid stats">${stat('Booked calls',db.jobs.length,'All work orders')}${stat('Completion rate',Math.round(completed/Math.max(1,db.jobs.length)*100)+'%','Completed / all jobs','stataccent')}${stat('Estimate conversion',Math.round(approved/Math.max(1,decided)*100)+'%','Approved / decided')}${stat('Average job value',money(db.jobs.filter(j=>j.status==='Completed').reduce((s,j)=>s+total(j.items),0)/Math.max(1,completed)),'Completed line items')}</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Job status mix</h2></div>${['Scheduled','Dispatched','En route','On site','Working','On hold','Completed','Cancelled'].map(s=>{let n=db.jobs.filter(j=>j.status===s).length;return `<div class="rowitem"><div><b>${s}</b><div class="progress" style="width:230px"><span style="width:${n/Math.max(1,db.jobs.length)*100}%"></span></div></div><b>${n}</b></div>`}).join('')}</div><div class="card"><div class="cardhead"><h2>Financial snapshot</h2></div>${[['Invoiced',db.invoices.reduce((s,i)=>s+total(i.items),0)],['Payments recorded',db.invoices.reduce((s,i)=>s+paid(i),0)],['Outstanding balance',db.invoices.reduce((s,i)=>s+balance(i),0)],['Presented estimates',db.estimates.filter(e=>e.status==='Presented').reduce((s,e)=>s+total(e.items),0)]].map(([k,v])=>`<div class="rowitem"><b>${k}</b><b>${money(v)}</b></div>`).join('')}<p class="footnote">This report reflects only data stored in this browser. It is not an accounting statement.</p></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Recent activity log</h2></div>${db.activity.slice( function recordPayment(id){let i=db.invoices.find(x=>x.id===id),due=balance(i);if(!due)return toast('Invoice is already paid');modal('Record payment',`${id} · remaining balance ${money(due)}`,`<div class="formgrid"><label class="field">Payment amount ($)<input id="payAmount" type="number" min="0.01" max="${due}" step="0.01" value="${due}"></label><label class="field">Payment method<select id="payMethod"><option>Card (manual)</option><option>Cash</option><option>Check</option><option>Bank transfer</option><option>Other</option></select></label><label class="field full">Reference / memo<input id="payMemo" placeholder="Receipt number or notes"></label></div><p class="muted">This records a payment in the prototype. It does not charge a card or move money.</p>`,`savePayment('${id}')`,'Record payment')}function savePayment(id){let i=db.invoices.find(x=>x.id===id),amount=Number(document.getElementById('payAmount').value);if(!Number.isFinite(amount)||amount<=0||amount>balance(i)+.001)return toast('Payment must be positive and no greater than the balance');i.payments.push({amount,method:document.getElementById('payMethod').value,memo:document.getElementById('payMemo').value,at:date()});i.status=balance(i)===0?'Paid':'Partial';log(`Recorded ${money(amount)} payment for ${id}`);closeModal();save('Payment recorded')}

function renderSearch(q){searchText=q;if(q.trim().length>1){current='jobs';render();document.getElementById('crumb').textContent='Search results'}}function resetDemo(){if(!confirm('Reset all local prototype data to the original demo records? This cannot be undone.'))return;db=seed();searchText='';localStorage.setItem(KEY,JSON.stringify(db));go('dashboard');toast('Demo data reset')}function settingsView(){let e=activeEmployee(),trades=db.settings.trades||[];return heading('Settings & access','Customize your workspace, manage employees, and control which modules each role can see.',`<button class="btn" onclick="exportSettingsBackup()">Export settings</button><button class="btn primary" onclick="saveCompanySettings()">Save company settings</button>`)+`<div class="notice">Access controls in this standalone prototype hide sections and block in-app navigation. They are not secure authentication: anyone with the HTML file or browser access can inspect local data. Use a real server and authenticated accounts before production use.</div><div class="grid two"><div class="card"><div class="cardhead"><h2>Company & appearance</h2><span class="badge">Workspace</span></div><div class="formgrid"><label class="field full">Company display name<input id="setCompanyName" value="${esc(db.settings.companyName||'RELIANCE CONNECTIONS')}"></label><label class="field full">Tagline<input id="setTagline" value="${esc(db.settings.tagline||'FIELD SERVICE OPERATIONS')}"></label><label class="field">Accent color<input id="setAccent" type="color" value="${esc(db.settings.accent||'#dc2626')}" style="height:42px;padding:4px"></label><label class="field">Current preview user<select id="setCurrentEmployee" onchange="switchEmployee(this.value)">${db.employees.filter(x=>x.active).map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select></label></div><p class="muted">Brand name, tagline, and accent color update the workspace immediately after saving.</p></div><div class="card"><div class="cardhead"><h2>Trades & service lines</h2><span class="badge">${trades.length} configured</span></div><label class="field">One trade per line<textarea id="setTrades" style="min-height:155px">${esc(trades.join('\n'))}</textarea></label><p class="muted">These options feed the booking and work-order trade selectors. Existing records keep their current trade labels.</p><button class="btn" onclick="saveTrades()">Save trades</button></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Employees & roles</h2><p class="muted">Add staff and assign a role, trade, and contact details.</p></div><button class="btn primary" onclick="newEmployee()">＋ Add employee</button></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Role</th><th>Trade</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody>${db.employees.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.id)}</div></td><td>${badge(x.role)}</td><td>${esc(x.trade||'—')}</td><td>${esc(x.email||'—')}<div class="muted">${esc(x.phone||'')}</div></td><td>${badge(x.active?'Active':'Inactive')}</td><td><button class="btn small" onclick="editEmployee('${x.id}')">Edit</button> <button class="btn small ${x.active?'danger':'green'}" onclick="toggleEmployee('${x.id}')">${x.active?'Deactivate':'Reactivate'}</button></td></tr>`).join('')}</tbody></table></div><p class="footnote">Technician-role employees are also added to technician assignment lists. This prototype does not send invitations or create login credentials.</p></div><div class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Role visibility & permissions</h2><p class="muted">Check the modules each role may access. Changes apply to the preview user immediately.</p></div><button class="btn primary" onclick="savePermissions()">Save permissions</button></div><div class="tablewrap"><table class="permission-table"><thead><tr><th>Role</th>${NAV.map(n=>`<th>${esc(n[2])}</th>`).join('')}</tr></thead><tbody>${ROLE_NAMES.map(role=>`<tr><td><b>${esc(role)}</b><div class="muted">${role==='Admin'?'Full control by default':role==='Technician'?'Field workflow':role==='Accounting'?'Financial records':'Office workflow'}</div></td>${NAV.map(([id])=>`<td style="text-align:center"><input type="checkbox" data-role="${esc(role)}" data-module="${id}" ${allowedModules(role).includes(id)?'checked':''} ${role==='Admin'&&id==='settings'?'checked':''} aria-label="${esc(role)} can see ${id}" style="width:17px;height:17px;accent-color:var(--orange)"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="footnote">Keep at least one Admin role with Settings access. Role access is a visibility/navigation control in this browser prototype, not a security boundary.</p></div>`}
function saveCompanySettings(){let name=document.getElementById('setCompanyName').value.trim(),tagline=document.getElementById('setTagline').value.trim(),accent=document.getElementById('setAccent').value;if(!name)return toast('Company name is required');db.settings.companyName=name;db.settings.tagline=tagline;db.settings.accent=/^#[0-9a-f]{6}$/i.test(accent)?accent:'#dc2626';log('Workspace branding settings updated');save('Company settings saved')}
function saveTrades(){let list=[...new Set(document.getElementById('setTrades').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean))];if(!list.length)return toast('Add at least one trade');db.settings.trades=list;log('Service trade list updated');save('Trades saved')}
function savePermissions(){let perms={};ROLE_NAMES.forEach(role=>{perms[role]=NAV.filter(([id])=>{let cb=document.querySelector(`[data-role="${role}"][data-module="${id}"]`);return cb&&cb.checked}).map(([id])=>id)});if(!perms.Admin.includes('settings'))return toast('Admin must retain Settings access');if(!perms.Admin.length)return toast('Admin needs at least one module');db.settings.permissions=perms;log('Role module permissions updated');save('Role permissions saved')}
function newEmployee(){employeeModal()}
function editEmployee(id){let e=db.employees.find(x=>x.id===id);if(e)employeeModal(e)}
function employeeModal(e={id:'',name:'',email:'',phone:'',role:'Technician',trade:'HVAC',active:true}){modal(e.id?'Edit employee':'Add employee','Create an employee record and choose their role.',`<div class="formgrid"><label class="field full">Full name<input id="empName" value="${esc(e.name)}" required></label><label class="field">Email<input id="empEmail" type="email" value="${esc(e.email||'')}"></label><label class="field">Phone<input id="empPhone" value="${esc(e.phone||'')}"></label><label class="field">Role<select id="empRole">${ROLE_NAMES.map(r=>`<option ${e.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="field">Trade / specialty<select id="empTrade"><option value="">Not applicable</option>${db.settings.trades.map(t=>`<option ${e.trade===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label></div><p class="muted">No password is stored. Login invitations require a production identity provider or backend.</p>`,`saveEmployee('${e.id}')`,e.id?'Save employee':'Add employee')}
function saveEmployee(id){let name=document.getElementById('empName').value.trim();if(!name)return toast('Employee name is required');let role=document.getElementById('empRole').value,trade=document.getElementById('empTrade').value,phone=document.getElementById('empPhone').value.trim(),email=document.getElementById('empEmail').value.trim();let e=id?db.employees.find(x=>x.id===id):null;if(!e){e={id:uid('EMP'),active:true};db.employees.push(e)}Object.assign(e,{name,role,trade,phone,email,active:true});if(role==='Technician'){let t=db.techs.find(x=>x.employeeId===e.id)||db.techs.find(x=>x.name===name);if(!t){t={id:uid('T'),name,trade:trade||'General',phone,employeeId:e.id};db.techs.push(t)}else Object.assign(t,{name,trade:trade||t.trade,phone,employeeId:e.id})}else db.techs=db.techs.filter(t=>t.employeeId!==e.id&&t.name!==name);log(`${id?'Updated':'Added'} employee ${name} (${role})`);closeModal();save('Employee saved')}
function toggleEmployee(id){let e=db.employees.find(x=>x.id===id);if(!e)return;if(e.id===db.activeEmployeeId&&e.active){let other=db.employees.find(x=>x.active&&x.id!==id);if(!other)return toast('Add or activate another employee before deactivating the active preview user');db.activeEmployeeId=other.id}if(e.role==='Admin'&&e.active&&db.employees.filter(x=>x.active&&x.role==='Admin').length===1)return toast('At least one active Admin is required');e.active=!e.active;if(!e.active&&e.role==='Technician'){let t=db.techs.find(x=>x.employeeId===e.id||x.name===e.name);if(t)db.techs=db.techs.filter(x=>x.employeeId!==e.id&&x.name!==e.name)}else if(e.active&&e.role==='Technician'&&!db.techs.some(t=>t.employeeId===e.id||t.name===e.name)){db.techs.push({id:uid('T'),name:e.name,trade:e.trade||'General',phone:e.phone||'',employeeId:e.id})}log(`${e.active?'Reactivated':'Deactivated'} employee ${e.name}`);save(`Employee ${e.active?'reactivated':'deactivated'}`)}
function exportSettingsBackup(){let blob=new Blob([JSON.stringify({settings:db.settings,employees:db.employees,activeEmployeeId:db.activeEmployeeId},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reliance-connections-settings.json';a.click();URL.revokeObjectURL(a.href)}
function newInvoiceFromEstimate(){}
render();
</script></body></html>
