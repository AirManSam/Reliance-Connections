    function loadAppState() {
      const saved = localStorage.getItem('reliance_crm_state_v10');
      return saved ? JSON.parse(saved) : INITIAL_STATE;
    }

    function saveAppState() {
      localStorage.setItem('reliance_crm_state_v10', JSON.stringify(appState));
      renderApp();
    }

    let appState = loadAppState();

    function updateSearch(value) {
      appState.searchTerm = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function updateAuditFilter(field, value) {
      appState.auditFilter[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function resetAuditFilters() {
      appState.auditFilter = { search: '', user: '', customer: '', date: '' };
      saveAppState();
    }

    function updateTimeFilters(field, value) {
      appState[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function updateRestockFilters(field, value) {
      appState[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.innerHTML = renderCurrentView();
      }
    }

    function setView(view) {
      appState.currentView = view;
      appState.searchTerm = '';
      saveAppState();
    }

    // --- MAIN RENDERER ---
    function renderApp() {
      const root = document.getElementById('app');
      
      if (!appState.currentUser) {
        root.innerHTML = renderLoginScreen();
        return;
      }

      root.innerHTML = `
        <div class="flex h-screen bg-slate-900">
          ${renderSidebar()}
          <div class="flex-1 flex flex-col overflow-hidden">
            ${renderHeader()}
            <main class="flex-1 overflow-y-auto p-6 bg-slate-900/50 custom-scrollbar">
              ${renderCurrentView()}
            </main>
          </div>
        </div>
      `;
    }

    // --- LOGIN SCREEN ---
    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-700"></div>
            
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center bg-slate-950 px-4 py-2 rounded-xl border border-red-600/30 mb-3 shadow-lg shadow-red-600/10">
                <span class="font-extrabold text-2xl tracking-tight text-white">R</span>
                <span class="font-extrabold text-2xl tracking-tight text-red-500 ml-0.5">C</span>
              </div>
              <h1 class="text-2xl font-bold text-white tracking-wide">RELIANCE CONNECTIONS</h1>
              <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Field Operations CRM</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
              <div>
                <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Select Account</label>
                <select id="loginUserSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-red-500 transition">
                  ${appState.users.map(u => `<option value="${u.id}">${u.name} — (${u.role.toUpperCase()})</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" value="password" id="loginPassword" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-red-500 transition" required />
              </div>

              <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to CRM
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const userId = document.getElementById('loginUserSelect').value;
      const user = appState.users.find(u => u.id === userId);
      if (user) {
        appState.currentUser = user;
        saveAppState();
      }
    }

    function handleLogout() {
      appState.currentUser = null;
      saveAppState();
    }

    // --- SIDEBAR ---
    function renderSidebar() {
      const userRole = appState.currentUser.role;
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'customers', label: 'Customers & Assets', icon: 'fa-address-book', roles: ['manager', 'csr', 'dispatcher', 'parts'] },
        { id: 'contacts', label: 'Contacts', icon: 'fa-address-card', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'time_report', label: 'Time', icon: 'fa-clock', roles: ['manager', 'csr', 'dispatcher', 'technician'] },
        { id: 'restock_report', label: 'Restock', icon: 'fa-boxes-packing', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'csr_board', label: 'CSR Slot Booking', icon: 'fa-calendar-days', roles: ['manager', 'csr'] },
        { id: 'dispatch_board', label: 'Multi-Dispatch Board', icon: 'fa-headset', roles: ['manager', 'dispatcher', 'parts'] },
        { id: 'maintenance', label: 'Maintenance Tracker', icon: 'fa-screwdriver-wrench', roles: ['manager', 'csr', 'dispatcher'] },
        { id: 'work_orders', label: 'Work Orders & Estimates', icon: 'fa-clipboard-list', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'price_book', label: 'Company Price Book', icon: 'fa-book-open', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'manuals', label: 'Manuals & Formulas', icon: 'fa-folder-open', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'logs', label: 'Activity & Audit Logs', icon: 'fa-shield-halved', roles: ['manager'] }
      ];

      return `
        <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
          <div>
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
              <div class="bg-slate-900 border border-red-600/30 px-3 py-1.5 rounded-xl shadow-lg shadow-red-600/10 flex items-center">
                <span class="font-black text-xl tracking-tighter text-white">R</span>
                <span class="font-black text-xl tracking-tighter text-red-500 ml-0.5">C</span>
              </div>
              <div>
                <h1 class="font-bold text-white tracking-wide text-sm leading-tight">RELIANCE</h1>
                <p class="text-[10px] text-red-500 font-bold uppercase tracking-widest leading-tight">CONNECTIONS</p>
              </div>
            </div>

            <nav class="p-3 space-y-1">
              ${navItems.filter(item => item.roles.includes(userRole)).map(item => `
                <button onclick="setView('${item.id}')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition ${
                  appState.currentView === item.id 
                    ? 'bg-red-600 text-white shadow-lg shadow-red-600/20' 
                    : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'
                }">
                  <i class="fa-solid ${item.icon} w-5 text-center"></i>
                  ${item.label}
                </button>
              `).join('')}
            </nav>
          </div>

          <div class="p-4 border-t border-slate-800 bg-slate-950/80">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-red-500 text-sm flex-shrink-0">
                  ${appState.currentUser.name.charAt(0)}
                </div>
                <div class="truncate">
                  <p class="text-xs font-semibold text-white truncate">${appState.currentUser.name}</p>
                  <span class="inline-block text-[10px] font-bold uppercase px-1.5 py-0.5 rounded bg-red-950/60 text-red-400 border border-red-800/40">
                    ${appState.currentUser.role}
                  </span>
                </div>
              </div>
              <button onclick="handleLogout()" title="Log Out" class="text-slate-400 hover:text-red-400 p-2 transition">
                <i class="fa-solid fa-right-from-bracket"></i>
              </button>
            </div>
          </div>
        </aside>
      `;
    }

    function renderHeader() {
      return `
        <header class="bg-slate-950 border-b border-slate-800 py-3 px-6 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <h2 class="text-lg font-bold text-white capitalize">
              ${appState.currentView.replace('_', ' ')}
            </h2>
            <span class="text-xs text-slate-500">| Trades: HVAC, Plumbing, Electrical, Gates, Generators, Time</span>
          </div>

          <div class="flex items-center gap-3">
            ${appState.currentUser.role === 'manager' ? `
              <button onclick="openAddTeamMemberModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold py-2 px-3 rounded-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-user-plus text-red-500"></i> Add Team User
              </button>
            ` : ''}
            <button onclick="openNewCustomerModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow flex items-center gap-2 transition">
              <i class="fa-solid fa-plus"></i> New Customer
            </button>
          </div>
        </header>
      `;
    }

    // --- VIEW ROUTER ---
    function renderCurrentView() {
      switch (appState.currentView) {
        case 'dashboard': return renderDashboardView();
        case 'customers': return renderCustomersView();
        case 'contacts': return renderContactsView();
        case 'time_report': return renderTimeReportView();
        case 'restock_report': return renderRestockReportView();
        case 'csr_board': return renderCSRBoardView();
        case 'dispatch_board': return renderDispatchBoardView();
        case 'maintenance': return renderMaintenanceView();
        case 'work_orders': return renderWorkOrdersView();
        case 'price_book': return renderPriceBookView();
        case 'manuals': return renderManualsView();
        case 'logs': return renderLogsView();
        default: return renderDashboardView();
      }
    }

    // --- DASHBOARD VIEW ---
    function renderDashboardView() {
      const activeWorkOrders = appState.workOrders.filter(w => w.status !== 'Completed').length;
      const overdueMaint = appState.customers.flatMap(c => c.equipments).filter(e => new Date(e.nextMaintenance) < new Date()).length;

      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-red-950/40 via-slate-900 to-slate-900 border border-red-900/30 rounded-2xl p-6 relative overflow-hidden">
            <div class="relative z-10">
              <h3 class="text-xl font-bold text-white mb-1">Welcome back, ${appState.currentUser.name}</h3>
              <p class="text-xs text-slate-400">Reliance Connections Operational Dashboard & Field Trade Overview</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-5">
              <div class="flex items-center justify-between text-slate-400 mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider">Total Customers</span>
                <i class="fa-solid fa-users text-red-500"></i>
              </div>
              <p class="text-2xl font-black text-white">${appState.customers.length}</p>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-5">
              <div class="flex items-center justify-between text-slate-400 mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider">Tracked Sub-Assets</span>
                <i class="fa-solid fa-layer-group text-red-500"></i>
              </div>
              <p class="text-2xl font-black text-white">${appState.customers.reduce((acc, c) => acc + c.equipments.length, 0)}</p>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-5">
              <div class="flex items-center justify-between text-slate-400 mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider">Active Jobs</span>
                <i class="fa-solid fa-truck-fast text-red-500"></i>
              </div>
              <p class="text-2xl font-black text-white">${activeWorkOrders}</p>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-5">
              <div class="flex items-center justify-between text-slate-400 mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider">Maint. Alerts Due</span>
                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
              </div>
              <p class="text-2xl font-black text-amber-400">${overdueMaint}</p>
            </div>
          </div>
        </div>
      `;
    }

    // --- TIME TAB & DAILY TECH REPORT VIEW ---
    function renderTimeReportView() {
      const isManager = appState.currentUser.role === 'manager';
      const currentUser = appState.currentUser;

      let targetTechName = '';
      if (!isManager) {
        targetTechName = currentUser.name;
      } else if (appState.timeReportTechId) {
        const foundTech = appState.technicians.find(t => t.id === appState.timeReportTechId);
        if (foundTech) targetTechName = foundTech.name;
      }

      const selectedDate = appState.timeReportDate || new Date().toISOString().split('T')[0];

      const matchingWorkOrders = appState.workOrders.filter(wo => {

    // --- CSR SLOT BOOKING BOARD ---
    function renderCSRBoardView() {
      return `

          <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-white text-sm">CSR Time-Slot Booking Matrix</h3>

                ${appState.csrSlots.map(slot => `
                  <tr>
                    <td class="p-4 font-bold font-mono text-slate-200 bg-slate-900/30">${slot.time}</td>${['csr1', 'csr2', 'csr3'].map(station => {
                      const data = slot[station];
                      return `
                        <td class="p-4">
                          ${data.booked ? `
                            <div class="p-3 bg-red-950/30 border border-red-800/40 rounded-lg relative group">
                              <div class="flex items-start justify-between">
                                <span class="text-[10px] font-bold text-red-400 uppercase tracking-wider">${data.jobType}</span>
                                <div class="space-x-1">
                                  <button onclick="editCSRSlot('${slot.time}', '${station}')" title="Edit Slot Details" class="text-slate-400 hover:text-white text-[11px]">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                  </button>
                                  <button onclick="clearCSRSlot('${slot.time}', '${station}')" title="Clear/Unbook Slot" class="text-slate-500 hover:text-red-400 text-[11px]">
                                    <i class="fa-solid fa-trash-can"></i>
                                  </button>
                                </div>
                              </div>
                              <p class="font-semibold text-white mt-1">${data.customer}</p>
                              <span class="inline-block mt-2 text-[10px] px-1.5 py-0.5 bg-red-900/50 text-red-200 rounded">Booked Slot</span>
                            </div>
                          ` : `
                            <button onclick="bookCSRSlot('${slot.time}', '${station}')" class="w-full py-4 border border-dashed border-slate-800 rounded-lg text-slate-500 hover:border-red-600/50 hover:text-red-400 transition font-medium text-xs">
                              + Open Slot (Click to Book)
                            </button>
                          `}
                        </td>
                      `;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function bookCSRSlot(time, station) {
      const custName = prompt("Enter Customer Name for Booking:");
      if (!custName) return;
      const jobType = prompt("Enter Service Type (e.g., Gate Repair, HVAC Tuneup, Generator Check):", "Routine Maintenance");

      const slotRow = appState.csrSlots.find(s => s.time === time);
      if (slotRow) {
        slotRow[station] = { booked: true, jobType: jobType || 'Service Call', customer: custName };
        saveAppState();
      }
    }

    function editCSRSlot(time, station) {
      const slotRow = appState.csrSlots.find(s => s.time === time);
      if (!slotRow || !slotRow[station].booked) return;

      const currentData = slotRow[station];
      const custName = prompt("Edit Customer Name:", currentData.customer);
      if (custName === null) return;
      const jobType = prompt("Edit Service Type:", currentData.jobType);
      if (jobType === null) return;

      slotRow[station] = {
        booked: true,
        customer: custName || currentData.customer,
        jobType: jobType || currentData.jobType
      };
      saveAppState();
    }

    function clearCSRSlot(time, station) {
      if (confirm("Are you sure you want to clear/unbook this CSR slot?")) {
        const slotRow = appState.csrSlots.find(s => s.time === time);
        if (slotRow) {
          slotRow[station] = { booked: false };
          saveAppState();
        }
      }
    }

    function assignTechToWO(woId, techId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      const tech = appState.technicians.find(t => t.id === techId);
      if (wo) {
        wo.techId = techId;
        wo.techName = tech ? tech.name : '';
        if (techId && wo.status === 'Unassigned') wo.status = 'Dispatched';
        saveAppState();
      }
    }

    function updateWOStatus(woId, newStatus) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        wo.status = newStatus;
        saveAppState();
      }
    }

    function editWorkOrderDetails(woId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo) return;

      const customerName = prompt("Edit Customer Name:", wo.customerName);
      if (customerName === null) return;
      const equipmentName = prompt("Edit Equipment / Asset Name:", wo.equipmentName);
      if (equipmentName === null) return;
      const trade = prompt("Edit Trade Category (HVAC, Plumbing, Electrical, Gates, Generators, Time):", wo.trade);
      if (trade === null) return;
      const description = prompt("Edit Job Description / Notes:", wo.description);
      if (description === null) return;

      wo.customerName = customerName || wo.customerName;
      wo.equipmentName = equipmentName || wo.equipmentName;
      wo.trade = trade || wo.trade;
      wo.description = description !== null ? description : wo.description;

      saveAppState();
    }

    function addLineItemToWO(woId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (!wo) return;

      const code = prompt("Part Number / Item Code (e.g., FLT-2025, R410A):", "PART-001");
      if (!code) return;
      const title = prompt("Line Item Title or Part Description:");
      if (!title) return;
      const qty = parseInt(prompt("Quantity:", "1") || "1");
      const unitPrice = parseFloat(prompt("Unit Flat-Rate Price ($):", "100.00") || "0");
      const minutes = parseInt(prompt("Tech Pay Minutes for this item:", "30") || "0");
      const spiff = parseFloat(prompt("SPIFF Bonus Amount ($):", "0") || "0");

      if (!wo.lineItems) wo.lineItems = [];
      wo.lineItems.push({
        id: 'li-' + Date.now(),
        code: code.toUpperCase(),
        title,
        qty: isNaN(qty) ? 1 : qty,
        unitPrice: isNaN(unitPrice) ? 0 : unitPrice,
        minutes: isNaN(minutes) ? 0 : minutes,
        spiff: isNaN(spiff) ? 0 : spiff,
        total: (isNaN(qty) ? 1 : qty) * (isNaN(unitPrice) ? 0 : unitPrice)
      });

      saveAppState();
    }

    function addWorkOrderNote(e, woId) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const noteText = input.value.trim();
      if (!noteText) return;

      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        wo.workLogs.push({
          id: 'wl-' + Date.now(),
          timestamp: new Date().toLocaleString(),
          user: appState.currentUser.name,
          note: noteText
        });
        saveAppState();
      }
    }

                  <th class="p-4">Category</th>
                  <th class="p-4">Next Due Date</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${filteredEquipments.map(eq => `
                  <tr class="hover:bg-slate-900/50">
                    <td class="p-4 font-bold text-white">${eq.parentCustomer}</td>
                    <td class="p-4 font-medium">${eq.name} <span class="text-slate-500 font-mono">(${eq.serial})</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 bg-slate-800 rounded font-bold">${eq.category}</span></td>
                    <td class="p-4 font-semibold text-emerald-400">${eq.nextMaintenance}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- MANAGER AUDIT LOG VIEW WITH FILTERS ---
    function renderLogsView() {
      const filters = appState.auditFilter;
      const query = (filters.search || '').toLowerCase();

      const filteredLogs = appState.customerChangeLogs.filter(l => {
        const matchesQuery = !query || 
          l.user.toLowerCase().includes(query) || 
          l.customerName.toLowerCase().includes(query) || 
          l.action.toLowerCase().includes(query) || 
          l.details.toLowerCase().includes(query);

        let matchesUser = true;
        if (filters.user === 'tech') {
          matchesUser = l.user.includes('(TECHNICIAN)');
        } else if (filters.user === 'office') {
          matchesUser = l.user.includes('(MANAGER)') || l.user.includes('(CSR)') || l.user.includes('(DISPATCHER)');
        }

        let matchesCustomer = !filters.customer || l.customerId === filters.customer || l.customerName === filters.customer;
        let matchesDate = true;
        if (filters.date) {
          matchesDate = l.timestamp.includes(filters.date) || l.timestamp.startsWith(filters.date);
        }

        return matchesQuery && matchesUser && matchesCustomer && matchesDate;
      });

      return `
        <div class="space-y-6">
          <div class="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-bold text-white text-sm">Manager Audit & Activity Log</h3>
                <p class="text-xs text-slate-400 mt-0.5">Filter system activity records by staff type, customer, date, or keywords</p>
              </div>
              <button onclick="resetAuditFilters()" class="text-xs bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg transition">
                Reset Filters
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-2 border-t border-slate-800/80">
              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Search Keywords</label>
                <input type="text" value="${filters.search}" oninput="updateAuditFilter('search', this.value)" placeholder="Search action, details..." class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500" />
              </div>

              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Staff Type</label>
                <select onchange="updateAuditFilter('user', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500">
                  <option value="">All Staff</option>
                  <option value="office" ${filters.user === 'office' ? 'selected' : ''}>Office Staff (Manager/CSR/Dispatcher)</option>
                  <option value="tech" ${filters.user === 'tech' ? 'selected' : ''}>Technicians</option>
                </select>
              </div>

              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Customer</label>
                <select onchange="updateAuditFilter('customer', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500">
                  <option value="">All Customers</option>
                  ${appState.customers.map(c => `
                    <option value="${c.name}" ${filters.customer === c.name ? 'selected' : ''}>${c.name}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-1">Date</label>
                <input type="date" value="${filters.date}" onchange="updateAuditFilter('date', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:border-red-500" />
              </div>
            </div>
          </div>

          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <table class="w-full text-left text-xs text-slate-300">
              <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                <tr>
                  <th class="p-4">Timestamp</th>
                  <th class="p-4">User</th>
                  <th class="p-4">Customer</th>
                  <th class="p-4">Action</th>
                  <th class="p-4">Details</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${filteredLogs.length > 0 ? filteredLogs.map(l => `
                  <tr class="hover:bg-slate-900/50">
                    <td class="p-4 font-mono text-slate-400 whitespace-nowrap">${l.timestamp}</td>
                    <td class="p-4 font-semibold text-white whitespace-nowrap">${l.user}</td>
                    <td class="p-4 text-slate-300 whitespace-nowrap">${l.customerName || 'N/A'}</td>
                    <td class="p-4 font-bold text-red-400 whitespace-nowrap">${l.action}</td>
                    <td class="p-4 text-slate-400">${l.details}</td>
                  </tr>
                `).join('') : `
                  <tr>
                    <td colspan="5" class="p-6 text-center text-slate-500 italic">No audit logs found matching the selected filters.</td>
                  </tr>
                `}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openNewCustomerModal() {
      const name = prompt("Enter Customer / Company Name:");
      if (!name) return;
      const phone = prompt("Phone:");
      const address = prompt("Address:");
      const newC = { id: 'c-' + Date.now(), name, contactPerson: name, phone: phone || '', email: '', address: address || '', type: 'Commercial', created: '2024-02-18', equipments: [] };
      appState.customers.push(newC);
      saveAppState();
    }

    function openAddTeamMemberModal() {
      const name = prompt("Enter Name:");
      const role = prompt("Role (manager, csr, dispatcher, technician, parts):", "parts");
      if (name) { appState.users.push({ id: 'u-' + Date.now(), name, email: `${name.toLowerCase().replace(/\s+/g, '')}@reliance.com`, password: '123', role: role.toLowerCase() }); saveAppState(); }
    }

    renderApp();
  </script>
</body>
</html>
