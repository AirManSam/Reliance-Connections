    // Safe Storage Fallback for restricted mobile environments
    let memoryFallbackState = null;

    function loadAppState() {
      try {
        const saved = localStorage.getItem('reliance_crm_state_mobile_v2');
        return saved ? JSON.parse(saved) : INITIAL_STATE;
      } catch (e) {
        console.warn("localStorage restricted, using memory fallback.");
        return memoryFallbackState || INITIAL_STATE;
      }
    }

    function saveAppState() {
      try {
        localStorage.setItem('reliance_crm_state_mobile_v2', JSON.stringify(appState));
      } catch (e) {
        memoryFallbackState = appState;
      }
      renderApp();
    }

    let appState = loadAppState();

    function updateSearch(value) {
      appState.searchTerm = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) mainContainer.innerHTML = renderCurrentView();
    }

    function updateAuditFilter(field, value) {
      appState.auditFilter[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) mainContainer.innerHTML = renderCurrentView();
    }

    function resetAuditFilters() {
      appState.auditFilter = { search: '', user: '', customer: '', date: '' };
      saveAppState();
    }

    function updateTimeFilters(field, value) {
      appState[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) mainContainer.innerHTML = renderCurrentView();
    }

    function updateRestockFilters(field, value) {
      appState[field] = value;
      const mainContainer = document.querySelector('main');
      if (mainContainer) mainContainer.innerHTML = renderCurrentView();
    }

    function setView(view) {
      appState.currentView = view;
      appState.searchTerm = '';
      appState.mobileMenuOpen = false;
      saveAppState();
    }

    function toggleMobileMenu() {
      appState.mobileMenuOpen = !appState.mobileMenuOpen;
      renderApp();
    }

    // --- MAIN RENDERER ---
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      
      if (!appState.currentUser) {
        root.innerHTML = renderLoginScreen();
        return;
      }

      root.innerHTML = `
        <div class="flex flex-col md:flex-row h-screen bg-slate-900 overflow-hidden relative">
          ${renderSidebar()}
          <div class="flex-1 flex flex-col overflow-hidden w-full">
            ${renderHeader()}
            <main class="flex-1 overflow-y-auto p-3 sm:p-6 bg-slate-900/50 custom-scrollbar relative">
              ${renderCurrentView()}
            </main>
          </div>
        </div>
      `;
    }

    // --- LOGIN SCREEN ---
    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-700"></div>
            <div class="text-center mb-6 sm:mb-8">
              <div class="inline-flex items-center justify-center bg-red-600 px-3.5 py-1.5 rounded-lg mb-3 shadow-md">
                <span class="font-sans font-bold text-xl tracking-normal text-white">R</span><span class="font-sans font-bold text-xl tracking-normal text-white ml-1">C</span>
              </div>
              <h1 class="text-xl sm:text-2xl font-bold text-white tracking-wide">RELIANCE CONNECTIONS</h1>
              <p class="text-[11px] text-slate-400 mt-1 uppercase tracking-widest font-semibold">Field Operations CRM (Mobile)</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4 sm:space-y-5">
              <div>
                <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Select Account</label>
                <select id="loginUserSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-red-500 transition">
                  ${appState.users.map(u => `<option value="${u.id}">${u.name} — (${u.role.toUpperCase()})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" value="password" id="loginPassword" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-red-500 transition" required />
              </div>
              <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to CRM
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const userId = document.getElementById('loginUserSelect').value;
      const user = appState.users.find(u => u.id === userId);
      if (user) {
        appState.currentUser = user;
        saveAppState();
      }
    }

    function handleLogout() {
      appState.currentUser = null;
      appState.mobileMenuOpen = false;
      saveAppState();
    }

    // --- SIDEBAR ---

        { id: 'time_report', label: 'Time', icon: 'fa-clock', roles: ['manager', 'csr', 'dispatcher', 'technician'] },
        { id: 'restock_report', label: 'Restock', icon: 'fa-boxes-packing', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'csr_board', label: 'CSR Slot Booking', icon: 'fa-calendar-days', roles: ['manager', 'csr'] },
        { id: 'dispatch_board', label: 'Multi-Dispatch Board', icon: 'fa-headset', roles: ['manager', 'dispatcher', 'parts'] },
        { id: 'maintenance', label: 'Maintenance Tracker', icon: 'fa-screwdriver-wrench', roles: ['manager', 'csr', 'dispatcher'] },
        { id: 'work_orders', label: 'Work Orders & Estimates', icon: 'fa-clipboard-list', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'price_book', label: 'Company Price Book', icon: 'fa-book-open', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'manuals', label: 'Manuals & Formulas', icon: 'fa-folder-open', roles: ['manager', 'csr', 'dispatcher', 'technician', 'parts'] },
        { id: 'logs', label: 'Activity & Audit Logs', icon: 'fa-shield-halved', roles: ['manager'] }

      const filteredNav = navItems.filter(item => item.roles.includes(userRole));

      return `
        ${appState.mobileMenuOpen ? `<div onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm"></div>` : ''}

            <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between">

                <div class="bg-red-600 px-2.5 py-1 rounded shadow-md flex items-center">
                  <span class="font-sans font-bold text-base tracking-normal text-white">R</span><span class="font-sans font-bold text-base tracking-normal text-white ml-1">C</span>
                </div>
                <div>

                  <p class="text-[10px] text-red-500 font-bold uppercase tracking-widest leading-tight">CONNECTIONS</p>
                </div>
              </div>
              <button onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>
            <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)] custom-scrollbar">
              ${filteredNav.map(item => `
                <button onclick="setView('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${
                  appState.currentView === item.id ? 'bg-red-600 text-white shadow-lg shadow-red-600/20' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'
                }">
                  <i class="fa-solid ${item.icon} w-5 text-center"></i>
                  ${item.label}
                </button>
              `).join('')}
            </nav>
          </div>
          <div class="p-4 border-t border-slate-800 bg-slate-950/80">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-red-500 text-sm flex-shrink-0">
                  ${appState.currentUser.name.charAt(0)}
                </div>
                <div class="truncate">
                  <p class="text-xs font-semibold text-white truncate">${appState.currentUser.name}</p>
                  <span class="inline-block text-[10px] font-bold uppercase px-1.5 py-0.5 rounded bg-red-950/60 text-red-400 border border-red-800/40">
                    ${appState.currentUser.role}

              </button>
            </div>
          </div>
        </aside>
      `;
    }

      return `

          <div class="flex items-center gap-3 overflow-hidden">

              <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <div class="truncate">
              <h2 class="text-sm sm:text-lg font-bold text-white capitalize truncate">
                ${appState.currentView.replace('_', ' ')}
              </h2>
            </div>
          </div>
          <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
            ${appState.currentUser.role === 'manager' ? `
              <button onclick="openAddTeamMemberModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold py-2 px-2.5 rounded-lg flex items-center gap-1.5 transition">
                <i class="fa-solid fa-user-plus text-red-500"></i> <span class="hidden sm:inline">Add Team</span>
              </button>
            ` : ''}
            <button onclick="openNewCustomerModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-2.5 rounded-lg shadow flex items-center gap-1.5 transition">
              <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">New Customer</span>
            </button>
          </div>
        </header>
      `;
    }

    function renderCurrentView() {
      switch (appState.currentView) {
        case 'dashboard': return renderDashboardView();
        case 'customers': return renderCustomersView();
        case 'contacts': return renderContactsView();
        case 'time_report': return renderTimeReportView();
        case 'restock_report': return renderRestockReportView();
        case 'csr_board': return renderCSRBoardView();
        case 'dispatch_board': return renderDispatchBoardView();
        case 'maintenance': return renderMaintenanceView();
        case 'work_orders': return renderWorkOrdersView();
        case 'price_book': return renderPriceBookView();
        case 'manuals': return renderManualsView();
        case 'logs': return renderLogsView();
        default: return renderDashboardView();
      }
    }

              <h3 class="text-lg sm:text-xl font-bold text-white mb-1">Welcome back, ${appState.currentUser.name}</h3>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 sm:p-5">
              <div class="flex items-center justify-between text-slate-400 mb-2">

      const custName = prompt("Enter Customer Name for Booking:");
      if (!custName) return;
      const slotRow = appState.csrSlots.find(s => s.time === time);
      if (slotRow) {
        slotRow[station] = { booked: true, jobType: 'Service Call', customer: custName };
        saveAppState();
      }
    }

    function clearCSRSlot(time, station) {
      if (confirm("Unbook this slot?")) {
        const slotRow = appState.csrSlots.find(s => s.time === time);
        if (slotRow) { slotRow[station] = { booked: false }; saveAppState(); }
      }
    }

      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-950 p-4 rounded-xl border border-slate-800 gap-3">
            <div>
              <h3 class="font-bold text-white text-sm">Multi-Dispatcher Live Operations Board</h3>
              <p class="text-xs text-slate-400">Assign technicians and manage job statuses</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
              <div class="relative flex-1 sm:w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-search"></i></span>
                <input type="text" value="${appState.searchTerm || ''}" oninput="updateSearch(this.value)" placeholder="Search work orders..." class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-red-500" />
              </div>
              <button onclick="openCreateWorkOrderModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow flex items-center gap-2 transition flex-shrink-0"><i class="fa-solid fa-plus"></i> New</button>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            ${statuses.map(status => {
              const orders = appState.workOrders.filter(w => w.status === status && (!query || w.id.toLowerCase().includes(query) || w.customerName.toLowerCase().includes(query)));
              return `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col h-auto md:h-[600px]">
                  <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                    <h4 class="font-bold text-xs uppercase tracking-wider text-slate-300">${status}</h4>
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400">${orders.length}</span>
                  </div>
                  <div class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1">
                    ${orders.map(wo => `
                      <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
                        <div class="flex items-center justify-between mb-2">
                          <span class="font-mono font-bold text-xs text-red-400">${wo.id}</span>
                          <span class="text-[10px] font-bold px-1.5 py-0.5 bg-slate-800 rounded text-slate-300">${wo.trade}</span>
                        </div>
                        <h5 class="font-bold text-white text-xs mb-0.5">${wo.customerName}</h5>
                        <p class="text-[11px] text-slate-400 mb-3">${wo.equipmentName}</p>
                        <div class="space-y-2 pt-2 border-t border-slate-800 text-[11px]">
                          <div>
                            <label class="block text-[10px] text-slate-500 uppercase font-semibold mb-1">Assign Tech</label>
                            <select onchange="assignTechToWO('${wo.id}', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-300">
                              <option value="">-- Select --</option>
                              ${appState.technicians.map(t => `<option value="${t.id}" ${wo.techId === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                            </select>
                          </div>
                          <div>
                            <label class="block text-[10px] text-slate-500 uppercase font-semibold mb-1">Status</label>
                            <select onchange="updateWOStatus('${wo.id}', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-300">
                              ${statuses.map(s => `<option value="${s}" ${wo.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                          </div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function assignTechToWO(woId, techId) {
      const wo = appState.workOrders.find(w => w.id === woId);
      const tech = appState.technicians.find(t => t.id === techId);
      if (wo) { wo.techId = techId; wo.techName = tech ? tech.name : ''; saveAppState(); }
    }

    function updateWOStatus(woId, newStatus) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) { wo.status = newStatus; saveAppState(); }
    }

    function openCreateWorkOrderModal() {
      const customerName = prompt("Customer Name:");
      if (!customerName) return;
      appState.workOrders.push({
        id: 'WO-' + Math.floor(1000 + Math.random() * 9000),
        customerId: 'c-custom', customerName, equipmentName: 'General Service', trade: 'HVAC', status: 'Unassigned',
        needsFollowUp: false, techId: '', techName: '', createdDate: new Date().toISOString().split('T')[0], description: 'Ticket created.', lineItems: [], workLogs: [], attachments: []
      });
      saveAppState();
    }

    function renderPriceBookView() {
      const isManager = appState.currentUser.role === 'manager';
      const query = (appState.searchTerm || '').toLowerCase();
      const filteredPriceBook = appState.priceBook.filter(pb => pb.code.toLowerCase().includes(query) || pb.title.toLowerCase().includes(query));
      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-white text-sm">Standard Company Price Book</h3>
              <p class="text-xs text-slate-400 mt-1">Master rates for flat-rate labor and diagnostics</p>
            </div>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
              <table class="w-full text-left text-xs text-slate-300 min-w-[650px]">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="p-3 sm:p-4">Item Code</th>
                    <th class="p-3 sm:p-4">Title</th>
                    <th class="p-3 sm:p-4">Category</th>
                    <th class="p-3 sm:p-4 text-right">Standard Rate</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${filteredPriceBook.map(pb => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-3 sm:p-4 font-mono font-bold text-red-400 whitespace-nowrap">${pb.code}</td>
                      <td class="p-3 sm:p-4 font-bold text-white whitespace-nowrap">${pb.title}</td>
                      <td class="p-3 sm:p-4 whitespace-nowrap"><span class="px-2 py-0.5 bg-slate-800 rounded font-semibold text-slate-300">${pb.category}</span></td> <td class="p-3 sm:p-4 text-right font-mono font-bold text-emerald-400 whitespace-nowrap">$${pb.unitPrice.toFixed(2)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderManualsView() {
      const query = (appState.searchTerm || '').toLowerCase();
      const filteredKB = appState.knowledgeBase.filter(kb => kb.title.toLowerCase().includes(query) || kb.category.toLowerCase().includes(query));
      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-white text-sm">Public Company Manuals & Technical Formulas</h3>
              <p class="text-xs text-slate-400 mt-1">Shared knowledge repository</p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${filteredKB.map(kb => `
              <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-900 text-slate-300">${kb.category}</span>
                    <span class="text-[10px] font-bold text-red-400 bg-red-950/60 px-1.5 py-0.5 rounded">${kb.fileType}</span>
                  </div>
                  <h4 class="font-bold text-white text-sm mb-1">${kb.title}</h4>
                  <p class="text-xs text-slate-400">${kb.notes}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderWorkOrdersView() {
      const query = (appState.searchTerm || '').toLowerCase();
      const filteredWorkOrders = appState.workOrders.filter(wo => wo.id.toLowerCase().includes(query) || wo.customerName.toLowerCase().includes(query));
      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-white text-sm">Work Orders, Estimates & Technician Pay</h3>
              <p class="text-xs text-slate-400 mt-1">Manage line items, pay minutes, and SPIFFs</p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${filteredWorkOrders.map(wo => `
              <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 sm:p-5 space-y-3">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span class="font-mono font-bold text-red-500 text-sm">${wo.id}</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-800">${wo.status}</span>
                </div>
                <h4 class="font-bold text-white text-base">${wo.customerName}</h4>
                <p class="text-xs text-slate-400">${wo.equipmentName} (${wo.techName || 'Unassigned'})</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderMaintenanceView() {
      const allEquipments = appState.customers.flatMap(c => c.equipments.map(e => ({ ...e, parentCustomer: c.name })));
      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-white text-sm">Preventative Maintenance Tracker</h3>
              <p class="text-xs text-slate-400 mt-1">Automatic maintenance schedules</p>
            </div>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
              <table class="w-full text-left text-xs text-slate-300 min-w-[600px]">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="p-3 sm:p-4">Customer</th>
                    <th class="p-3 sm:p-4">Asset</th>
                    <th class="p-3 sm:p-4">Category</th>
                    <th class="p-3 sm:p-4">Next Bill Date</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${allEquipments.map(eq => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-3 sm:p-4 font-bold text-white whitespace-nowrap">${eq.parentCustomer}</td>
                      <td class="p-3 sm:p-4 whitespace-nowrap">${eq.name}</td>
                      <td class="p-3 sm:p-4 whitespace-nowrap"><span class="px-2 py-0.5 bg-slate-800 rounded font-bold">${eq.category}</span></td>
                      <td class="p-3 sm:p-4 font-semibold text-emerald-400 whitespace-nowrap">${eq.nextMaintenance}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderLogsView() {
      return `
        <div class="space-y-4 sm:space-y-6">
          <div class="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800">
            <h3 class="font-bold text-white text-sm">Manager Audit & Activity Log</h3>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
              <table class="w-full text-left text-xs text-slate-300 min-w-[700px]">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="p-3 sm:p-4">Timestamp</th>
                    <th class="p-3 sm:p-4">User</th>
                    <th class="p-3 sm:p-4">Customer</th>
                    <th class="p-3 sm:p-4">Action</th>
                    <th class="p-3 sm:p-4">Details</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${appState.customerChangeLogs.map(l => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-3 sm:p-4 font-mono text-slate-400 whitespace-nowrap">${l.timestamp}</td>
                      <td class="p-3 sm:p-4 font-semibold text-white whitespace-nowrap">${l.user}</td>
                      <td class="p-3 sm:p-4 text-slate-300 whitespace-nowrap">${l.customerName || 'N/A'}</td>
                      <td class="p-3 sm:p-4 font-bold text-red-400 whitespace-nowrap">${l.action}</td>
                      <td class="p-3 sm:p-4 text-slate-400">${l.details}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function openNewCustomerModal() {
      const name = prompt("Enter Customer Name:");
      if (!name) return;
      appState.customers.push({ id: 'c-' + Date.now(), name, contactPerson: name, phone: '555-0100', email: '', address: '123 Main St', type: 'Commercial', created: new Date().toISOString().split('T')[0], equipments: [] });
      saveAppState();
    }

    function openAddTeamMemberModal() {
      const name = prompt("Enter Name:");
      if (!name) return;
      appState.users.push({ id: 'u-' + Date.now(), name, email: name.toLowerCase() + '@reliance.com', password: '123', role: 'technician' });
      saveAppState();
    }

    renderApp();
  </script>
</body>
</html>
