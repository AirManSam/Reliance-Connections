umber(a.visitsUsed||0)} / ${Number(a.visitsIncluded||0)} used</td><td>${esc(a.renewal||'—')} ${a.status==='Active'&&a.renewal&&a.renewal<=date(45)?badge('Renew soon'):''}</td><td>${badge(a.status)}</td><td><button class="btn small" onclick="editAgreement('${a.id}')">Edit</button> ${a.status==='Active'?`<button class="btn small" onclick="useAgreementVisit('${a.id}')">Log visit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No agreements yet. Add a maintenance plan or recurring service contract.</td></tr>'}</tbody></table></div></div>`}

function agreementModal(a){modal(a.id?'Edit service agreement':'New service agreement','Define the coverage and recurring value. Billing is tracked here; this does not automatically charge customers.',`<div class="formgrid"><label class="field full">Agreement name<input id="agrTitle" value="${esc(a.title||'')}" required></label><label class="field">Customer<select id="agrCustomer">${customerSelect(a.customerId||'')}</select></label><label class="field">Covered asset / scope<input id="agrAsset" value="${esc(a.asset||'')}" placeholder="All equipment or specific system"></label><label class="field">Coverage type<select id="agrCoverage">${['Preventive maintenance','Parts and labor','Labor only','Priority response','Inspection only','Custom'].map(x=>`<option ${a.coverage===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Status<select id="agrState">${['Active','Pending','Expired','Cancelled'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Billing amount ($)<input id="agrValue" type="number" min="0" step="0.01" value="${Number(a.value)||0}"></label><label class="field">Billing frequency<select id="agrFrequency">${['Monthly','Quarterly','Annual','Per visit'].map(x=>`<option ${a.frequency===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Start date<input id="agrStart" type="date" value="${esc(a.start||'')}"></label><label class="field">Renewal / end date<input id="agrRenewal" type="date" value="${esc(a.renewal||'')}"></label><label class="field">Included visits<input id="agrIncluded" type="number" min="0" step="1" value="${Number(a.visitsIncluded)||0}"></label><label class="field">Visits used<input id="agrUsed" type="number" min="0" step="1" value="${Number(a.visitsUsed)||0}"></label><label class="field full">Notes<input id="agrNotes" value="${esc(a.notes||'')}"></label></div>`,`saveAgreement('${a.id||''}')`,'Save agreement')}
function saveAgreement(id){let title=document.getElementById('agrTitle').value.trim();if(!title)return toast('Enter an agreement name');let a=id?db.agreements.find(a=>a.id===id):null;if(!a){a={id:uid('AGR'),created:date()};db.agreements.unshift(a)}Object.assign(a,{title,customerId:document.getElementById('agrCustomer').value,asset:document.getElementById('agrAsset').value.trim(),coverage:document.getElementById('agrCoverage').value,status:document.getElementById('agrState').value,value:Math.max(0,Number(document.getElementById('agrValue').value)||0),frequency:document.getElementById('agrFrequency').value,start:document.getElementById('agrStart').value,renewal:document.getElementById('agrRenewal').value,visitsIncluded:Math.max(0,Number(document.getElementById('agrIncluded').value)||0),visitsUsed:Math.max(0,Number(document.getElementById('agrUsed').value)||0),notes:document.getElementById('agrNotes').value.trim()});log(`Saved service agreement ${a.id}`);closeModal();save('Service agreement saved')}

function saveSupplier(id){let name=document.getElementById('supName').value.trim();if(!name)return toast('Enter a supplier name');let s=id?db.suppliers.find(s=>s.id===id):null;if(!s){s={id:uid('SUP'),created:date()};db.suppliers.unshift(s)}Object.assign(s,{name,category:document.getElementById('supCategory').value.trim(),contact:document.getElementById('supContact').value.trim(),phone:document.getElementById('supPhone').value.trim(),email:document.getElementById('supEmail').value.trim(),leadTime:document.getElementById('supLead').value.trim(),account:document.getElementById('supAccount').value.trim(),notes:document.getElementById('supNotes').value.trim(),preferred:document.getElementById('supPreferred').checked});log(`Saved supplier ${name}`);closeModal();save('Supplier saved')}

function expensesView(){let all=db.expenses||[],sum=all.reduce((s,x)=>s+Number(x.amount||0),0),thisMonth=all.filter(x=>(x.date||'').slice(0,7)===date().slice(0,7)).reduce((s,x)=>s+Number(x.amount||0),0),linked=all.filter(x=>x.jobId).length;return heading('Expenses & job costs','Record parts runs, subcontractors, fuel, disposal, and other direct costs. Costs are kept separate from accounting-system transactions.',`<button class="btn" onclick="exportExpenses()">Export expenses</button><button class="btn primary" onclick="newExpense()">＋ Add expense</button>`)+`<div class="grid stats">${stat('Recorded expenses',all.length,'All expense entries')}${stat('Total recorded',money(sum),'All dates')}${stat('This month',money(thisMonth),'Based on expense date')}${stat('Linked to work orders',linked,'Entries with job attribution')}</div><div class="card"><div class="filters"><input id="expSearch" placeholder="Search vendor, category, work order…" oninput="filterExpenseRows(this.value)"><select id="expCategory" onchange="filterExpenseRows(document.getElementById('expSearch').value)"><option value="all">All categories</option>${['Parts & materials','Subcontractor','Fuel & mileage','Tools & equipment','Disposal','Permit & fees','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Vendor / category</th><th>Work order</th><th>Amount</th><th>Receipt / notes</th><th></th></tr></thead><tbody id="expenseRows">${expenseRows(all)}</tbody></table></div></div><p class="footnote">Use this as an operational log, not a tax ledger. Add receipt references in notes; this prototype does not upload or store receipt files.</p>`}
function expenseRows(list){return list.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<tr class="exp-row" data-search="${esc([x.vendor,x.category,x.jobId,x.notes].join(' ').toLowerCase())}" data-category="${esc(x.category)}"><td>${esc(x.date||'—')}</td><td><b>${esc(x.vendor||'—')}</b><div class="muted">${esc(x.category||'Other')}</div></td><td>${esc(x.jobId||'General overhead')}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.notes||'—')}</td><td><button class="btn small" onclick="editExpense('${x.id}')">Edit</button> <button class="btn small danger" onclick="deleteExpense('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No expenses recorded yet.</td></tr>'}
function filterExpenseRows(q){let cat=document.getElementById('expCategory')?.value||'all';document.querySelectorAll('.exp-row').forEach(r=>r.style.display=(!q||r.dataset.search.includes(q.toLowerCase()))&&(cat==='all'||r.dataset.category===cat)?'':'none')}
function expenseModal(x){modal(x.id?'Edit expense':'Add expense','Capture an expense and optionally attribute it to a work order.',`<div class="formgrid"><label class="field">Date<input id="exDate" type="date" value="${esc(x.date||date())}"></label><label class="field">Amount ($)<input id="exAmount" type="number" min="0" step="0.01" value="${Number(x.amount||0)}"></label><label class="field full">Vendor / payee<input id="exVendor" value="${esc(x.vendor||'')}" required></label><label class="field">Category<select id="exCategory">${['Parts & materials','Subcontractor','Fuel & mileage','Tools & equipment','Disposal','Permit & fees','Other'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Work order<select id="exJob"><option value="">General overhead</option>${db.jobs.map(j=>`<option value="${j.id}" ${x.jobId===j.id?'selected':''}>${esc(j.id)} · ${esc(j.title)}</option>`).join('')}</select></label><label class="field full">Receipt reference / notes<textarea id="exNotes">${esc(x.notes||'')}</textarea></label></div>`,`saveExpense('${x.id||''}')`,x.id?'Save expense':'Add expense')}
function newExpense(){expenseModal({id:'',date:date(),amount:0,vendor:'',category:'Parts & materials',jobId:'',notes:''})}function editExpense(id){let x=db.expenses.find(x=>x.id===id);if(x)expenseModal(x)}function saveExpense(id){let vendor=document.getElementById('exVendor').value.trim(),amount=Number(document.getElementById('exAmount').value);if(!vendor)return toast('Enter a vendor or payee');if(!Number.isFinite(amount)||amount<0)return toast('Enter a valid non-negative amount');let x=id?db.expenses.find(x=>x.id===id):null;if(!x){x={id:uid('EXP')};db.expenses.unshift(x)}Object.assign(x,{date:document.getElementById('exDate').value,vendor,amount,category:document.getElementById('exCategory').value,jobId:document.getElementById('exJob').value,notes:document.getElementById('exNotes').value.trim()});log(`${id?'Updated':'Added'} expense ${vendor} · ${money(amount)}`);closeModal();save('Expense saved')}function deleteExpense(id){if(!confirm('Delete this expense record?'))return;db.expenses=db.expenses.filter(x=>x.id!==id);log(`Deleted expense ${id}`);save('Expense deleted')}function exportExpenses(){exportCSV([['ID','Date','Vendor','Category','Work order','Amount','Notes'],...(db.expenses||[]).map(x=>[x.id,x.date,x.vendor,x.category,x.jobId,x.amount,x.notes])],'reliance-expenses.csv')}
function warrantyView(){let all=db.warranties||[],open=all.filter(x=>!['Resolved','Closed','Rejected'].includes(x.status)),late=open.filter(x=>x.due&&x.due<date());return heading('Warranty claims','Track callbacks, workmanship issues, part defects, and resolutions so nothing falls through the cracks.',`<button class="btn" onclick="exportWarranties()">Export claims</button><button class="btn primary" onclick="newWarranty()">＋ New claim</button>`)+`<div class="grid stats">${stat('Total claims',all.length,'All recorded claims')}${stat('Open claims',open.length,'Awaiting action',open.length?'stataccent':'')}${stat('Past target date',late.length,'Open claims past due',late.length?'stataccent':'')}${stat('Recorded resolution cost',money(all.reduce((s,x)=>s+Number(x.cost||0),0)),'Cost entered on claims')}</div><div class="card"><div class="filters"><input id="warSearch" placeholder="Search claim, customer, work order, asset…" oninput="filterWarrantyRows(this.value)"><select id="warStatus" onchange="filterWarrantyRows(document.getElementById('warSearch').value)"><option value="all">All statuses</option>${['New','Reviewing','Waiting on supplier','Scheduled','Resolved','Rejected','Closed'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Claim</th><th>Customer / asset</th><th>Work order</th><th>Opened / target</th><th>Issue</th><th>Status</th><th>Cost</th><th></th></tr></thead><tbody>${all.map(x=>`<tr class="war-row" data-search="${esc([x.id,cust(x.customerId).name,x.asset,x.jobId,x.issue,x.type].join(' ').toLowerCase())}" data-status="${esc(x.status)}"><td><b>${esc(x.id)}</b><div class="muted">${esc(x.type)}</div></td><td>${esc(cust(x.customerId).name)}<div class="muted">${esc(x.asset||'—')}</div></td><td>${esc(x.jobId||'—')}</td><td>${esc(x.opened||'—')}<div class="muted">Target: ${esc(x.due||'—')}</div></td><td>${esc(x.issue||'—')}</td><td>${badge(x.status)}</td><td>${money(x.cost)}</td><td><button class="btn small" onclick="editWarranty('${x.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No warranty claims yet.</td></tr>'}</tbody></table></div></div>`}
function filterWarrantyRows(q){let st=document.getElementById('warStatus')?.value||'all';document.querySelectorAll('.war-row').forEach(r=>r.style.display=(!q||r.dataset.search.includes(q.toLowerCase()))&&(st==='all'||r.dataset.status===st)?'':'none')}
function warrantyModal(x){modal(x.id?'Edit warranty claim':'New warranty claim','Document the issue, ownership, target response, and any cost to resolve.',`<div class="formgrid"><label class="field">Customer<select id="waCustomer">${db.customers.map(c=>`<option value="${c.id}" ${x.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field">Related work order<select id="waJob"><option value="">Not linked</option>${db.jobs.map(j=>`<option value="${j.id}" ${x.jobId===j.id?'selected':''}>${esc(j.id)} · ${esc(j.title)}</option>`).join('')}</select></label><label class="field">Claim type<select id="waType">${['Workmanship','Part / manufacturer','Installation','Repeat service call','Other'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Status<select id="waStatus">${['New','Reviewing','Waiting on supplier','Scheduled','Resolved','Rejected','Closed'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field full">Asset / equipment<input id="waAsset" value="${esc(x.asset||'')}"></label><label class="field full">Issue summary<input id="waIssue" value="${esc(x.issue||'')}" required></label><label class="field">Opened date<input id="waOpened" type="date" value="${esc(x.opened||date())}"></label><label class="field">Target date<input id="waDue" type="date" value="${esc(x.due||date(7))}"></label><label class="field">Resolution cost ($)<input id="waCost" type="number" min="0" step="0.01" value="${Number(x.cost||0)}"></label><label class="field full">Resolution / next steps<textarea id="waNotes">${esc(x.notes||'')}</textarea></label></div>`,`saveWarranty('${x.id||''}')`,x.id?'Save claim':'Create claim')}
function newWarranty(){warrantyModal({id:'',customerId:db.customers[0]?.id||'',jobId:'',type:'Workmanship',status:'New',asset:'',issue:'',opened:date(),due:date(7),cost:0,notes:''})}function editWarranty(id){let x=db.warranties.find(x=>x.id===id);if(x)warrantyModal(x)}function saveWarranty(id){let issue=document.getElementById('waIssue').value.trim();if(!issue)return toast('Enter a claim issue summary');let x=id?db.warranties.find(x=>x.id===id):null;if(!x){x={id:uid('WAR')};db.warranties.unshift(x)}Object.assign(x,{customerId:document.getElementById('waCustomer').value,jobId:document.getElementById('waJob').value,type:document.getElementById('waType').value,status:document.getElementById('waStatus').value,asset:document.getElementById('waAsset').value.trim(),issue,opened:document.getElementById('waOpened').value,due:document.getElementById('waDue').value,cost:Math.max(0,Number(document.getElementById('waCost').value)||0),notes:document.getElementById('waNotes').value.trim()});log(`${id?'Updated':'Created'} warranty claim ${x.id} · ${x.status}`);closeModal();save('Warranty claim saved')}function exportWarranties(){exportCSV([['ID','Customer','Work order','Type','Asset','Issue','Opened','Target date','Status','Cost','Resolution notes'],...(db.warranties||[]).map(x=>[x.id,cust(x.customerId).name,x.jobId,x.type,x.asset,x.issue,x.opened,x.due,x.status,x.cost,x.notes])],'reliance-warranty-claims.csv')}
function profitabilityView(){let rows=db.jobs.map(j=>{let inv=db.invoices.filter(i=>i.jobId===j.id).reduce((s,i)=>s+total(i.items),0),est=db.estimates.filter(e=>e.jobId===j.id&&e.status==='Approved').reduce((s,e)=>s+total(e.items),0),revenue=inv||est,expenses=(db.expenses||[]).filter(e=>e.jobId===j.id).reduce((s,e)=>s+Number(e.amount||0),0),parts=(j.parts||[]).reduce((s,p)=>{let item=db.inventory.find(i=>i.id===p.itemId||i.sku===p.sku||i.name===p.name);return s+(item?Number(item.cost||0)*Number(p.qty||1):0)},0),laborHours=(j.labor||[]).reduce((s,l)=>s+Number(l.hours||0),0),laborCost=laborHours*Number(db.settings.loadedLaborCost??38),margin=revenue-expenses-parts-laborCost;return {j,revenue,expenses,parts,laborHours,laborCost,margin}}),revenue=rows.reduce((s,r)=>s+r.revenue,0),cost=rows.reduce((s,r)=>s+r.expenses+r.parts+r.laborCost,0),positive=rows.filter(r=>r.revenue>0),avg=positive.length?positive.reduce((s,r)=>s+r.margin,0)/positive.length:0;return heading('Profitability','A practical job-level view using linked invoices or approved estimates minus recorded job expenses and identifiable parts cost.',`<button class="btn" onclick="exportProfitability()">Export profitability</button><button class="btn" onclick="go('expenses')">＋ Add job cost</button>`)+`<div class="notice">This is an estimate, not a full gross-margin report: loaded labor cost uses the configurable company-wide hourly rate, and overhead allocation, taxes, discounts, unlinked expenses, and untracked material usage remain excluded. Invoice value takes precedence over an approved estimate for each work order.</div><div class="grid stats">${stat('Tracked job revenue',money(revenue),'Invoice totals or approved estimates')}${stat('Estimated costs',money(cost),'Linked expenses + parts + logged labor')}${stat('Estimated contribution',money(revenue-cost),'Before overhead and unlinked costs',revenue>=cost?'':'stataccent')}${stat('Average per valued job',money(avg),'Jobs with invoice / approved estimate')}</div><div class="card"><div class="cardhead"><div><h2>Work order contribution</h2><p class="muted">Link expenses to a work order for more useful estimates.</p></div><input id="profitSearch" placeholder="Search work orders or customers…" oninput="filterProfitRows(this.value)" style="max-width:270px"></div><div class="tablewrap"><table><thead><tr><th>Work order</th><th>Customer</th><th>Status</th><th>Revenue basis</th><th>Revenue</th><th>Linked expenses</th><th>Parts cost</th><th>Labor cost</th><th>Est. contribution</th></tr></thead><tbody>${rows.map(r=>`<tr class="profit-row" data-search="${esc([r.j.id,r.j.title,cust(r.j.customerId).name].join(' ').toLowerCase())}"><td><b>${esc(r.j.id)}</b><div class="muted">${esc(r.j.title)}</div></td><td>${esc(cust(r.j.customerId).name)}</td><td>${badge(r.j.status)}</td><td>${r.revenue?(db.invoices.some(i=>i.jobId===r.j.id)?'Invoice':'Approved estimate'):'No linked revenue'}</td><td>${money(r.revenue)}</td><td>${money(r.expenses)}</td><td>${money(r.parts)}</td><td><b>${money(r.margin)}</b></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No work orders yet.</td></tr>'}</tbody></table></div></div><p class="footnote">Inventory parts cost is only inferred when a work-order parts entry can be matched to an inventory item by ID, SKU, or name. Unmatched parts are excluded.</p>`}
function filterProfitRows(q){document.querySelectorAll('.profit-row').forEach(r=>r.style.display=!q||r.dataset.search.includes(q.toLowerCase())?'':'none')}
function exportProfitability(){let rows=db.jobs.map(j=>{let inv=db.invoices.filter(i=>i.jobId===j.id).reduce((s,i)=>s+total(i.items),0),est=db.estimates.filter(e=>e.jobId===j.id&&e.status==='Approved').reduce((s,e)=>s+total(e.items),0),rev=inv||est,exp=(db.expenses||[]).filter(e=>e.jobId===j.id).reduce((s,e)=>s+Number(e.amount||0),0),parts=(j.parts||[]).reduce((s,p)=>{let i=db.inventory.find(i=>i.id===p.itemId||i.sku===p.sku||i.name===p.name);return s+(i?Number(i.cost||0)*Number(p.qty||1):0)},0),laborHours=(j.labor||[]).reduce((s,l)=>s+Number(l.hours||0),0),laborCost=laborHours*Number(db.settings.loadedLaborCost??38);return [j.id,cust(j.customerId).name,j.title,j.status,inv?'Invoice':est?'Approved estimate':'No linked revenue',rev,exp,parts,laborHours,laborCost,rev-exp-parts-laborCost]});exportCSV([['Work order','Customer','Title','Status','Revenue basis','Revenue','Linked expenses','Matched parts cost','Logged labor hours','Estimated labor cost','Estimated contribution'],...rows],'reliance-job-profitability.csv')}
