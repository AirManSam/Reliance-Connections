<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliance Connections (RC) CRM</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen overflow-hidden">
  <div id="app" class="h-full flex flex-col"></div>

  <script>
    // --- INITIAL STATE ---
    let appState = {
      currentUser: null,
      users: [
        { id: 'u1', name: 'Samuel Corson', email: 'manager@reliance.com', password: 'admin123', role: 'manager' },
        { id: 'u2', name: 'Jason Daniell', email: 'jason@reliance.com', password: '123', role: 'csr' },
        { id: 'u3', name: 'Alicia Lee', email: 'dispatch@reliance.com', password: '123', role: 'csr' },
        { id: 'u4', name: 'Nathan Libraty', email: 'tech@reliance.com', password: '123', role: 'tech' },
        { id: 'u5', name: 'Jason Plymale', email: 'jasonp@reliance.com', password: '123', role: 'tech' },
        { id: 'u6', name: 'Gena Abby', email: 'abby@reliance.com', password: '123', role: 'parts' },
        { id: 'u7', name: 'Tyler Cox', email: 'tcox@reliance.com', password: '123', role: 'tech' }
      ],
      currentView: 'dashboard',
      selectedCustomerId: null,
      searchTerm: '',
      // Audit Log Filters state
      auditLogRole: 'ALL',
      date: new Date().toISOString().split('T')[0],
      trades: ['HVAC', 'Gates', 'Generator', 'Plumbing', 'Electrical'],
      techStatuses: ['In Field', 'Available', 'On Break'],
      contacts: [
        { id: 'c1', name: 'Lowe Commercial', phone: '(800) 532-3314', address: '800 E Beaty St, Davidson, NC 28036', type: 'Vendor' },
        { id: 'c2', name: 'LiftMaster Tech Support', phone: '(800) 528-2806', address: '300 Windsor Dr, Oak Brook, IL 60523', type: 'Support' }
      ],
      knowledgeBase: [
        { id: 'kb1', title: 'Rooftop AHU Service Manual', category: 'HVAC', fileType: 'PDF', url: '#', date: '2024-01-10', notes: 'Includes refrigerant pressures & wiring diagrams.' },
        { id: 'kb2', title: 'Diagnostic & Voltage Formulas', category: 'Electrical', fileType: 'DOCX', url: '#', date: '2024-01-15', notes: 'Ohms law calculations, ATS troubleshooting, and load testing.' },
        { id: 'kb3', title: 'Barrier Loop Wire Guidance', category: 'Gates', fileType: 'PDF', url: '#', date: '2024-02-01', notes: 'Induction loops and keypad access wiring.' }
      ],
      priceBook: [
        { code: 'HVAC-PM-4', title: 'Semi-Annual Tune-Up', rate: 150.00, description: 'Filter replacement, coil inspection, check electrical.' },
        { code: 'GEN-DIAG6', title: 'Test & System Run Inspection', rate: 175.00, description: 'Transfer switch test and battery check.' },
        { code: 'PLM-FLUSH-3', title: 'Tankless Flush', rate: 220.00, description: 'Flush with descaling solution to remove mineral deposits.' },
        { code: 'GATE-ROUT6', title: 'Automatic Gate Arm Lube & Align', rate: 125.00, description: 'Re-align gate tracks, safety sensors, grease mechanisms.' },
        { code: 'ELE-INSP6', title: '200A Electrical Panel Inspection', rate: 200.00, description: 'Thermal camera hot spot check & fault verification.' }
      ],
      customers: [
        {
          id: 'cust1',
          name: 'Apex Plaza',
          contactPerson: 'Steve Miller',
          phone: '(555) 234-5678',
          email: 'steve@apexplaza.com',
          address: '742 Evergreen Terrace, Suite 100',
          equipment: [
            { id: 'eq1', name: 'Rooftop Unit - 10 Ton', model: 'TRN-884920-X', serial: 'TRN-2023-01', installedDate: '2021-04-10', lastExtMaint: '2024-03-01', filterSize: '20x25x2' },
            { id: 'eq2', name: 'Emergency Backup Generator 60kW', model: 'CAT-99201-BN', serial: 'CAT-2020-11', installedDate: '2020-11-05', fuelType: 'Diesel', lastExtMaint: 'Monthly' }
          ]
        },
        {
          id: 'cust2',
          name: 'Eleanor Vance',
          contactPerson: 'Eleanor Vance',
          phone: '(555) 876-5432',
          email: 'eleanor@birchwood.org',
          address: '1042 Birchwood Lane',
          equipment: [
            { id: 'eq3', name: 'Rinnai Tankless Water Heater', model: 'RU199iN', serial: 'RIN-5542E', installedDate: '2022-05-26', lastExtMaint: 'Annual Flush Due' }
          ]
        }
      ],
      workOrders: [
        {
          id: 'WO-88216K',
          customerId: 'cust1',
          techId: 'u4',
          status: 'In Progress',
          type: 'Preventative Maintenance',
          trade: 'HVAC',
          description: 'Routine maintenance and filter replacement.',
          scheduledDate: '2024-04-02',
          totalAmount: 350.00,
          spiff: 15.00,
          lineItems: [
            { code: 'FLT-2025', description: 'Heavy Duty Air Filters (3 Pack)', qty: 1, unitPrice: 45.00, spiff: 5.00 },
            { code: 'R410A-CYL', description: 'Refrigerant Cylinder Charge', qty: 2, unitPrice: 152.50, spiff: 10.00 }
          ],
          activityLog: [
            { timestamp: '2024-04-02 08:15', user: 'Nathan Libraty', notes: 'Arrived on site.' },
            { timestamp: '2024-04-02 09:12', user: 'Nathan Libraty', notes: 'Updated status to In Progress.' }
          ]
        }
      ],
      auditLog: [
        { id: 'al1', timestamp: '2024-04-02 08:00', user: 'Samuel Corson', role: 'manager', action: 'Assigned WO-88216K to Nathan Libraty.' }
      ]
    };

    // State Management via LocalStorage
    function loadAppState() {
      const saved = localStorage.getItem('_crm_state_v10');
      return saved ? JSON.parse(saved) : appState;
    }

    function saveAppState() {
      localStorage.setItem('_crm_state_v10', JSON.stringify(appState));
    }

    appState = loadAppState();

    // --- MAIN RENDERER ---
    function renderApp() {
      const root = document.getElementById('app');
      if (!appState.currentUser) {
        root.innerHTML = renderLoginScreen();
      } else {
        root.innerHTML = `
          <div class="flex h-full overflow-hidden">
            ${renderSidebar()}
            <div class="flex-1 flex flex-col overflow-hidden bg-slate-900">
              ${renderHeader()}
              <main class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                ${renderMainContent()}
              </main>
            </div>
          </div>
        `;
      }
    }

    // --- LOGIN SCREEN ---
    function renderLoginScreen() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-700"></div>
            <div class="flex items-center gap-3 mb-6">
              <div class="bg-red-600/30 p-3 rounded-xl border border-red-500/30">
                <i class="fa-solid font-extrabold text-2xl text-white">R</i>
              </div>
              <div>
                <h1 class="text-xl font-extrabold tracking-tight text-white ml-0.5">RELIANCE CONNECTIONS</h1>
                <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold mt-1">CRM System</p>
              </div>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-5">
              <div>
                <label class="block text-xs uppercase text-slate-400 font-semibold mb-2">Select User Account</label>
                <select id="userSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-red-500">
                  ${appState.users.map(u => `<option value="${u.id}">${u.name} (${u.role.toUpperCase()})</option>`).join('')}
                </select>
              </div>
              <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('userSelect').value;
      appState.currentUser = appState.users.find(u => u.id === id);
      saveAppState();
      renderApp();
    }

    function handleLogout() {
      appState.currentUser = null;
      saveAppState();
      renderApp();
    }

    // --- SIDEBAR & HEADER ---
    function renderSidebar() {
      const views = [
        { id: 'dashboard', name: 'Dashboard', icon: 'fa-chart-pie' },
        { id: 'multi-dispatch', name: 'Multi-Dispatch', icon: 'fa-boxes-stacked' },
        { id: 'work-orders', name: 'Work Orders & Estimates', icon: 'fa-screwdriver-wrench' },
        { id: 'company-pricebook', name: 'Price Book', icon: 'fa-clipboard-list' },
        { id: 'knowledge-base', name: 'Manuals & Formulas', icon: 'fa-folder-open' },
        { id: 'customers', name: 'Customers & Assets', icon: 'fa-building' },
        { id: 'contacts', name: 'Contacts Directory', icon: 'fa-address-book' },
        { id: 'audit-log', name: 'Activity Log', icon: 'fa-clock-rotate-left' }
      ];

      return `
        <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col">
          <div class="p-5 border-b border-slate-800 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-red-600 flex-shrink-0 flex items-center justify-center font-black">RC</div>
            <div class="truncate">
              <h2 class="font-bold text-sm text-slate-100 truncate">Reliance Connections</h2>
              <p class="text-[10px] text-slate-500 capitalize font-semibold">${appState.currentUser.role}</p>
            </div>
          </div>
          <nav class="flex-1 p-3 space-y-1">
            ${views.map(v => `
              <button onclick="switchView('${v.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${appState.currentView === v.id ? 'bg-red-600/20 text-red-400 border border-red-500/30' : 'text-slate-400 hover:bg-slate-900'}">
                <i class="fa-solid ${v.icon} w-5 text-center"></i>
                <span>${v.name}</span>
              </button>
            `).join('')}
          </nav>
          <div class="p-4 border-t border-slate-800">
            <button onclick="handleLogout()" class="w-full py-2 bg-slate-900 text-slate-400 hover:text-white rounded-lg text-xs font-semibold border border-slate-800">Sign Out</button>
          </div>
        </aside>
      `;
    }

    function renderHeader() {
      return `
        <header class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
          <input type="text" placeholder="Search..." value="${appState.searchTerm}" oninput="handleSearch(this.value)" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm w-64 text-slate-200 focus:outline-none focus:border-red-500" />
          <div class="text-sm font-bold text-slate-200">${appState.currentUser.name}</div>
        </header>
      `;
    }

    function switchView(view) {
      appState.currentView = view;
      saveAppState();
      renderApp();
    }

    function handleSearch(val) {
      appState.searchTerm = val;
      saveAppState();
      renderApp();
    }

    // --- MAIN RENDER SWITCH ---
    function renderMainContent() {
      switch (appState.currentView) {
        case 'dashboard':
          const completedCount = appState.workOrders.filter(w => w.status !== 'Completed').length;
          const totalAmount = appState.workOrders.reduce((acc, c) => acc + (c.totalAmount || 0), 0);
          const totalSpiffs = appState.workOrders.reduce((acc, c) => acc + (c.spiff || 0), 0);
          return `
            <div class="space-y-6">
              <h3 class="text-xl font-bold">Welcome, ${appState.currentUser.name}</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-950 p-4 border border-slate-800 rounded-xl">
                  <div class="text-xs text-slate-500 uppercase font-semibold">Active Work Orders</div>
                  <div class="text-2xl font-black mt-1">${completedCount}</div>
                </div>
                <div class="bg-slate-950 p-4 border border-slate-800 rounded-xl">
                  <div class="text-xs text-slate-500 uppercase font-semibold">Pipeline Revenue</div>
                  <div class="text-2xl font-black text-emerald-400 mt-1">$${totalAmount.toFixed(2)}</div>
                </div>
                <div class="bg-slate-950 p-4 border border-slate-800 rounded-xl">
                  <div class="text-xs text-slate-500 uppercase font-semibold">SPIFF Bonuses Awarded</div>
                  <div class="text-2xl font-black text-amber-400 mt-1">$${totalSpiffs.toFixed(2)}</div>
                </div>
              </div>
            </div>
          `;
        case 'multi-dispatch':
          return `
            <div class="space-y-6">
              <h3 class="text-xl font-bold">Multi-Dispatch Matrix</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${appState.users.filter(u => u.role === 'tech').map(tech => `
                  <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div class="font-bold border-b border-slate-800 pb-2 mb-2">${tech.name}</div>
                    <div class="space-y-2">
                      ${appState.workOrders.filter(w => w.techId === tech.id).map(wo => `
                        <div class="bg-slate-900 p-2 rounded text-xs border border-slate-800">
                          <div class="font-mono font-bold text-red-400">${wo.id}</div>
                          <div>${wo.description}</div>
                        </div>
                      `).join('') || '<div class="text-xs text-slate-500 italic">No assigned orders</div>'}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'work-orders':
          return `
            <div class="space-y-6">
              <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold">Work Orders & Estimates</h3>
                <button onclick="openCreateWOModal()" class="bg-red-600 text-white text-xs px-3 py-2 rounded font-semibold">+ New WO</button>
              </div>
              <div class="space-y-4">
                ${appState.workOrders.map(wo => `
                  <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                      <span class="font-mono font-bold text-red-500">${wo.id}</span>
                      <span class="text-xs bg-slate-800 px-2 py-0.5 rounded">${wo.status}</span>
                    </div>
                    <p class="text-sm text-slate-300">${wo.description}</p>
                    <div class="flex justify-between text-xs text-slate-400">
                      <span>Total: <strong class="text-emerald-400">$${wo.totalAmount.toFixed(2)}</strong></span> <span>Spiff: <strong class="text-amber-400">$${wo.spiff.toFixed(2)}</strong></span>
                    </div>
                    <div>
                      <label class="text-[10px] text-slate-500 uppercase font-semibold mb-1 block">Update Status</label>
                      <select onchange="updateWO('${wo.id}', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-xs">
                        ${['Unassigned', 'Dispatched', 'In Progress', 'Completed'].map(s => `<option value="${s}" ${wo.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                      </select>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'company-pricebook':
          return `
            <div class="space-y-6">
              <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold">Standard Company Price Book</h3>
                <button onclick="addPriceBookItem()" class="bg-red-600 text-white text-xs px-3 py-2 rounded font-semibold">+ Add Code</button>
              </div>
              <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-900 text-xs text-slate-400 uppercase">
                    <tr><th class="p-3">Code</th><th class="p-3">Title</th><th class="p-3 text-right">Rate</th></tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800">
                    ${appState.priceBook.map(pb => `
                      <tr>
                        <td class="p-3 font-mono text-red-400 font-bold">${pb.code}</td>
                        <td class="p-3">${pb.title}</td> <td class="p-3 text-right font-mono text-emerald-400">$${pb.rate.toFixed(2)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        case 'knowledge-base':
          return `
            <div class="space-y-6">
              <h3 class="text-xl font-bold">Manuals & Formulas Base</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${appState.knowledgeBase.map(kb => `
                  <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                    <div class="text-xs text-slate-500 font-mono">${kb.fileType} -${kb.category}</div>
                    <h4 class="font-bold text-slate-200 mt-1">${kb.title}</h4>
                    <p class="text-xs text-slate-400 mt-2">${kb.notes}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'customers':
          return `
            <div class="space-y-6">
              <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold">Customers & Equipment</h3>
                <button onclick="addCustomer()" class="bg-red-600 text-white text-xs px-3 py-2 rounded font-semibold">+ Add Customer</button>
              </div>
              <div class="space-y-4">
                ${appState.customers.map(c => `
                  <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                    <h4 class="font-bold text-slate-100">${c.name}</h4>
                    <p class="text-xs text-slate-400 mb-2">${c.address} -${c.phone}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                      ${c.equipment.map(e => `
                        <div class="bg-slate-900 p-2 rounded text-xs border border-slate-800">
                          <div class="font-semibold text-slate-200">${e.name}</div>
                          <div class="text-slate-500">Model: ${e.model} | S/N: ${e.serial}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'contacts':
          return `
            <div class="space-y-6">
              <h3 class="text-xl font-bold">Contacts Directory</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${appState.contacts.map(c => `
                  <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                    <span class="text-[10px] bg-red-600/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded uppercase font-bold">${c.type}</span>
                    <h4 class="font-bold text-slate-200 mt-2">${c.name}</h4>
                    <div class="text-xs text-slate-400 mt-1">${c.phone}</div>
                    <div class="text-xs text-slate-500">${c.address}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'audit-log':
          return `
            <div class="space-y-6">
              <h3 class="text-xl font-bold">Audit Log</h3>
              <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-900 text-slate-400 uppercase">
                    <tr><th class="p-3">Time</th><th class="p-3">User</th><th class="p-3">Action</th></tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800">
                    ${appState.auditLog.map(al => `
                      <tr>
                        <td class="p-3 font-mono text-slate-500">${al.timestamp}</td>
                        <td class="p-3 font-semibold text-slate-200">${al.user}</td>
                        <td class="p-3 text-slate-300">${al.action}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        default:
          return `<div>Select a view from the sidebar</div>`;
      }
    }

    // Modal Actions
    function updateWO(woId, val) {
      const wo = appState.workOrders.find(w => w.id === woId);
      if (wo) {
        wo.status = val;
        saveAppState();
        renderApp();
      }
    }

    function openCreateWOModal() {
      const desc = prompt("Enter Service Description:");
      if (!desc) return;
      appState.workOrders.push({
        id: 'WO-' + Math.floor(1000 + Math.random() * 9000),
        customerId: 'cust1',
        techId: 'u4',
        status: 'Dispatched',
        type: 'Service Call',
        trade: 'HVAC',
        description: desc,
        scheduledDate: new Date().toISOString().split('T')[0],
        totalAmount: 150.00,
        spiff: 10.00,
        lineItems: [],
        activityLog: []
      });
      saveAppState();
      renderApp();
    }

    function addPriceBookItem() {
      const code = prompt("Enter Code (e.g. H-REPAIR):");
      if (!code) return;
      const title = prompt("Enter Title:");
      const rate = parseFloat(prompt("Enter Rate ($):", "100.00")) || 0;
      appState.priceBook.push({ code, title, rate, description: '' });
      saveAppState();
      renderApp();
    }

    function addCustomer() {
      const name = prompt("Enter Customer Name:");
      if (!name) return;
      appState.customers.push({
        id: 'cust-' + Date.now(),
        name,
        contactPerson: name,
        phone: '(555) 123-4567',
        email: 'info@client.com',
        address: '123 Main St',
        equipment: []
      });
      saveAppState();
      renderApp();
    }

    renderApp();
  </script>
</body>
</html>
